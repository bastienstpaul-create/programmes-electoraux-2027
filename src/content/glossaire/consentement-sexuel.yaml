terme: Consentement (en droit pénal sexuel)
definition: Depuis la loi du 6 novembre 2025, le viol et les agressions sexuelles sont définis comme des actes sexuels non consentis. Le consentement doit être libre et éclairé, spécifique, préalable et révocable ; il s'apprécie selon les circonstances et ne peut pas être déduit du seul silence ou de la seule absence de réaction. Il n'y a jamais consentement en cas de violence, contrainte, menace ou surprise.
exemple: La même loi ajoute les actes bucco-anaux non consentis à la définition du viol.
