terme: Règlement européen sur l'IA (AI Act)
definition: Règlement de l'Union européenne de 2024 qui classe les systèmes d'intelligence artificielle selon leur niveau de risque. Certains usages sont interdits ; les systèmes « à haut risque » (recrutement, éducation, biométrie…) doivent respecter des obligations de qualité, de documentation et de contrôle humain.
exemple: Les obligations des systèmes à haut risque ont été reportées au 2 décembre 2027 par un règlement de juillet 2026.
lien:
  titre: EUR-Lex – Règlement (UE) 2024/1689
