terme: Dissuasion nucléaire
definition: Stratégie qui consiste à posséder l'arme nucléaire pour décourager toute attaque contre les « intérêts vitaux » du pays, par la menace de dommages inacceptables. En France, elle repose sur des sous-marins et des avions ; la décision d'emploi appartient au seul président de la République.
exemple: 'En mars 2026, le président a annoncé une « dissuasion avancée » : des pays européens peuvent participer aux exercices, sans partage de la décision.'
