terme: Bourse sur critères sociaux
definition: Aide financière versée par l'État aux étudiants selon les revenus et la situation de leur famille. Son montant dépend d'un échelon. Les boursiers bénéficient aussi de tarifs réduits, par exemple au restaurant universitaire.
exemple: 656 114 étudiants étaient boursiers en 2025-2026, soit 34,5 % des inscrits dans le supérieur.
