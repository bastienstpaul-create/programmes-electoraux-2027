terme: Solidarité à la source
definition: Réforme qui utilise les salaires et revenus déclarés par les employeurs et les organismes pour pré-remplir les déclarations de ressources des allocataires, au lieu de leur demander de tout déclarer eux-mêmes. Elle vise à réduire les erreurs et les sommes versées à tort.
exemple: Généralisée en mars 2025 pour le RSA et la prime d'activité.
lien:
  titre: Assemblée nationale – Rapport spécial « Solidarité, insertion et égalité des chances », PLF 2026
  url: https://www.assemblee-nationale.fr/dyn/17/rapports/cion_fin/l17b1996-tiii-a43_rapport-fond.pdf
