terme: Zone économique exclusive (ZEE)
definition: Espace maritime qui prolonge les eaux territoriales, jusqu'à 200 milles marins (environ 370 km) des côtes au plus. Selon la convention des Nations unies sur le droit de la mer, l'État côtier y a des droits particuliers, notamment pour exploiter les ressources (pêche, énergie, sous-sol).
exemple: La ZEE française couvre environ 10,9 millions de km², dont plus de 10,5 millions en outre-mer.
