terme: Charges de service public de l'énergie
definition: 'Sommes que l''État verse aux fournisseurs pour compenser des missions de service public, surtout le soutien aux énergies renouvelables : il paie la différence entre le prix garanti au producteur et le prix du marché. Quand le prix du marché dépasse le prix garanti, ce sont les producteurs qui reversent la différence.'
exemple: 'En 2022 et 2023, ces charges sont devenues négatives : l''État a reçu plus de 4,4 Md€.'
lien:
  titre: Avis du Comité de gestion des charges de service public de l'électricité sur la PPE3
