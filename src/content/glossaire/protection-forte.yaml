terme: Protection forte
definition: Label français attribué à une zone qui a ses propres objectifs de conservation, une réglementation durable qui supprime ou réduit fortement les pressions sur la nature, et une gestion exemplaire. Il est plus exigeant que le simple classement en aire protégée. Les cœurs de parcs nationaux sont classés automatiquement en protection forte.
exemple: En juin 2025, 4,8 % des eaux françaises étaient en protection forte, mais seulement 0,1 % des eaux de l'Hexagone.
