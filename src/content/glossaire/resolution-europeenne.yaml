terme: Résolution européenne
definition: Texte voté par l'Assemblée nationale ou le Sénat sur un projet d'acte ou une question européenne, sur le fondement de l'article 88-4 de la Constitution. Il exprime la position de l'assemblée mais n'oblige pas le gouvernement.
exemple: Le 12 mars 2025, l'Assemblée a adopté une résolution européenne sur le soutien à l'Ukraine.
lien:
  titre: Conseil constitutionnel – Texte de la Constitution (article 88-4)
