terme: Neutralité carbone
definition: 'Situation où les émissions de gaz à effet de serre d''un pays sont compensées par les absorptions qu''il réalise : forêts, prairies, sols, zones humides, ou procédés industriels de captage et stockage du carbone. La France s''est fixé cet objectif pour 2050.'
exemple: Pour y parvenir, la France doit diviser ses émissions par plus de six entre 1990 et 2050.
lien:
  titre: Assemblée nationale – Projet de loi relatif à l'énergie et au climat (2019)
