terme: Congrès du Parlement
definition: Réunion des députés et des sénateurs à Versailles. Il sert notamment à approuver une révision de la Constitution proposée par le Président, sans passer par un référendum. Le texte doit alors obtenir trois cinquièmes des suffrages exprimés ; le Congrès ne peut pas le modifier.
exemple: Le 4 mars 2024, le Congrès a approuvé l'inscription de la liberté de recourir à l'IVG dans la Constitution.
