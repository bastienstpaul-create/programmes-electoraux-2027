terme: Loi de finances (PLF)
definition: Loi votée chaque année qui fixe les recettes et les dépenses de l'État. Le gouvernement dépose un projet de loi de finances (PLF) à l'automne ; la première partie porte sur les recettes, la seconde sur les dépenses.
exemple: La loi de finances pour 2026 a été promulguée le 19 février 2026 ; le PLF pour 2027 est en discussion.
