terme: Retraite par répartition
definition: Les cotisations versées par les personnes qui travaillent servent à payer, la même année, les pensions des retraités. C'est le principe de base du système français. Son équilibre dépend notamment du nombre de cotisants par rapport au nombre de retraités.
exemple: En 2025, on comptait environ 30,6 millions de personnes en emploi pour 17,4 millions de retraités de droit direct.
