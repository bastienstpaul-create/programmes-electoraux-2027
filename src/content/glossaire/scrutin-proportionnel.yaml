terme: Scrutin proportionnel
definition: Mode d'élection où les sièges sont répartis entre les listes en fonction de leur part des voix. Ses effets dépendent de la taille des circonscriptions (département, région, pays), d'un éventuel seuil minimal de voix et d'une éventuelle prime au parti arrivé en tête.
exemple: Selon une analyse publiée par La Grande Conversation (2024), une proportionnelle par département laisserait 93 sièges sur 577 dans des départements n'élisant que 1 à 3 députés, où l'effet proportionnel est faible.
