terme: Fibre optique jusqu'à l'abonné (FttH)
definition: Réseau internet fixe où la fibre optique va jusqu'au logement ou au local professionnel, à la place de l'ancien réseau en cuivre. Un local est dit « raccordable » quand la fibre passe à proximité ; il est « raccordé » quand un abonnement y est installé.
exemple: Fin juin 2026, 43,1 millions de locaux étaient raccordables à la fibre.
