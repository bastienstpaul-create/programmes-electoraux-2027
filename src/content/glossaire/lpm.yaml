terme: LPM (loi de programmation militaire)
definition: Loi qui fixe, pour plusieurs années, les moyens financiers et humains des armées et les grands équipements à acheter. Chaque budget annuel doit en principe la suivre, mais seule la loi de finances de l'année autorise réellement la dépense.
exemple: La LPM 2024-2030, actualisée en août 2026, prévoit 435,7 milliards d'euros pour la mission « Défense » sur sept ans.
