terme: Stockage d'eau agricole (retenues, « bassines »)
definition: Ouvrages qui stockent de l'eau, souvent prélevée en hiver dans une rivière ou une nappe, pour irriguer pendant l'été. Les « retenues de substitution » sont censées remplacer des prélèvements d'été. Leur construction donne lieu à des conflits d'usage.
exemple: Depuis 2025, certains ouvrages situés en zone de déficit d'eau sont présumés d'intérêt général majeur.
