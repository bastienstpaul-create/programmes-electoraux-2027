terme: TVA (taxe sur la valeur ajoutée)
definition: Impôt sur la consommation, inclus dans le prix payé par le client final. Le taux normal est de 20 % ; des taux réduits de 10 %, 5,5 % et 2,1 % s'appliquent à certains produits (alimentation, médicaments remboursables, etc.).
exemple: Les carburants sont taxés au taux normal de 20 %.
