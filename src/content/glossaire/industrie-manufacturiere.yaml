terme: Industrie manufacturière
definition: 'Ensemble des activités qui transforment des matières en produits : alimentation, textile, chimie, métallurgie, automobile, aéronautique, électronique, etc. Elle exclut l''énergie, l''eau, les mines et la construction.'
exemple: Elle représentait 10,8 % de la valeur ajoutée en France début 2025.
