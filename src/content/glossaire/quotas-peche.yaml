terme: Quotas de pêche (possibilités de pêche)
definition: Quantités maximales de poissons d'une espèce que l'on peut pêcher dans une zone, fixées chaque année au niveau de l'Union européenne sur la base d'avis scientifiques. Elles sont réparties entre les États selon une clé stable, puis chaque État répartit sa part entre ses navires selon des critères transparents, qui peuvent être environnementaux, sociaux et économiques.
exemple: Chaque navire de pêche français dispose de quotas annuels définis par l'UE ; les prises accessoires sont aussi comptées.
lien:
  titre: EUR-Lex – Règlement (UE) n° 1380/2013, articles 16 et 17
