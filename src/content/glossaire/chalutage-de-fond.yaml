terme: Chalutage de fond
definition: Technique de pêche qui consiste à traîner un filet (le chalut) au contact du fond de la mer. Selon le ministère chargé de la mer, les engins traînants de fond (chalut, senne, drague) ont un effet avéré sur les fonds marins (frottement, sédiments remis en suspension, destruction d'habitats) et sont peu sélectifs.
exemple: Depuis 1990, les filets remorqués sont interdits dans la bande des 3 milles le long des côtes, sauf dérogations.
