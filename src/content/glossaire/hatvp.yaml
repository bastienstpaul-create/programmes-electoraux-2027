terme: HATVP (Haute Autorité pour la transparence de la vie publique)
definition: Autorité indépendante qui reçoit et contrôle les déclarations de patrimoine et d'intérêts des responsables publics. Elle donne aussi un avis sur les passages entre public et privé et tient le répertoire des représentants d'intérêts.
exemple: En 2025, elle a contrôlé 5 795 déclarations et transmis 57 dossiers à la justice.
