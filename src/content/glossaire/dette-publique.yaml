terme: Dette publique (au sens de Maastricht)
definition: Total des emprunts que les administrations publiques doivent rembourser. Elle augmente chaque année du montant du déficit, à quelques ajustements près. C'est la mesure utilisée par l'Union européenne pour comparer les pays.
exemple: Fin juin 2026, la dette publique française atteignait 3 595,5 milliards d'euros, soit 119,0 % du PIB.
