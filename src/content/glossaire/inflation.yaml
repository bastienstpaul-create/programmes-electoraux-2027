terme: Inflation
definition: Hausse générale et durable des prix, qui fait perdre de la valeur à la monnaie. En France, elle est mesurée par l'indice des prix à la consommation (IPC), calculé chaque mois par l'Insee.
exemple: +3,4 % sur un an en octobre 2026 (estimation provisoire).
