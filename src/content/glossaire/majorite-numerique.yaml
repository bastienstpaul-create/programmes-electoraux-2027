terme: Majorité numérique
definition: Âge à partir duquel une personne peut s'inscrire seule sur un réseau social. La loi du 7 juillet 2023 l'avait fixé à 15 ans, avec possibilité d'accord parental avant cet âge, mais elle n'est jamais entrée en vigueur. En 2026, une interdiction des réseaux sociaux avant 15 ans a été censurée par le Conseil constitutionnel.
exemple: Les conditions d'utilisation de TikTok et d'Instagram fixent un âge minimal de 13 ans, issu du droit américain.
