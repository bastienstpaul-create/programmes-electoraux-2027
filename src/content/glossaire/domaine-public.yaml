terme: Domaine public (œuvres)
definition: Ensemble des œuvres que chacun peut utiliser librement, sans autorisation ni paiement de droits d'auteur. En règle générale, une œuvre y entre soixante-dix ans après la mort de son auteur.
exemple: Un éditeur peut publier un roman de Victor Hugo sans verser de droits à ses héritiers.
