terme: TIAN (traité sur l'interdiction des armes nucléaires)
definition: 'Traité international qui interdit de mettre au point, de détenir ou d''utiliser des armes nucléaires. Aucun pays qui possède l''arme nucléaire n''y a adhéré. La France n''a pas participé à sa négociation : elle le juge incompatible avec le traité de non-prolifération (TNP).'
exemple: En juillet 2025, le gouvernement a indiqué que la France n'entend pas participer aux réunions des États parties, même comme observatrice.
