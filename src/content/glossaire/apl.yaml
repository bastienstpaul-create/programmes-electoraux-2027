terme: Aides personnelles au logement (APL, ALF, ALS)
definition: 'Aides publiques qui réduisent le loyer ou les remboursements d''emprunt des ménages modestes. Il en existe trois : l''APL pour les logements conventionnés, l''allocation de logement familiale et l''allocation de logement sociale. Leur montant dépend des revenus, du loyer et de la composition du foyer.'
exemple: En 2025, les aides personnelles au logement ont représenté 16,4 milliards d'euros.
