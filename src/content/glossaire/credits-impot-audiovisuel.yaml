terme: Crédits d'impôt cinéma et audiovisuel
definition: 'Réductions d''impôt accordées aux entreprises de production pour une partie de leurs dépenses de tournage et de fabrication réalisées en France. Il en existe quatre : cinéma, audiovisuel, international (pour les productions étrangères) et jeu vidéo.'
exemple: Le crédit d'impôt cinéma couvre 20 à 30 % des dépenses éligibles, dans la limite de 30 millions d'euros par film.
