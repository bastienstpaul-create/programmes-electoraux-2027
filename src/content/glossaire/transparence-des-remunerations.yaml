terme: Transparence des rémunérations (directive européenne)
definition: Ensemble de règles fixées par la directive (UE) 2023/970 pour faire respecter le principe « à travail égal ou de même valeur, salaire égal » entre femmes et hommes. Les employeurs doivent informer les candidats sur la rémunération proposée, répondre aux salariés qui demandent les niveaux de rémunération moyens par sexe, publier des écarts de rémunération et, en cas d'écart injustifié d'au moins 5 % dans une catégorie de salariés, mener une évaluation avec les représentants du personnel.
exemple: Le projet de loi français prévoit d'interdire les clauses qui empêchent un salarié de révéler son propre salaire.
