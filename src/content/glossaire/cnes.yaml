terme: CNES (Centre national d'études spatiales)
definition: Agence spatiale française, créée en 1961. Ce centre public propose au Gouvernement la politique spatiale et la met en œuvre. Il dépend de trois ministères (recherche, armées, industrie), gère la base de lancement de Kourou en Guyane et verse la contribution de la France à l'Agence spatiale européenne.
exemple: En 2025, le budget du CNES était de 2 537 millions d'euros, dont 897 millions pour la contribution à l'ESA.
lien:
  titre: Sénat – La politique spatiale française et européenne (L'essentiel, juin 2024)
