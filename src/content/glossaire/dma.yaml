terme: DMA (règlement sur les marchés numériques)
definition: Règlement européen de 2022 qui impose des obligations particulières aux très grandes entreprises du numérique désignées comme « contrôleurs d'accès » (moteurs de recherche, réseaux sociaux, magasins d'applications…), pour préserver la concurrence.
exemple: La Commission européenne a désigné en 2023 les services de réseau social de Meta et de ByteDance (TikTok) au titre du DMA.
