terme: Soins palliatifs et d'accompagnement
definition: Soins destinés aux personnes atteintes d'une maladie grave, en particulier en fin de vie, pour soulager la douleur et la souffrance psychique, et répondre aux besoins sociaux et spirituels. Ils ne visent pas à guérir. Ils incluent le soutien des proches.
exemple: La loi du 26 mai 2026 crée des maisons d'accompagnement et de soins palliatifs, entre le domicile et l'hôpital.
