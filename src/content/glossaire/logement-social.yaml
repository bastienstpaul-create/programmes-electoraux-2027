terme: Logement social (HLM)
definition: Logement loué par un organisme HLM ou une société d'économie mixte à un loyer plafonné, à des ménages dont les revenus ne dépassent pas certains plafonds. Il est réservé aux ménages sous plafonds de ressources et attribué par une commission d'attribution (CALEOL) réunissant notamment le bailleur, le maire et le préfet.
exemple: Au 1er janvier 2025, la France comptait 5,4 millions de logements sociaux, avec un loyer moyen de 6,76 € par m².
