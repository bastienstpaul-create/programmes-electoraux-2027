terme: ARENH (accès régulé à l'électricité nucléaire historique)
definition: Dispositif qui obligeait EDF à vendre à prix fixe une partie de sa production nucléaire aux fournisseurs d'électricité concurrents. Il a pris fin le 31 décembre 2025 ; les tarifs réglementés reflètent depuis les prix du marché de gros.
