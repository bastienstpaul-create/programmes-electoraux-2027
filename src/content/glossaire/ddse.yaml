terme: Surveillance électronique (bracelet électronique)
definition: Le condamné exécute sa peine chez lui avec un bracelet qui signale s'il ne respecte pas ses horaires. Elle peut être prononcée comme peine (détention à domicile sous surveillance électronique, DDSE) ou accordée pour aménager une peine de prison.
exemple: Au 1er octobre 2026, 16 693 personnes écrouées étaient placées sous surveillance électronique.
lien:
  titre: Cour des comptes – Évaluation de deux peines alternatives à l'incarcération (2025)
