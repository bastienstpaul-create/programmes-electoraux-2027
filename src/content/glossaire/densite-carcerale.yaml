terme: Densité carcérale
definition: 'Nombre de personnes détenues pour 100 places de prison disponibles. Au-delà de 100 %, il y a plus de détenus que de places : c''est la surpopulation carcérale.'
exemple: Au 1er octobre 2026, la densité était de 143,3 % en moyenne, et de 178 % dans les maisons d'arrêt.
lien:
  titre: Ministère de la Justice – Mesure de l'incarcération au 1er octobre 2026
