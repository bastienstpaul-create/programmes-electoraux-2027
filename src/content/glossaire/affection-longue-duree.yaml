terme: Affection de longue durée (ALD)
definition: Maladie grave ou chronique (cancer, diabète, etc.) reconnue par l'assurance maladie. Les soins liés à cette maladie sont remboursés à 100 % du tarif de la Sécurité sociale.
exemple: La hausse du nombre de patients en ALD explique en partie la baisse du reste à charge moyen depuis 2010.
