terme: Néonicotinoïdes
definition: Famille d'insecticides qui agissent sur le système nerveux des insectes. Leur usage, et celui des semences traitées avec ces produits, est interdit en France par le code rural, sauf dérogations prévues par la loi.
exemple: Depuis la loi de 2026, l'Anses peut autoriser l'acétamipride pour les noisettes, sous conditions.
lien:
  titre: Conseil constitutionnel – Décision n° 2026-914 DC du 14 août 2026
