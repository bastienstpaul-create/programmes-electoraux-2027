terme: DSA (règlement sur les services numériques)
definition: 'Règlement européen de 2022 qui fixe les obligations des intermédiaires en ligne : retirer les contenus illicites signalés, expliquer le fonctionnement des algorithmes de recommandation, protéger les mineurs. Les très grandes plateformes doivent évaluer et réduire leurs risques ; la Commission européenne les contrôle.'
exemple: La Commission européenne a publié le 14 juillet 2025 des lignes directrices sur la protection des mineurs en ligne.
lien:
  titre: EUR-Lex – Règlement (UE) 2022/2065
