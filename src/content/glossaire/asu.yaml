terme: Allocation de solidarité unifiée (ASU)
definition: 'Projet du gouvernement présenté en 2026 pour harmoniser le calcul du RSA, de la prime d''activité et des aides au logement : mêmes ressources prises en compte, même définition du foyer, même période de référence. Les trois aides resteraient distinctes. Le texte n''avait pas été adopté en novembre 2026.'
exemple: Un « revenu social de référence » commun serait disponible vers 2030 selon le gouvernement.
lien:
  titre: Assemblée nationale – Question écrite n° 16284 sur le projet d'ASU
  url: https://questions.assemblee-nationale.fr/q17/17-16284QE.htm
