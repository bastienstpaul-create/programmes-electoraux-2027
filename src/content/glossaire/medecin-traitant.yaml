terme: Médecin traitant
definition: Médecin, souvent généraliste, que l'assuré déclare à l'assurance maladie pour coordonner son suivi. Sans médecin traitant déclaré, les consultations sont moins bien remboursées, sauf exceptions.
exemple: En 2025, 6,4 millions d'assurés n'avaient pas de médecin traitant.
lien:
  titre: Sénat – Rapport n° 668 sur les déserts médicaux (2026)
