terme: APD (aide publique au développement)
definition: Dons et prêts à conditions avantageuses que les États accordent aux pays en développement, comptés selon des règles communes de l'OCDE. On la compare souvent au revenu national brut (RNB), c'est-à-dire aux revenus des habitants et des entreprises d'un pays, y compris ceux reçus de l'étranger.
exemple: En 2025, l'aide française représentait 0,42 % du revenu national brut ; la loi de 2021 visait 0,7 % en 2025.
