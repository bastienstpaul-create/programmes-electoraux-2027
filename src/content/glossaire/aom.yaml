terme: Autorité organisatrice de la mobilité (AOM)
definition: Collectivité chargée d'organiser les transports publics et les autres services de mobilité sur son territoire (bus, transport à la demande, covoiturage, vélo…). Ce rôle revient aux intercommunalités (AOM locales) et aux régions (AOM régionales, qui organisent aussi les TER). Si une communauté de communes ne prend pas cette compétence, c'est la région qui l'exerce.
exemple: En 2025, la moitié des communautés de communes sont AOM ; l'autre moitié a laissé ce rôle à la région.
