terme: Passoire énergétique (ou thermique)
definition: Logement classé F ou G au diagnostic de performance énergétique, c'est-à-dire mal isolé et très consommateur d'énergie. Ces logements deviennent progressivement interdits à la location.
exemple: Au 1er janvier 2025, 3,9 millions de résidences principales étaient des passoires énergétiques (12,7 %).
