terme: Tarification à l'activité (T2A)
definition: 'Mode de financement des hôpitaux et cliniques selon le nombre et le type de séjours réalisés : chaque séjour est payé selon un tarif national. Il s''ajoute à des dotations forfaitaires pour certaines missions.'
exemple: Les soins palliatifs à l'hôpital sont financés en grande partie par ces tarifs de séjour.
lien:
  titre: Sénat – Rapport n° 266 sur les soins palliatifs (2026)
