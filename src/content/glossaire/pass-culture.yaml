terme: Pass Culture
definition: Dispositif public, accessible par une application, qui donne aux jeunes un crédit à dépenser en livres, places de cinéma, concerts, cours ou spectacles. Il comprend une part individuelle et une part collective, qui finance des activités culturelles pour les classes de la 6e à la terminale.
exemple: Depuis mars 2025, un jeune reçoit 50 euros à 17 ans et 150 euros à 18 ans, utilisables pendant quatre ans.
