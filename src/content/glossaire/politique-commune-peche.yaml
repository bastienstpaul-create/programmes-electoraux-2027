terme: Politique commune de la pêche (PCP)
definition: Ensemble des règles européennes qui encadrent la pêche dans les eaux de l'Union. C'est l'UE, et non chaque État, qui fixe les quantités de poissons que l'on peut pêcher, les zones d'accès et une partie des règles sur les engins de pêche.
exemple: La PCP permet à la France de réserver la bande des 12 milles à ses pêcheurs locaux jusqu'en 2032.
lien:
  titre: EUR-Lex – Règlement (UE) n° 1380/2013 relatif à la politique commune de la pêche
