terme: Loi SRU (article 55)
definition: Règle issue de la loi « solidarité et renouvellement urbain » de 2000. Elle oblige les communes moyennes et grandes des agglomérations à avoir 20 % ou 25 % de logements sociaux. Les communes en retard paient un prélèvement et doivent rattraper leur retard tous les trois ans.
exemple: En 2024, 1 276 des 2 196 communes concernées n'atteignaient pas leur taux cible.
