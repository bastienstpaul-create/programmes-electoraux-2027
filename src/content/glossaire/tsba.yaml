terme: Taxe de solidarité sur les billets d'avion (TSBA)
definition: Taxe versée par les compagnies aériennes sur les billets des passagers qui partent de France. Elle est aujourd'hui appelée « tarif de solidarité de la taxe sur le transport aérien de passagers ». Une partie de son produit finance les infrastructures de transport.
exemple: Ses tarifs ont été relevés au 1er mars 2025 par la loi de finances pour 2025. En 2026, 271 millions d'euros de son produit sont affectés à l'agence de financement des infrastructures de transport.
