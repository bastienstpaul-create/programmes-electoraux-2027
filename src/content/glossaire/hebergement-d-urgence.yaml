terme: Hébergement d'urgence
definition: Places financées par l'État (centres d'hébergement, hôtels) pour accueillir, sans condition, toute personne sans abri qui le demande, notamment via le numéro 115. L'orientation est assurée dans chaque département par un service intégré d'accueil et d'orientation (SIAO).
exemple: Le parc généraliste comptait 203 758 places au 31 décembre 2024.
