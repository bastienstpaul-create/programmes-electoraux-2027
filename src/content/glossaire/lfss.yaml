terme: LFSS (loi de financement de la sécurité sociale)
definition: 'Loi votée chaque année par le Parlement : elle fixe les recettes, les objectifs de dépenses et le déficit prévu de la Sécurité sociale, dont la branche retraite. Elle peut aussi modifier les règles de retraite.'
exemple: La LFSS pour 2026 a suspendu en partie la réforme de 2023 ; le projet de loi (PLFSS) pour 2027 est en discussion au Parlement.
