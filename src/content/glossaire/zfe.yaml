terme: Zone à faibles émissions mobilité (ZFE)
definition: Périmètre urbain où les véhicules les plus polluants ne peuvent pas circuler, au moins à certaines heures. Le niveau de pollution d'un véhicule est indiqué par sa vignette Crit'Air (de 0 pour les véhicules électriques à 5 pour les plus polluants). Les ZFE ont été créées par la loi d'orientation des mobilités de 2019, puis rendues obligatoires dans les agglomérations de plus de 150 000 habitants par la loi Climat et résilience de 2021.
exemple: Fin 2025, 25 ZFE étaient actives en France. Leur suppression, votée dans la loi de simplification de la vie économique, a été censurée par le Conseil constitutionnel le 21 mai 2026.
