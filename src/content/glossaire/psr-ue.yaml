terme: Prélèvement sur recettes au profit de l'UE (PSR-UE)
definition: Part des recettes de l'État français versée directement au budget de l'Union européenne. Son montant est voté chaque année dans la loi de finances. Il ne comprend pas les droits de douane, collectés par la France pour le compte de l'UE.
exemple: 30,9 milliards d'euros prévus dans le projet de loi de finances pour 2027.
