terme: Titre de séjour
definition: 'Document qui autorise un étranger non européen à s''installer et vivre en France. Il est délivré par la préfecture pour un motif précis (travail, études, famille, protection) et pour une durée variable : un an, plusieurs années (carte pluriannuelle) ou dix ans (carte de résident).'
exemple: En 2025, 384 230 premiers titres de séjour ont été délivrés.
