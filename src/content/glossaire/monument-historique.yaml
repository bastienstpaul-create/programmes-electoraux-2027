terme: Monument historique
definition: Immeuble (ou objet) protégé par l'État pour son intérêt historique ou artistique, selon un régime créé par une loi de 1913. Il peut être « classé » (protection la plus forte) ou « inscrit ». Les travaux y sont encadrés et peuvent être aidés par l'État.
exemple: Fin 2025, 45 446 immeubles étaient protégés, de la grotte de Lascaux au château de Versailles.
