terme: SAU (surface agricole utile)
definition: 'Surface réellement cultivée ou utilisée pour l''élevage : terres labourables, prairies permanentes et cultures permanentes (vignes, vergers). Elle ne comprend pas les bois ni les bâtiments.'
exemple: En 2020, une exploitation française avait en moyenne 69 hectares de SAU.
