terme: Taxe au tonnage
definition: Mode d'imposition que peuvent choisir les compagnies maritimes, pour dix ans. Au lieu de payer l'impôt sur les sociétés sur leurs bénéfices réels, elles paient un impôt calculé sur la capacité (le tonnage) de leurs navires. Presque tous les pays européens ont un régime de ce type.
exemple: En 2022, année de profits records du fret, l'écart avec l'impôt normal a été chiffré à 3,8 milliards d'euros ; il est estimé à 620 millions d'euros pour 2026.
