terme: Ressources propres de l'UE
definition: 'Recettes qui financent le budget européen : droits de douane, part de la TVA, contribution calculée sur le revenu national brut de chaque État, et depuis 2021 une contribution sur les emballages plastiques non recyclés. Leur liste est fixée à l''unanimité puis approuvée par chaque État.'
exemple: La France verse 0,80 € par kilo de plastique non recyclé, soit environ 1,4 milliard d'euros par an.
lien:
  titre: EUR-Lex – Décision (UE, Euratom) 2020/2053 relative au système des ressources propres
  url: https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:32020D2053
