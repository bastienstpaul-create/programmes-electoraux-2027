terme: Réserve opérationnelle
definition: Ensemble des citoyens volontaires qui servent dans les armées à temps partiel, en plus de leur métier ou de leurs études, après une formation militaire. Ils renforcent les militaires d'active (de carrière ou sous contrat).
exemple: Le gouvernement prévoit 57 500 réservistes opérationnels fin 2027 ; la loi vise un réserviste pour deux militaires d'active en 2035.
