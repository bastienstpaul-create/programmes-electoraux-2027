terme: Récidive
definition: 'Au sens strict (récidive légale), un second crime ou délit commis dans un délai fixé par la loi après une première condamnation : la peine encourue est doublée. Au sens large, utilisé dans les études, toute nouvelle infraction après une condamnation ou une sortie de prison.'
exemple: 33 % des personnes sorties de prison récidivent dans l'année suivant leur libération (Cour des comptes, 2025).
lien:
  titre: Cour des comptes – Évaluation de deux peines alternatives à l'incarcération (2025)
