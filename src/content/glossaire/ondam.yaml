terme: Ondam (objectif national de dépenses d'assurance maladie)
definition: Plafond de dépenses de l'assurance maladie voté chaque année par le Parlement dans la loi de financement de la sécurité sociale. Il couvre les soins de ville, l'hôpital et une partie du médico-social. S'il risque d'être dépassé, une procédure d'alerte oblige à prendre des mesures.
exemple: Pour 2027, le Gouvernement propose un Ondam de 278,7 milliards d'euros, en hausse de 2,0 %.
