terme: Grand port maritime (GPM)
definition: Établissement public placé sous la tutelle de l'État qui gère l'un des principaux ports de commerce et ses zones industrielles et logistiques. Les autres ports maritimes de commerce relèvent des collectivités territoriales.
exemple: La France compte 6 grands ports maritimes dans l'Hexagone (dont HAROPA, Marseille-Fos et Dunkerque) et 4 en outre-mer.
