terme: Aspa (allocation de solidarité aux personnes âgées)
definition: Aide qui complète les ressources des personnes âgées dont la retraite est faible, souvent appelée « minimum vieillesse ». À la mort du bénéficiaire, les sommes versées peuvent être récupérées sur l'héritage au-delà d'un certain montant.
exemple: 1 043,59 € par mois au maximum pour une personne seule en 2026.
