terme: Durée d'assurance (trimestres)
definition: 'Nombre de trimestres validés au cours de la carrière : périodes travaillées, mais aussi certaines périodes de chômage, de maladie ou de maternité, ou des trimestres accordés pour les enfants. Une année compte au maximum 4 trimestres.'
exemple: 172 trimestres, soit 43 ans, sont exigés pour les personnes nées à partir de 1966.
