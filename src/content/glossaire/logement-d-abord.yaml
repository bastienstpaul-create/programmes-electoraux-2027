terme: Logement d'abord
definition: 'Politique publique qui donne la priorité à l''accès des personnes sans domicile à un logement durable, avec un accompagnement : logements loués via une association (intermédiation locative), pensions de famille, logements très sociaux. Un premier plan a été lancé en 2018, un second couvre 2023-2027.'
exemple: Selon le Sénat, 550 000 personnes ont été relogées dans le cadre du premier plan entre 2018 et 2023.
lien:
  titre: Sénat – Rapport sur le projet de loi de finances pour 2026, Logement et ville
