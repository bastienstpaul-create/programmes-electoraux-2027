terme: SNBC (stratégie nationale bas-carbone)
definition: Feuille de route de la France pour réduire ses émissions de gaz à effet de serre jusqu'à la neutralité carbone en 2050. Elle fixe des plafonds d'émissions par période de cinq ans (budgets carbone) et par secteur (transports, bâtiments, agriculture…).
exemple: La troisième SNBC (SNBC 3) était encore à l'état de projet en juillet 2026.
