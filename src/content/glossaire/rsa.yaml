terme: RSA (revenu de solidarité active)
definition: Aide versée par la CAF ou la MSA aux personnes de 25 ans ou plus (ou plus jeunes avec un enfant à charge) dont les ressources sont très faibles. Elle complète les revenus du foyer jusqu'à un montant minimum, qui dépend de la composition de la famille. Elle est en principe financée par les départements ; l'État a repris ce financement dans quelques territoires à titre expérimental ou en outre-mer.
exemple: Environ 652 € par mois pour une personne seule sans ressources en mai 2026 ; 977,54 € pour un couple sans enfant.
