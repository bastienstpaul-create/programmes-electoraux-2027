terme: EPR2
definition: Nouveau modèle de réacteur nucléaire conçu par EDF, dérivé de l'EPR de Flamanville. Le programme prévoit six réacteurs, construits par paires à Penly, Gravelines et au Bugey.
exemple: La mise en service du premier EPR2, à Penly, est attendue en 2038.
lien:
  titre: Cour des comptes – La filière EPR (janvier 2025)
  url: https://www.vie-publique.fr/files/rapport/pdf/296839.pdf
