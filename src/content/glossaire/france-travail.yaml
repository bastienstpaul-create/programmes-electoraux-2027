terme: France Travail
definition: Opérateur public de l'emploi, organisé par la loi pour le plein emploi de 2023. Il inscrit et accompagne les demandeurs d'emploi, verse les allocations chômage et, depuis 2025, accompagne aussi les demandeurs du RSA, inscrits automatiquement.
exemple: Depuis 2025, un demandeur du RSA signe un contrat d'engagement avec son organisme référent.
