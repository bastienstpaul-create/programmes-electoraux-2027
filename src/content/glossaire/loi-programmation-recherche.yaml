terme: Loi de programmation de la recherche (LPR)
definition: Loi du 24 décembre 2020 qui fixe pour 2021 à 2030 une trajectoire de hausse des moyens de la recherche publique et des mesures sur les carrières des chercheurs. Chaque loi de finances annuelle décide ensuite des crédits réellement accordés.
exemple: Pour 2027, le Sénat relève 13 millions d'euros prévus pour les universités au titre de la LPR, contre 91 millions inscrits dans la trajectoire.
lien:
  titre: Conseil constitutionnel – Décision n° 2020-810 DC
  url: https://www.conseil-constitutionnel.fr/decision/2020/2020810DC.htm
