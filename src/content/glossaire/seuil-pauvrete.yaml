terme: Seuil de pauvreté (pauvreté monétaire)
definition: Une personne est dite pauvre quand son niveau de vie est inférieur à 60 % du niveau de vie médian (celui qui partage la population en deux moitiés). Le niveau de vie tient compte de tous les revenus du ménage, après impôts et prestations, et du nombre de personnes qui y vivent.
exemple: 1 337 € par mois pour une personne seule en 2024.
