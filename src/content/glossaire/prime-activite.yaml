terme: Prime d'activité
definition: Complément de revenu versé chaque mois par la CAF aux personnes de 18 ans ou plus qui travaillent et gagnent peu. Son montant dépend des revenus et de la composition du foyer. Créée par la loi du 17 août 2015, elle a remplacé le « RSA activité » et la prime pour l'emploi.
exemple: 4,69 millions de foyers en bénéficiaient en juin 2025.
