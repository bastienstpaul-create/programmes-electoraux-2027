terme: PPE (programmation pluriannuelle de l'énergie)
definition: 'Document fixé par le gouvernement qui définit, pour dix ans, les priorités de l''État pour chaque forme d''énergie : objectifs de production par filière (nucléaire, éolien, solaire…), de baisse de la consommation, de réseaux et de stockage. La troisième PPE couvre 2026-2035 ; elle a été adoptée par décret.'
exemple: La PPE3 prévoit 15 GW d'éoliennes en mer en 2035.
