terme: Accord UE-Mercosur
definition: Accord commercial entre l'Union européenne et quatre pays d'Amérique du Sud (Argentine, Brésil, Paraguay, Uruguay). Il supprime la plupart des droits de douane entre les deux zones et fixe des quotas à droits réduits pour certains produits agricoles (bœuf, volaille, sucre).
exemple: Appliqué à titre provisoire depuis le 1er mai 2026.
lien:
  titre: Sénat – L'essentiel sur la résolution relative à l'accord avec le Mercosur (novembre 2025)
