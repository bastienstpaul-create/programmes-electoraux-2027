terme: Amende forfaitaire délictuelle (AFD)
definition: Amende d'un montant fixe infligée sur place par un policier ou un gendarme pour certains délits, sans passage devant un juge. Elle n'est pas une condamnation, mais a vocation à figurer au casier judiciaire. Depuis la LOPMI de 2023, elle peut concerner 91 délits.
exemple: Depuis le 1er septembre 2020, l'usage de stupéfiants peut être sanctionné par une AFD de 200 € (montant minoré ou majoré selon le délai de paiement).
lien:
  titre: Cour des comptes – Le bilan des amendes forfaitaires délictuelles (2026)
  url: https://www.vie-publique.fr/files/rapport/pdf/302836.pdf
