terme: LOPJ (loi d'orientation et de programmation de la justice)
definition: Loi du 20 novembre 2023 qui programme les crédits et les recrutements du ministère de la Justice de 2023 à 2027. Elle contient aussi des réformes de procédure.
exemple: Elle prévoit 10 000 emplois supplémentaires, dont 1 500 magistrats et 1 800 greffiers.
