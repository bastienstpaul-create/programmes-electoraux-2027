terme: DPE (diagnostic de performance énergétique)
definition: Document qui classe un logement de A (le plus économe) à G (le plus énergivore). Le propriétaire doit le fournir au locataire. Il sert de base aux interdictions de location des logements les plus énergivores.
exemple: Depuis le 1er janvier 2025, un logement classé G ne peut plus être loué pour un bail signé, renouvelé ou reconduit.
