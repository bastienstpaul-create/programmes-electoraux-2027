terme: Service national
definition: Le service national universel (SNU), lancé en 2019, reposait surtout sur des séjours de cohésion pour des jeunes volontaires. Depuis septembre 2026, un service national militaire volontaire de 10 mois est ouvert aux Français de 18 à 25 ans.
exemple: Environ 3 000 volontaires pour la première année, avec une solde d'environ 800 euros bruts par mois.
