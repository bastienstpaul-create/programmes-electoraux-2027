terme: Artiste-auteur
definition: 'Personne qui crée des œuvres et est payée principalement en droits d''auteur : écrivain, illustrateur, photographe, compositeur, plasticien, scénariste… Elle n''est pas salariée et relève d''un régime de sécurité sociale propre, sans assurance chômage.'
exemple: Selon une mission de l'Assemblée nationale (2025), seuls 50 000 artistes-auteurs dépassent le seuil d'affiliation à la retraite (10 485 euros par an).
