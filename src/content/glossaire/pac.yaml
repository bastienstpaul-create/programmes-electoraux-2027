terme: PAC (politique agricole commune)
definition: 'Politique de l''Union européenne qui finance l''agriculture et le développement rural. Elle comprend deux « piliers » : les aides directes aux agriculteurs et les aides au développement rural. Pour 2023-2027, chaque pays l''applique à travers un plan stratégique national.'
exemple: La PAC impose de consacrer au moins 3 % des crédits au soutien des agriculteurs de moins de 40 ans.
