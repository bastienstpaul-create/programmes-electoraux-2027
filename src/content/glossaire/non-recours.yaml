terme: Non-recours
definition: 'Situation d''une personne qui a droit à une aide mais ne la perçoit pas : elle ne la connaît pas, ne la demande pas, trouve les démarches trop complexes ou craint de devoir rembourser.'
exemple: Fin 2021, entre 33 % et 37 % des foyers éligibles au RSA ne le percevaient pas.
lien:
  titre: Mes Droits Sociaux – simulateur public des aides
  url: https://www.mesdroitssociaux.gouv.fr/
