terme: Illectronisme
definition: Situation d'une personne qui n'utilise pas internet ou qui n'a aucune compétence numérique de base (rechercher une information, communiquer, protéger ses données, utiliser un logiciel, résoudre un problème simple). L'Insee la mesure avec un indicateur européen.
exemple: En 2025, 7 % des 16-74 ans étaient en situation d'illectronisme.
