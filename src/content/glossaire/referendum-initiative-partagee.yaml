terme: Référendum d'initiative partagée (RIP)
definition: 'Procédure créée par la révision constitutionnelle du 23 juillet 2008 : un cinquième des membres du Parlement dépose une proposition de loi, qui doit ensuite être soutenue par un dixième des électeurs inscrits (environ 4,7 millions) en neuf mois. Si les deux assemblées n''examinent pas ensuite le texte dans le délai prévu, le Président de la République le soumet au référendum.'
exemple: En 2019-2020, la proposition sur Aéroports de Paris a recueilli 1 093 030 soutiens, sous le seuil de 4 717 396.
lien:
  titre: Conseil constitutionnel – Décision n° 2019-1-9 RIP (observations)
