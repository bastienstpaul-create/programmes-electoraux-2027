terme: Apprentissage
definition: 'Formation en alternance : l''apprenti, âgé en général de 16 à 29 ans, signe un contrat de travail avec un employeur et suit des cours dans un centre de formation d''apprentis. Il prépare un diplôme ou un titre professionnel.'
exemple: 846 700 contrats d'apprentissage ont commencé en 2025.
