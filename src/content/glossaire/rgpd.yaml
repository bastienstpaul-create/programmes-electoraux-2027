terme: RGPD (règlement général sur la protection des données)
definition: 'Règlement européen de 2016 qui fixe les règles d''utilisation des données personnelles : base légale nécessaire (par exemple le consentement), droits des personnes (accès, rectification, effacement), sécurité des données, sanctions jusqu''à 4 % du chiffre d''affaires mondial.'
exemple: En France, le traitement des données d'un mineur de moins de 15 ans fondé sur son consentement exige aussi l'accord d'un parent.
lien:
  titre: CNIL – Le règlement général sur la protection des données
