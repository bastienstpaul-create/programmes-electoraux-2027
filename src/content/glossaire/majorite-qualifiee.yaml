terme: Majorité qualifiée
definition: 'Règle de vote habituelle au Conseil de l''UE : une décision est adoptée si au moins 55 % des États (15 sur 27) la soutiennent et s''ils représentent au moins 65 % de la population de l''Union. Elle s''oppose à l''unanimité, où un seul État peut bloquer.'
exemple: La politique étrangère, la fiscalité et l'entrée de nouveaux États restent décidées à l'unanimité.
