terme: CNC (Centre national du cinéma et de l'image animée)
definition: Établissement public qui soutient le cinéma, l'audiovisuel, l'animation et le jeu vidéo. Il est financé par des taxes sur la diffusion des œuvres (billets de cinéma, chaînes de télévision, plateformes vidéo) et attribue des aides automatiques et sélectives.
exemple: Ses aides représentent chaque année près de 700 millions d'euros pour le secteur, selon la Cour des comptes.
