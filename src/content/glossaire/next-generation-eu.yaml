terme: Next Generation EU
definition: 'Plan de relance européen adopté en 2020 après la crise du Covid-19 : 750 milliards d''euros (prix de 2018), dont 390 milliards de subventions et 360 milliards de prêts. Il est financé par un emprunt commun de l''UE, remboursé par le budget européen à partir de 2028.'
exemple: La France a reçu 40,3 milliards d'euros de subventions.
