terme: TRACC (trajectoire de réchauffement de référence pour l'adaptation au changement climatique)
definition: 'Scénario officiel de réchauffement sur lequel l''État et les collectivités doivent fonder leurs politiques d''adaptation : +2 °C dans le monde en 2050 et +3 °C en 2100, soit environ +4 °C dans l''Hexagone en 2100. Elle est inscrite dans le code de l''environnement.'
lien:
  titre: Haut Conseil pour le climat – Rapport annuel 2026, résumé
