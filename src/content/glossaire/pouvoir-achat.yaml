terme: Pouvoir d'achat
definition: Quantité de biens et de services qu'un revenu permet d'acheter. Il augmente quand les revenus progressent plus vite que les prix. L'Insee le calcule pour l'ensemble des ménages, ou par « unité de consommation » pour tenir compte de la taille des ménages.
exemple: +28,9 % pour l'ensemble des ménages entre 2005 et 2025, +13,4 % par unité de consommation.
