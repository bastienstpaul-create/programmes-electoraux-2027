terme: Zone tendue
definition: Territoire où la demande de logements dépasse nettement l'offre, ce qui rend l'accès au logement difficile. Juridiquement, ce sont les communes où s'applique la taxe sur les logements vacants. Des règles particulières y valent pour les loyers.
exemple: En zone tendue, la hausse du loyer entre deux locataires est limitée, même hors des villes qui pratiquent l'encadrement des loyers.
