terme: PTZ (prêt à taux zéro)
definition: Prêt sans intérêts accordé par les banques pour aider des ménages à acheter leur résidence principale ; l'État compense les intérêts aux banques par un crédit d'impôt. Ses conditions (zones, type de logement, montants) sont fixées par la loi de finances et par décret.
exemple: Depuis avril 2025, il est ouvert aux logements neufs sur tout le territoire jusqu'à fin 2027.
