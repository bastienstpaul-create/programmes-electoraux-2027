terme: Octroi de mer
definition: Taxe propre aux départements et régions d'outre-mer, appliquée surtout aux marchandises importées (octroi de mer externe) et, dans une moindre mesure, aux produits fabriqués sur place (octroi de mer interne). Ses taux sont fixés par les collectivités. Son produit finance principalement les communes et les régions. Le droit européen autorise un taux plus faible pour les productions locales.
exemple: L'octroi de mer a rapporté 1 644 millions d'euros en 2022, soit en moyenne 32 % des produits de gestion des collectivités d'outre-mer.
