terme: OQTF (obligation de quitter le territoire français)
definition: Décision du préfet qui ordonne à un étranger en situation irrégulière de quitter la France. Si la personne ne part pas d'elle-même, l'État peut organiser un éloignement forcé.
exemple: En 2022, 134 280 OQTF ont été prononcées ; environ 10 % ont été exécutées selon la Cour des comptes.
