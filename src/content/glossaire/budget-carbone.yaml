terme: Budget carbone
definition: Quantité maximale de gaz à effet de serre que la France s'autorise à émettre sur une période de cinq ans, fixée par la stratégie nationale bas-carbone. Il est décliné par grands secteurs.
exemple: Le 3e budget carbone couvre les années 2024 à 2028.
