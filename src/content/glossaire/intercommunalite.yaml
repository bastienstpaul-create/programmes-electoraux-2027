terme: Intercommunalité (EPCI à fiscalité propre)
definition: Regroupement de communes qui exercent ensemble certaines compétences et perçoivent leurs propres impôts (d'où « à fiscalité propre »). Selon la taille, il s'agit d'une communauté de communes, d'une communauté d'agglomération, d'une communauté urbaine ou d'une métropole.
exemple: Au 1er janvier 2026, les 34 875 communes sont regroupées en 1 252 intercommunalités à fiscalité propre.
