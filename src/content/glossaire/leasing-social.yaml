terme: Leasing social
definition: Location longue durée d'une voiture électrique neuve, sans apport initial et avec un loyer mensuel réduit grâce à une aide publique, réservée aux ménages modestes. Le dispositif a d'abord été ouvert début 2024, puis financé à partir de 2025 par les certificats d'économies d'énergie.
exemple: En six semaines début 2024, 50 000 ménages modestes en ont bénéficié, plus que le nombre de ménages modestes ayant reçu le bonus écologique en 2023 (30 000).
