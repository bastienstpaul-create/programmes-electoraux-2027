terme: Aire marine protégée (AMP)
definition: 'Zone de mer délimitée où des règles visent à protéger la nature à long terme. Il existe 11 statuts en France (parc national, réserve naturelle, parc naturel marin, site Natura 2000…). Les règles varient beaucoup : certaines aires interdisent presque tout, d''autres autorisent la plupart des activités.'
exemple: 33,6 % des eaux françaises sont couvertes par une aire marine protégée.
