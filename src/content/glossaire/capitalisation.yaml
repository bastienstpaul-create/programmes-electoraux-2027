terme: Retraite par capitalisation
definition: Chaque personne, ou chaque groupe d'assurés, épargne pendant sa vie active. Cette épargne est placée, puis transformée en pension à la retraite. Le montant dépend donc aussi des rendements des placements.
exemple: Le régime additionnel de la fonction publique (RAFP) fonctionne par capitalisation.
