terme: SMIC (salaire minimum interprofessionnel de croissance)
definition: Salaire horaire minimum que doit recevoir tout salarié majeur. Il est revalorisé chaque 1er janvier selon l'inflation et l'évolution des salaires, automatiquement en cours d'année si les prix montent d'au moins 2 %, et le gouvernement peut accorder un « coup de pouce ».
exemple: 12,31 € brut de l'heure depuis le 1er juin 2026.
