terme: Index de l'égalité professionnelle
definition: 'Note sur 100 que les entreprises d''au moins 50 salariés doivent calculer et publier chaque année depuis la loi du 5 septembre 2018. Elle combine plusieurs indicateurs : écart de rémunération (40 points), écart d''augmentations (20), écart de promotions (15, à partir de 250 salariés), augmentations au retour de congé maternité (15) et nombre de femmes parmi les dix plus hautes rémunérations (10). En dessous de 75 points, l''entreprise doit corriger la situation, sous peine d''une pénalité pouvant atteindre 1 % de la masse salariale.'
exemple: En 2026, la note moyenne déclarée était de 88,5 sur 100.
lien:
  titre: Cour des comptes – Les inégalités entre les femmes et les hommes, de l'école au marché du travail (janvier 2025)
  url: https://www.vie-publique.fr/files/rapport/pdf/297071.pdf
