terme: Minimum contributif
definition: Montant minimum de retraite de base versé à une personne qui a droit au taux plein, si l'ensemble de ses retraites reste sous un plafond. Le montant dépend du nombre de trimestres réellement cotisés.
exemple: Au plus 903,94 € brut par mois si tous les trimestres sont cotisés, avec un total de retraites plafonné à 1 410,89 € brut.
