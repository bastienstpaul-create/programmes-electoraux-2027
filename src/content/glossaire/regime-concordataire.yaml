terme: Régime concordataire (Alsace-Moselle)
definition: Règles particulières en vigueur dans le Bas-Rhin, le Haut-Rhin et la Moselle, qui n'étaient pas français lors du vote de la loi de 1905. L'État y rémunère les ministres des cultes catholique, protestants et israélite, et contribue à l'entretien de certains bâtiments religieux. D'autres territoires d'outre-mer ont aussi leurs propres règles (par exemple la Guyane).
exemple: En 2017, ce régime a coûté à l'État environ 39 millions d'euros pour 1 254 emplois cultuels.
