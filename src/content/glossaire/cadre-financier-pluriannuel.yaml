terme: Cadre financier pluriannuel (CFP)
definition: Plan de dépenses de l'Union européenne sur au moins cinq ans (sept ans en pratique). Il fixe des plafonds annuels par grand domaine (agriculture, régions, recherche, action extérieure, administration). Il est adopté à l'unanimité des États, après accord du Parlement européen.
exemple: Le CFP 2021-2027 prévoit 1 074 milliards d'euros d'engagements (prix de 2018) ; celui de 2028-2034 est en négociation.
