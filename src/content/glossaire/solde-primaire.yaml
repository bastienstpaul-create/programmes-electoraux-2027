terme: Solde primaire
definition: Solde des comptes publics sans compter les intérêts de la dette. Quand il est en déficit, l'État emprunte non seulement pour payer ses intérêts, mais aussi pour financer ses autres dépenses.
exemple: Le gouvernement prévoit un déficit primaire de 2,8 points de PIB en 2026 et de 2,1 points en 2027.
