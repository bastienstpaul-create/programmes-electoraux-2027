terme: BITD (base industrielle et technologique de défense)
definition: 'Ensemble des entreprises, des grands groupes aux PME, qui conçoivent et fabriquent les équipements des armées : avions, navires, munitions, logiciels, etc.'
exemple: La loi de 2026 réserve au moins 10 % des crédits d'études de défense aux PME et aux entreprises de taille intermédiaire de la BITD.
