terme: Franchise médicale et participation forfaitaire
definition: 'Petites sommes déduites des remboursements de l''assurance maladie : franchises sur les médicaments, les actes paramédicaux et les transports, participation forfaitaire sur les consultations et les analyses. Leur montant total est plafonné chaque année.'
exemple: La Cour des comptes propose de les prélever directement sur le compte bancaire des assurés.
