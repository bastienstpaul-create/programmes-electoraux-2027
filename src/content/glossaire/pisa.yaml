terme: PISA (Programme international pour le suivi des acquis des élèves)
definition: Enquête internationale de l'OCDE qui mesure, dans de nombreux pays, ce que savent faire les élèves de 15 ans en mathématiques, en lecture et en sciences. Elle permet de comparer les systèmes scolaires.
exemple: Selon PISA 2022, 29 % des élèves de 15 ans en France ont une maîtrise insuffisante en mathématiques.
