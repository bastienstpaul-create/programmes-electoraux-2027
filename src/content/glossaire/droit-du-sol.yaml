terme: Droit du sol
definition: Règle qui permet d'obtenir la nationalité française du fait de sa naissance et de sa résidence en France. La plupart des enfants nés en France de parents étrangers peuvent devenir français à leur majorité, ou plus tôt par déclaration anticipée, entre 13 et 17 ans. Il s'oppose au « droit du sang » (nationalité transmise par les parents).
exemple: À Mayotte, depuis 2025, les deux parents doivent résider régulièrement en France depuis plus d'un an à la naissance de l'enfant.
