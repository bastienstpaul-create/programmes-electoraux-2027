terme: Balance commerciale
definition: Différence entre la valeur des biens exportés et celle des biens importés. Elle est déficitaire quand on importe plus qu'on n'exporte. En France, elle ne couvre que les biens ; les services sont comptés à part.
exemple: Déficit de 65,2 milliards d'euros en 2025.
