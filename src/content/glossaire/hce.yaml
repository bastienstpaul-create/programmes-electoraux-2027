terme: Haut Conseil à l'égalité entre les femmes et les hommes (HCE)
definition: Instance consultative indépendante créée en 2013. Elle conseille le Gouvernement sur les droits des femmes et l'égalité, évalue les politiques publiques et rend des avis sur les projets de texte. Sa formation « Égalité professionnelle » réunit des syndicats, des organisations patronales et des personnalités qualifiées.
exemple: En juin 2026, ses membres se sont divisés sur le projet de loi de transparence des salaires et le HCE n'a pas pu rendre un avis unique.
lien:
  titre: HCE – Avis sur le projet de loi de transposition de la directive sur la transparence des salaires (29 juin 2026)
