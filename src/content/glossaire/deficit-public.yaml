terme: Déficit public
definition: Écart entre les dépenses et les recettes de l'ensemble des administrations publiques (État, Sécurité sociale, collectivités locales) sur une année. On l'exprime souvent en pourcentage du PIB, la richesse produite en un an.
exemple: En 2025, le déficit public était de 152,5 milliards d'euros, soit 5,1 % du PIB.
