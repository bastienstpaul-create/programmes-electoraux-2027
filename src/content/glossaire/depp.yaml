terme: DEPP (Direction de l'évaluation, de la prospective et de la performance)
definition: Service statistique du ministère de l'Éducation nationale. Il compte les élèves et les enseignants, mesure la dépense d'éducation et évalue le niveau des élèves et les effets des réformes.
exemple: Chaque année, la DEPP publie « L'état de l'École », un recueil de 40 fiches d'indicateurs.
lien:
  titre: DEPP – L'état de l'École 2025
  url: https://www.education.gouv.fr/sites/default/files/document/l-tat-de-l-cole-2025-478952.pdf
