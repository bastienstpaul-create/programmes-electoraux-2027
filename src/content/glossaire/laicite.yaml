terme: Laïcité
definition: 'Principe inscrit à l''article 1er de la Constitution (« La France est une République […] laïque ») et organisé par la loi du 9 décembre 1905. L''État est neutre : il ne reconnaît, ne salarie ni ne subventionne aucun culte, et garantit la liberté de croire ou de ne pas croire. Les agents publics doivent rester neutres ; à l''école publique, la loi du 15 mars 2004 interdit aussi aux élèves les signes religieux ostensibles.'
exemple: Le régime des cultes d'Alsace-Moselle est une exception admise par le Conseil constitutionnel.
