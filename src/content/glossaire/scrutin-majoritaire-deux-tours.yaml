terme: Scrutin majoritaire à deux tours
definition: 'Mode d''élection des députés : un seul élu par circonscription. Il faut au premier tour plus de la moitié des voix et au moins un quart des inscrits pour être élu. Sinon, les candidats ayant obtenu au moins 12,5 % des inscrits vont au second tour, où celui qui arrive en tête est élu.'
exemple: En 2024, 577 députés ont été élus dans 577 circonscriptions.
