terme: CNIL (Commission nationale de l'informatique et des libertés)
definition: Autorité administrative indépendante chargée de veiller à la protection des données personnelles. Elle conseille, reçoit les plaintes, contrôle les organismes publics et privés et peut prononcer des amendes.
exemple: En 2025, la CNIL a reçu 20 150 plaintes et prononcé 83 sanctions.
