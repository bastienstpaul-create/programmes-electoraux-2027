terme: PFU (prélèvement forfaitaire unique, ou « flat tax »)
definition: 'Taux unique appliqué depuis 2018 aux revenus de l''épargne et du capital (dividendes, intérêts, plus-values sur actions). À sa création, il était de 30 % : 12,8 % d''impôt sur le revenu et 17,2 % de prélèvements sociaux. On peut choisir à la place l''imposition au barème de l''impôt sur le revenu.'
exemple: La loi de finances pour 2026 a relevé la CSG sur les revenus financiers de 1,4 point.
