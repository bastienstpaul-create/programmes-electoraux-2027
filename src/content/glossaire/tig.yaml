terme: Travail d'intérêt général (TIG)
definition: Peine par laquelle le condamné effectue un travail non rémunéré, pendant un nombre d'heures fixé par le juge, auprès d'un organisme habilité (collectivité, association, établissement public). Elle ne peut être prononcée qu'avec l'accord du condamné.
exemple: Selon la Cour des comptes, un TIG coûtait en moyenne 1 862 € en 2022.
lien:
  titre: Cour des comptes – Évaluation de deux peines alternatives à l'incarcération (2025)
