terme: MaPrimeRénov'
definition: Aide de l'État, gérée par l'Agence nationale de l'habitat (Anah), pour financer des travaux de rénovation énergétique (isolation, chauffage…). Son montant dépend des revenus du ménage. Pour une rénovation d'ampleur, un accompagnement par un professionnel agréé (« Mon Accompagnateur Rénov' ») est obligatoire depuis 2024.
exemple: En 2024, l'aide « par geste » a concerné environ 241 000 logements.
lien:
  titre: SDES – Les rénovations énergétiques par geste aidées par MaPrimeRénov' en 2024
