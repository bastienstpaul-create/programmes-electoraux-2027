terme: Bail réel solidaire (BRS)
definition: Formule d'achat dans laquelle le ménage achète le logement mais pas le terrain, qui reste la propriété d'un organisme foncier solidaire et lui est loué pour un loyer faible, pour 18 à 99 ans. Elle s'adresse aux ménages modestes.
exemple: Selon le Sénat, séparer le terrain du bâti fait baisser le prix du logement de 20 % à 40 % selon les zones.
