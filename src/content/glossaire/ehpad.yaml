terme: Ehpad (établissement d'hébergement pour personnes âgées dépendantes)
definition: 'Maison de retraite médicalisée qui accueille des personnes âgées en perte d''autonomie. Son financement combine trois parts : les soins (assurance maladie), la dépendance (département) et l''hébergement (payé par le résident, avec parfois une aide sociale).'
exemple: Depuis 2025, 23 départements testent un forfait unique qui regroupe les parts soins et dépendance.
