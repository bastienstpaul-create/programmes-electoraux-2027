terme: Agirc-Arrco (retraite complémentaire)
definition: Régime de retraite complémentaire obligatoire des salariés du secteur privé, qui s'ajoute au régime de base. Les cotisations donnent des points ; à la retraite, le nombre de points multiplié par la valeur du point donne le montant de la pension. Le régime est géré par les syndicats et les organisations patronales.
