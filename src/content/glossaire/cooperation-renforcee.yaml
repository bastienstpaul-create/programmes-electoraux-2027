terme: Coopération renforcée
definition: Procédure qui permet à au moins neuf États de l'UE d'avancer ensemble sur un sujet lorsque l'ensemble des États n'y parvient pas. Elle reste ouverte aux autres pays qui veulent la rejoindre plus tard.
exemple: Le prêt de 90 milliards d'euros à l'Ukraine pour 2026-2027 a été décidé ainsi.
