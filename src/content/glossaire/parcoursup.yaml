terme: Parcoursup
definition: Plateforme nationale de préinscription sur laquelle les candidats font leurs vœux pour entrer en première année d'une formation de l'enseignement supérieur. Une formation peut accepter un candidat à condition qu'il suive un accompagnement (réponse « oui si »).
exemple: En 2026, 93,7 % des nouveaux bacheliers inscrits ont reçu au moins une proposition d'admission.
lien:
