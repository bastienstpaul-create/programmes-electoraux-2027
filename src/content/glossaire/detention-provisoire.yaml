terme: Détention provisoire
definition: 'Incarcération d''une personne avant son jugement définitif, décidée par un juge. Elle est en principe exceptionnelle : elle doit être nécessaire à l''enquête ou à la sécurité. La personne est appelée « prévenu ».'
exemple: Au 1er octobre 2026, 24 716 détenus étaient des prévenus, soit 27,2 % des personnes détenues.
