terme: Ofpra et CNDA
definition: L'Office français de protection des réfugiés et apatrides (Ofpra) examine les demandes d'asile et décide d'accorder ou non une protection. En cas de refus, le demandeur peut faire appel devant la Cour nationale du droit d'asile (CNDA).
exemple: En 2025, 41,2 % des décisions de l'Ofpra et 23 % des décisions de la CNDA étaient favorables.
