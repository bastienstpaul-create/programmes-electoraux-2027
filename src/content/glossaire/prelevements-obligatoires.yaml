terme: Prélèvements obligatoires
definition: Ensemble des impôts et des cotisations sociales que les ménages et les entreprises doivent payer aux administrations publiques et à l'Union européenne. Leur poids est mesuré en pourcentage du PIB.
exemple: En 2025, ils représentaient 43,6 % du PIB.
