terme: CIR (crédit d'impôt recherche)
definition: Réduction d'impôt accordée aux entreprises qui font de la recherche et développement. En métropole, elle est égale à 30 % des dépenses de recherche jusqu'à 100 millions d'euros, puis à 5 % au-delà.
exemple: 8,1 milliards d'euros de créances en 2024.
