terme: Immigré / étranger
definition: Un immigré est une personne née étrangère dans un pays étranger et qui vit en France. Un étranger est une personne qui n'a pas la nationalité française. Un immigré devenu français reste immigré ; un enfant né en France de parents étrangers peut être étranger sans être immigré.
exemple: En 2025, 8,0 millions d'immigrés vivaient en France, dont 2,6 millions étaient devenus français.
