terme: Redevances des agences de l'eau
definition: Sommes payées aux six agences de l'eau par les usagers (ménages via leur facture, industriels, agriculteurs) en fonction de l'eau qu'ils prélèvent ou de la pollution qu'ils rejettent. Elles financent des actions de protection de l'eau, selon le principe « pollueur-payeur ».
exemple: En Seine-Normandie, 72 % des redevances viennent des ménages et 5 % des agriculteurs (2013-2022).
lien:
  titre: Conseil d'analyse économique – L'eau sous tension (note n° 87)
