terme: Surtransposition
definition: 'Fait, pour un État, d''aller au-delà de ce qu''exige une directive européenne lorsqu''il la reprend dans son droit : règles supplémentaires, champ élargi, seuils plus stricts, ou non-utilisation des dérogations prévues.'
exemple: Appliquer aux PME une obligation que la directive réserve aux grandes entreprises.
lien:
  titre: Sénat – Rapport d'information n° 743 (2022-2023) sur la simplification des normes
  url: https://www.senat.fr/rap/r22-743/r22-7431.pdf
