terme: Aide à mourir
definition: 'Droit créé par la loi du 18 août 2026 : une personne majeure atteinte d''une maladie grave et incurable en phase avancée ou terminale, avec une souffrance qu''elle juge insupportable ou qui résiste aux traitements, peut être autorisée à recevoir une substance létale. Elle se l''administre elle-même ou, si elle ne le peut pas, se la fait administrer. Les soignants peuvent refuser d''y participer (clause de conscience).'
exemple: Le Conseil constitutionnel a jugé la loi conforme à la Constitution le 14 août 2026, avec trois réserves d'interprétation.
lien:
  titre: Conseil constitutionnel – Décision n° 2026-910 DC
  url: https://www.conseil-constitutionnel.fr/decision/2026/2026910DC.htm
