terme: Féminicide
definition: Meurtre d'une femme ou d'une fille en raison du fait qu'elle est une femme. Ce n'est pas une infraction distincte dans le code pénal français. Les chiffres publics les plus suivis sont ceux des femmes tuées par leur conjoint ou ex-conjoint, recensées chaque année par la Délégation aux victimes du ministère de l'Intérieur. L'Observatoire national des violences faites aux femmes parle aussi de « féminicides indirects » pour les suicides ou tentatives de suicide provoqués par le harcèlement d'un (ex-)conjoint.
exemple: En 2025, 136 personnes, dont 111 femmes, ont été tuées par leur conjoint ou ex-conjoint, soit un décès tous les trois jours en moyenne.
lien:
  titre: Délégation aux victimes – Étude nationale sur les morts violentes au sein du couple 2025
  url: https://www.vie-publique.fr/files/rapport/pdf/305074.pdf
