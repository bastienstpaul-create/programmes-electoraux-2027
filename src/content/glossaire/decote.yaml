terme: Décote (et surcote)
definition: 'La décote réduit la retraite de base quand on part avant 67 ans sans avoir tous les trimestres exigés : le taux de 50 % baisse de 0,625 point par trimestre manquant, dans la limite de 20 trimestres. À l''inverse, la surcote augmente la pension de 1,25 % par trimestre travaillé au-delà de l''âge légal et de la durée exigée.'
exemple: Avec 10 trimestres manquants, le taux passe de 50 % à 43,75 %.
