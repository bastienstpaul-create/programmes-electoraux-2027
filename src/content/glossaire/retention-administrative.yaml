terme: Rétention administrative
definition: Placement d'un étranger qui doit être éloigné dans un centre fermé (centre de rétention administrative, CRA), le temps d'organiser son départ. Ce n'est pas une peine de prison. La durée est contrôlée par un juge et limitée à 90 jours, sauf exceptions pour certains profils.
exemple: En 2024, la France comptait 2 188 places en centre de rétention, dont 1 959 en métropole.
