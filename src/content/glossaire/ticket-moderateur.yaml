terme: Ticket modérateur
definition: Part du tarif d'un soin remboursable qui n'est pas prise en charge par l'assurance maladie. Elle est souvent payée par la complémentaire santé. Elle ne s'applique pas aux soins liés à une affection de longue durée.
exemple: La hausse du ticket modérateur décidée à l'été 2026 doit rapporter 1,2 milliard d'euros.
