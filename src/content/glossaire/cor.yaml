terme: COR (Conseil d'orientation des retraites)
definition: Organisme public d'expertise sur les retraites. Il publie chaque année un rapport qui décrit la situation du système et projette ses dépenses, ses ressources et son solde jusqu'en 2070, à règles inchangées.
lien:
  titre: COR – Rapport annuel juin 2026
  url: https://www.cor-retraites.fr/sites/default/files/2026-06/Synth%C3%A8se_RA_2026.pdf
