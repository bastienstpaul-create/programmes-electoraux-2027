terme: Article 49.3 de la Constitution
definition: Procédure qui permet au Premier ministre de faire adopter un texte sans vote de l'Assemblée nationale, sauf si une motion de censure renversant le gouvernement est votée. Elle peut être utilisée sans limite pour les lois de finances et de financement de la Sécurité sociale.
exemple: La réforme des retraites de 2023 a été adoptée de cette façon.
