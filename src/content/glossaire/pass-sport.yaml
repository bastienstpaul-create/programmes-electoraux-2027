terme: Pass'Sport
definition: Aide de l'État créée en 2021 pour payer une partie de l'inscription d'un jeune dans un club ou une association sportive. Les âges et conditions ont changé presque chaque année.
exemple: Pour la saison 2026-2027, elle est de 50 euros pour les 6-17 ans dont le foyer a un quotient familial CAF ou MSA inférieur ou égal à 699 euros.
