terme: HCFP (Haut Conseil des finances publiques)
definition: Organisme indépendant placé auprès de la Cour des comptes. Il donne un avis public sur les prévisions de croissance et de finances publiques du gouvernement avant l'examen des budgets.
exemple: En septembre 2026, il a jugé « optimiste » la prévision de croissance de 1,0 % pour 2027.
