terme: Compte professionnel de prévention (C2P)
definition: 'Compte de points accordé aux salariés exposés à certains risques professionnels : travail de nuit, travail répétitif, travail en équipes alternantes, etc. Les points servent à se former, à réduire son temps de travail sans perte de salaire ou à partir plus tôt à la retraite.'
