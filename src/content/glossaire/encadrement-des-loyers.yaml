terme: Encadrement des loyers
definition: Dans les communes volontaires situées en zone tendue, le préfet fixe chaque année un loyer de référence par quartier et type de logement. Le loyer de base ne peut pas dépasser un plafond égal à 120 % du loyer médian (le « loyer de référence majoré »), sauf « complément de loyer » justifié par un confort exceptionnel.
exemple: Le dispositif s'applique notamment à Paris depuis juillet 2019.
