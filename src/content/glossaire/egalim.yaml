terme: Lois EGalim
definition: Lois issues des États généraux de l'alimentation (2018, complétée en 2021). Elles encadrent les négociations de prix entre agriculteurs, industriels et supermarchés pour mieux tenir compte des coûts de production, et fixent des objectifs pour les cantines.
exemple: Les cantines publiques doivent acheter 50 % de produits durables et de qualité, dont 20 % de bio.
