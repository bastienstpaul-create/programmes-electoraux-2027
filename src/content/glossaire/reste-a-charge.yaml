terme: Reste à charge
definition: Ce que le patient paie lui-même pour ses soins, après les remboursements de l'assurance maladie et de sa complémentaire santé.
exemple: En 2024, le reste à charge représente 7,8 % de la consommation de soins et de biens médicaux.
