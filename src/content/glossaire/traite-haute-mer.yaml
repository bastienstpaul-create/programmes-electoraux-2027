terme: Traité sur la haute mer (accord BBNJ)
definition: Accord des Nations unies adopté en 2023 pour protéger la vie marine dans les eaux qui n'appartiennent à aucun État (la haute mer, environ deux tiers de l'océan). Il permet de créer des aires marines protégées en haute mer et impose des études d'impact pour certaines activités.
exemple: Le traité est entré en vigueur le 17 janvier 2026, après avoir atteint 60 ratifications ; la loi française autorisant sa ratification date du 13 novembre 2024.
