terme: Droits voisins de la presse
definition: Droit, inscrit dans le code de la propriété intellectuelle, qui permet aux éditeurs et agences de presse d'être rémunérés lorsque des plateformes en ligne (moteurs de recherche, réseaux sociaux) reprennent leurs contenus. La rémunération se négocie avec chaque plateforme.
exemple: Une proposition de loi de 2025-2026 confie à l'Arcom un rôle d'arbitrage en cas d'échec des négociations et prévoit des sanctions jusqu'à 1 % du chiffre d'affaires mondial des plateformes.
