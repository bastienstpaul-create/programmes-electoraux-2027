terme: LOPMI (loi d'orientation et de programmation du ministère de l'intérieur)
definition: 'Loi du 24 janvier 2023 qui fixe les moyens et les priorités du ministère de l''Intérieur pour 2023-2027 : budget, recrutements de policiers et de gendarmes, équipements. Le budget voté chaque année doit en principe suivre cette trajectoire.'
exemple: La LOPMI prévoyait de porter le budget du ministère de l'Intérieur de 20,8 à 25,4 milliards d'euros par an entre 2022 et 2027 (hors pensions).
