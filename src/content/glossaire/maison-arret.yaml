terme: Maison d'arrêt
definition: Prison qui accueille les personnes en attente de jugement et les condamnés à de courtes peines. Les longues peines sont exécutées dans d'autres établissements (centres de détention, maisons centrales). C'est en maison d'arrêt que la surpopulation est la plus forte.
exemple: Au 1er octobre 2026, 120 des 133 maisons d'arrêt ou quartiers de maison d'arrêt dépassaient 120 % d'occupation.
