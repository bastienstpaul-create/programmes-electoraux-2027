terme: AME (aide médicale de l'État)
definition: Prise en charge des soins des étrangers en situation irrégulière qui résident en France depuis plus de trois mois et dont les ressources sont inférieures à un plafond. Elle est financée par l'État, qui rembourse l'Assurance maladie. Certains soins non urgents demandent un accord préalable.
exemple: En 2025, 454 111 personnes en bénéficiaient, pour une dépense de 1,465 milliard d'euros.
lien:
  titre: Rapport Évin-Stefanini sur l'AME (2023)
  url: https://www.vie-publique.fr/files/rapport/pdf/292122.pdf
