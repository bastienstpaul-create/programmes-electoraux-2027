terme: Contribution à l'audiovisuel public (ancienne redevance)
definition: Impôt payé jusqu'en 2022 par chaque foyer possédant un téléviseur, en même temps que la taxe d'habitation. Son produit était affecté aux sociétés de l'audiovisuel public. Il a été supprimé en 2022 et remplacé par une part de la TVA.
exemple: En 2022, elle s'élevait à 138 euros par an en métropole et 88 euros en outre-mer ; 23 millions de foyers la payaient.
