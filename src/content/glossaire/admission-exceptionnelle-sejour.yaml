terme: Admission exceptionnelle au séjour (régularisation)
definition: Procédure qui permet au préfet d'accorder un titre de séjour à un étranger qui ne remplit pas les conditions habituelles, pour des motifs humanitaires ou exceptionnels, après examen de sa situation. On parle couramment de « régularisation ».
exemple: En 2025, 28 610 premiers titres ont été délivrés par cette voie.
