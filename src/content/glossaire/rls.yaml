terme: RLS (réduction de loyer de solidarité)
definition: 'Mécanisme créé en 2018 : les bailleurs sociaux doivent baisser le loyer de leurs locataires qui touchent l''APL, et l''État réduit l''APL presque du même montant. Le coût est donc reporté de l''État vers les organismes HLM.'
exemple: La RLS a représenté 1,3 milliard d'euros par an à partir de 2021, puis 1,1 milliard en 2025.
