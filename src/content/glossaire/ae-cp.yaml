terme: Autorisations d'engagement (AE) et crédits de paiement (CP)
definition: Deux façons de compter un budget public. Les autorisations d'engagement fixent le montant que l'État peut s'engager à dépenser dans l'année, par exemple en signant un contrat sur plusieurs années. Les crédits de paiement correspondent à l'argent réellement versé dans l'année.
exemple: Pour 2027, le projet de budget de la défense prévoit 78,7 milliards d'euros d'autorisations d'engagement et 63,4 milliards de crédits de paiement.
