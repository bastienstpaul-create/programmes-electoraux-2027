terme: AESH (accompagnant d'élèves en situation de handicap)
definition: Personne recrutée par l'Éducation nationale pour aider un ou plusieurs élèves handicapés à suivre les cours en classe ordinaire. Les AESH sont aujourd'hui des agents contractuels, et non des fonctionnaires.
exemple: En 2024-2025, 67 % des 563 300 enfants handicapés scolarisés avec un projet personnalisé étaient accueillis en classe ordinaire.
lien:
  titre: Assemblée nationale – Proposition de loi créant un corps de fonctionnaires pour les AESH
