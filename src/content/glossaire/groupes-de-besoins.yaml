terme: Groupes de besoins (ou groupes de niveau) au collège
definition: Organisation des cours de français et de mathématiques de 6e et de 5e en groupes plus petits que la classe, constitués selon le niveau ou les besoins des élèves. Mise en place à la rentrée 2024 dans le cadre du « Choc des savoirs », elle laisse aux collèges le choix des modalités.
exemple: En 2024-2025, 19 % des collèges ont formé des groupes homogènes et 21 % des groupes hétérogènes.
