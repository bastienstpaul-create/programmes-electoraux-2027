terme: Allocations familiales
definition: Aide mensuelle versée par la CAF aux familles à partir du deuxième enfant à charge. Depuis 2015, son montant baisse quand les revenus du foyer dépassent certains plafonds.
exemple: 152,25 € par mois pour deux enfants si les revenus ne dépassent pas 79 980 € par an.
