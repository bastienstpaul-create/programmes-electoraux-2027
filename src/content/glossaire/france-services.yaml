terme: France services
definition: Réseau de lieux d'accueil de proximité où des conseillers aident les usagers dans leurs démarches administratives courantes auprès d'opérateurs nationaux (onze depuis 2024). Lancé en 2019, il est piloté par l'Agence nationale de la cohésion des territoires et porté localement par des collectivités, La Poste ou des associations.
exemple: Le réseau compte plus de 2 840 lieux d'accueil, dont des points mobiles, et environ 7 000 conseillers.
