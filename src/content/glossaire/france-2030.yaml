terme: France 2030
definition: Plan d'investissement public lancé en octobre 2021, doté de 54 milliards d'euros, pour financer l'innovation et l'industrialisation dans des secteurs choisis (électronique, véhicules, énergie, santé, etc.). Il prend la suite des programmes d'investissements d'avenir lancés depuis 2010.
exemple: Fin 2025, 33 milliards d'euros étaient engagés et près de 14 milliards versés.
lien:
  titre: Cour des comptes – Le plan d'investissement France 2030 (octobre 2026)
