terme: AAH (allocation aux adultes handicapés)
definition: 'Aide versée aux adultes handicapés qui ont peu de ressources, selon leur taux d''incapacité reconnu par la maison départementale des personnes handicapées (MDPH). Depuis octobre 2023, elle est calculée sans tenir compte des revenus du conjoint : c''est la « déconjugalisation ».'
exemple: 1 041,59 € par mois au maximum en 2026 ; 1,37 million de bénéficiaires en juin 2025.
