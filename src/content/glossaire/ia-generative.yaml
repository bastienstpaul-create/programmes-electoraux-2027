terme: IA générative
definition: Intelligence artificielle capable de produire des contenus nouveaux (textes, images, sons, vidéos, code) à partir d'une demande écrite ou orale. Elle s'appuie sur de grands modèles entraînés sur de très grandes quantités de données.
exemple: En 2025, 37 % des 16-74 ans avaient utilisé une IA générative au cours des trois derniers mois.
