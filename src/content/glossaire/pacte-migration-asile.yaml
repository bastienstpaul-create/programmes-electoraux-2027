terme: Pacte européen sur la migration et l'asile
definition: Ensemble de neuf règlements et d'une directive européens adoptés en mai 2024. Il prévoit un contrôle (filtrage) des personnes à leur arrivée aux frontières extérieures de l'Union, des procédures d'asile plus rapides et une solidarité obligatoire entre pays (accueil de demandeurs ou contribution financière). Il s'applique depuis le 12 juin 2026.
exemple: Au titre de la première réserve de solidarité, la France s'est engagée sur 3 000 relocalisations, remplaçables par la prise en charge de demandes relevant d'autres pays.
