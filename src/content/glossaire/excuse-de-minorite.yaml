terme: Atténuation de la responsabilité des mineurs (« excuse de minorité »)
definition: Principe selon lequel un mineur ne peut pas être condamné à plus de la moitié de la peine de prison ou d'amende encourue par un adulte. Pour un mineur de plus de 16 ans, le juge peut l'écarter à titre exceptionnel. Le Conseil constitutionnel le considère comme un principe fondamental reconnu par les lois de la République.
exemple: En 2025, le Conseil a censuré une disposition qui écartait ce principe par défaut pour les mineurs de plus de 16 ans en récidive.
