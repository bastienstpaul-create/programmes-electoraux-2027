terme: Procédure de déficit excessif
definition: Procédure de surveillance de l'Union européenne qui vise un pays dont le déficit dépasse 3 % du PIB. Le pays doit suivre une trajectoire de réduction fixée avec le Conseil de l'Union européenne.
exemple: Elle a été ouverte contre la France à l'été 2024 ; la France s'est engagée à revenir sous 3 % en 2029.
