terme: Éducation prioritaire (REP et REP+)
definition: 'Ensemble d''écoles et de collèges situés dans des quartiers défavorisés, qui reçoivent plus de moyens. Ils sont organisés en réseaux : REP, et REP+ pour les situations les plus difficiles.'
exemple: Depuis 2017, les classes de CP et de CE1 y sont dédoublées. En collège REP+, 70 % des élèves de sixième ont des parents ouvriers ou inactifs.
