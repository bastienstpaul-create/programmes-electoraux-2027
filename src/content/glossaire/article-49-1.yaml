terme: Article 49.1 de la Constitution (vote de confiance)
definition: Le Premier ministre peut demander à l'Assemblée nationale d'approuver son programme ou une déclaration de politique générale. Si l'Assemblée la désapprouve à la majorité des suffrages exprimés, le gouvernement doit démissionner.
exemple: Le 8 septembre 2025, l'Assemblée a désapprouvé la déclaration de politique générale de François Bayrou par 364 voix contre 194.
