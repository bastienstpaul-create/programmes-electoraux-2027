terme: SAFER (sociétés d'aménagement foncier et d'établissement rural)
definition: Organismes chargés de réguler le marché des terres agricoles. Ils peuvent acheter des terres en priorité (droit de préemption) et choisir les repreneurs, pour limiter la spéculation et favoriser l'installation.
exemple: La loi d'urgence agricole de 2026 a modifié les règles de leur droit de préemption.
lien:
  titre: Cour des comptes – La politique d'installation des nouveaux agriculteurs (2023)
  url: https://www.vie-publique.fr/files/rapport/pdf/288992.pdf
