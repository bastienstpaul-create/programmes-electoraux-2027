terme: Primauté du droit européen
definition: 'Principe dégagé par la Cour de justice de l''UE depuis 1964 : les traités et les règles européennes l''emportent sur les lois nationales contraires. En France, le Conseil d''État juge (décision du 21 avril 2021) que la Constitution reste au sommet de l''ordre juridique interne.'
exemple: Un juge français doit écarter une loi contraire à un règlement européen.
lien:
  titre: EUR-Lex – Traités, déclaration n° 17 relative à la primauté
  url: https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:12016M/TXT
