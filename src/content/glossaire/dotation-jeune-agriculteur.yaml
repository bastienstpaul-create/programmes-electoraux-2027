terme: Dotation jeune agriculteur (DJA)
definition: Aide versée aux agriculteurs de moins de 40 ans qui s'installent, à condition de présenter un plan d'entreprise et d'avoir un niveau minimal de formation. Elle est cofinancée par l'Union européenne et gérée par les régions.
exemple: 166 M€ par an en moyenne en 2019-2021.
lien:
  titre: Cour des comptes – La politique d'installation des nouveaux agriculteurs (2023)
  url: https://www.vie-publique.fr/files/rapport/pdf/288992.pdf
