terme: Clause de défense mutuelle (article 42.7)
definition: 'Article du traité sur l''Union européenne : si un État membre est agressé sur son territoire, les autres lui doivent aide et assistance par tous les moyens en leur pouvoir. Pour les pays membres de l''OTAN, celle-ci reste le cadre de leur défense collective.'
exemple: 'Elle ne crée pas d''armée commune : chaque État choisit les moyens de son aide.'
