terme: Contrat d'intégration républicaine (CIR)
definition: Contrat signé avec l'État par l'étranger qui obtient un premier titre de séjour durable. Il comprend une formation civique (valeurs et fonctionnement de la République) et, si besoin, des cours de français, organisés par l'Office français de l'immigration et de l'intégration (OFII).
exemple: En 2025, 102 871 personnes ont signé un CIR ; 51,2 % ont suivi une formation linguistique.
