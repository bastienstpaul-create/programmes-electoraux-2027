terme: Agence spatiale européenne (ESA)
definition: Organisation intergouvernementale qui conduit depuis 1975 des programmes spatiaux européens communs, comme les fusées Ariane. Elle est indépendante de l'Union européenne. Une conférence des ministres des pays membres décide régulièrement des programmes et de la contribution de chaque pays.
exemple: En novembre 2025, les pays membres ont souscrit 22,1 milliards d'euros, dont 3,7 milliards pour la France.
