terme: Aire d'alimentation de captage
definition: Zone où l'eau de pluie s'infiltre ou ruisselle avant d'atteindre un point de prélèvement d'eau potable. Pour les captages jugés prioritaires, le préfet peut y encadrer ou interdire certaines pratiques agricoles et l'usage d'engrais ou de pesticides.
exemple: La France compte 32 800 captages d'eau potable.
