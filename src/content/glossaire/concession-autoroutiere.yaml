terme: Concession autoroutière
definition: Contrat par lequel l'État confie à une société privée, pour une durée limitée, la construction, l'entretien et l'exploitation d'une autoroute. En échange, la société perçoit les péages. À la fin du contrat, l'autoroute revient à l'État. Les contrats prévoient aussi la possibilité d'un rachat anticipé par l'État, contre indemnisation.
exemple: Les sept concessions dites historiques, privatisées en 2006, arrivent à échéance entre 2031 et 2036.
lien:
  titre: Sénat – Rapport de la commission d'enquête sur les concessions autoroutières (2020)
