terme: Naturalisation
definition: Acquisition de la nationalité française par décision de l'État (décret), à la demande d'un étranger qui vit en France depuis plusieurs années. L'administration vérifie notamment l'intégration, le niveau de français et l'adhésion aux valeurs de la République.
exemple: Depuis le 1er janvier 2026, le niveau de français exigé est le B2 et un examen civique est obligatoire.
