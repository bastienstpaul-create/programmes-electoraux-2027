terme: Arcom (Autorité de régulation de la communication audiovisuelle et numérique)
definition: Autorité indépendante qui régule l'audiovisuel et une partie du numérique. Elle supervise les plateformes en ligne et les réseaux sociaux et peut ordonner le blocage des sites pornographiques qui ne vérifient pas l'âge de leurs visiteurs.
exemple: Selon l'Arcom, 40 % des adolescents reconnaissent ne pas avoir donné leur vraie date de naissance en s'inscrivant sur un réseau social.
