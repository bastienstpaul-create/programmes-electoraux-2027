terme: OTAN (Organisation du traité de l'Atlantique Nord)
definition: Alliance militaire entre les États-Unis, le Canada et des pays européens, dont les membres s'engagent à se défendre mutuellement en cas d'attaque. Le « commandement intégré » est la structure militaire commune de l'Alliance. La France y participe de nouveau depuis 2009, mais sa dissuasion nucléaire reste à part.
exemple: Au sommet de La Haye (juin 2025), les membres ont fixé un objectif de 5 % du PIB pour la défense et la sécurité en 2035.
