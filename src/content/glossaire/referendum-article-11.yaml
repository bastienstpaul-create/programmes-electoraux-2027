terme: Référendum (article 11)
definition: Vote par lequel les électeurs adoptent ou rejettent directement un projet de loi. Le Président de la République peut l'organiser, sur proposition du gouvernement ou des deux assemblées, sur l'organisation des pouvoirs publics, la politique économique, sociale ou environnementale, ou la ratification de certains traités.
exemple: En octobre 1962, l'élection du Président de la République au suffrage universel direct a été adoptée par un référendum organisé sur le fondement de l'article 11.
