terme: Âge légal (âge d'ouverture des droits)
definition: Âge minimum à partir duquel on peut demander sa retraite, sauf départ anticipé (carrière longue, handicap, etc.). Il dépend de l'année de naissance.
exemple: 62 ans et 9 mois pour une personne née en 1964 ; 64 ans pour une personne née à partir de 1969.
