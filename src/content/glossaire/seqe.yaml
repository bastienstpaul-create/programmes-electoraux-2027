terme: SEQE (système d'échange de quotas d'émissions de l'UE)
definition: 'Marché du carbone européen : les centrales électriques et de chaleur, l''industrie et les vols intra-européens doivent détenir un quota pour chaque tonne de CO2 émise. Le nombre de quotas baisse chaque année et ils s''échangent à un prix fixé par le marché.'
exemple: Un second système, pour le transport routier et les bâtiments, doit démarrer en 2028.
