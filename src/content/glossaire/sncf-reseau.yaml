terme: SNCF Réseau
definition: 'Entreprise publique, filiale du groupe SNCF, qui gère le réseau ferré national : entretien et modernisation des voies, attribution des créneaux de circulation aux compagnies et perception des péages ferroviaires qu''elles paient pour utiliser le réseau. Elle est distincte de SNCF Voyageurs, qui fait rouler les trains.'
exemple: En 2024, l'État et les régions ont versé respectivement 1,8 milliard et 1 milliard d'euros de redevances à SNCF Réseau pour la circulation des TER (Fondation iFRAP, d'après le Sénat).
