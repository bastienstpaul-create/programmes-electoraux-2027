terme: PIB (produit intérieur brut)
definition: Mesure de la richesse produite en un an sur le territoire par les entreprises, les administrations et les ménages. On l'obtient en additionnant la valeur ajoutée de toutes les activités. Sa variation en volume (hors hausse des prix) mesure la croissance économique.
exemple: Selon l'Insee, le PIB progresserait de 0,4 % en 2026.
