terme: Taux d'effort
definition: 'Part des revenus d''un ménage consacrée à son logement : loyer ou remboursement d''emprunt, charges, énergie, eau et taxe foncière. Le taux d''effort « net » déduit les aides au logement.'
exemple: Début 2024, les locataires du parc privé consacraient en moyenne 25,4 % de leurs revenus à leur logement.
