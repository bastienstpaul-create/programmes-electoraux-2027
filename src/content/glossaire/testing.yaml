terme: Test de discrimination (testing)
definition: Méthode qui consiste à envoyer des candidatures fictives, de qualité équivalente, en réponse à de vraies offres (d'emploi, de logement, etc.). Les candidatures ne diffèrent que par une caractéristique, par exemple le nom et le prénom, qui suggèrent un sexe ou une origine. On compare ensuite les taux de réponse positive. Un écart statistiquement significatif mesure une discrimination.
exemple: Dans le testing réalisé pour la Dares en 2019-2021, 33,3 % des candidatures sans ascendance migratoire supposée ont été rappelées, contre 22,8 % des candidatures d'origine supposée maghrébine.
lien:
  titre: Insee Références – Les discriminations sur le marché du travail subies par les personnes d'origine maghrébine (2023)
