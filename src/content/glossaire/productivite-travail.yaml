terme: Productivité du travail
definition: Richesse produite rapportée à la quantité de travail utilisée, par heure travaillée ou par personne en emploi. Elle est dite « apparente » car elle dépend aussi des machines, des méthodes et de l'organisation.
exemple: En 2025, la productivité par personne en emploi restait 1,1 point sous son niveau de 2019.
