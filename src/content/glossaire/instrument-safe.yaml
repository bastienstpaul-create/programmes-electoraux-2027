terme: Instrument SAFE
definition: 'Programme européen de prêts créé en mai 2025 : l''UE emprunte sur les marchés et prête jusqu''à 150 milliards d''euros aux États pour acheter des armements, en principe en commun avec un autre pays. Au moins 65 % du coût des composants doit venir de l''UE, de l''Ukraine ou de pays européens associés.'
exemple: La France a obtenu environ 15,1 milliards d'euros de prêts.
