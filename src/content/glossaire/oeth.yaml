terme: Obligation d'emploi des travailleurs handicapés (OETH)
definition: Règle qui impose à toute entreprise de 20 salariés ou plus d'employer au moins 6 % de travailleurs ayant une reconnaissance de handicap. À défaut, elle verse une contribution qui finance l'insertion professionnelle des personnes handicapées. Une entreprise qui franchit le seuil de 20 salariés dispose de 5 ans avant d'être concernée par la contribution.
exemple: En 2024, 35 % des 111 300 entreprises concernées remplissaient entièrement leur obligation.
