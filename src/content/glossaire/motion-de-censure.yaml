terme: Motion de censure
definition: 'Texte par lequel les députés peuvent renverser le gouvernement. Elle doit être signée par au moins un dixième des députés et n''est adoptée que si elle obtient la majorité absolue des membres de l''Assemblée (289 voix lorsque les 577 sièges sont pourvus) : seuls les votes pour sont comptés. Si elle est adoptée, le gouvernement doit démissionner.'
exemple: Le 4 décembre 2024, une motion de censure a été adoptée par 331 députés, ce qui a entraîné la démission du gouvernement de Michel Barnier.
