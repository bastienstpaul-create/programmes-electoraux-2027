terme: HCC (Haut Conseil pour le climat)
definition: Organisme indépendant créé en 2019, composé d'experts du climat et de l'économie. Il publie chaque année un rapport qui évalue si la politique de la France est en ligne avec ses objectifs climatiques, et formule des recommandations.
lien:
  titre: Haut Conseil pour le climat – Rapport annuel 2026
  url: https://www.hautconseilclimat.fr/publications/dangers-climatiques-la-france-face-a-ses-responsabilites/
