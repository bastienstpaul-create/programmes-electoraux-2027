terme: ABF (architecte des Bâtiments de France)
definition: Fonctionnaire de l'État chargé de protéger le patrimoine et les paysages. Il donne un avis sur les travaux dans les espaces protégés, notamment autour des monuments historiques, et cet avis s'impose souvent au maire (« avis conforme »). Il conseille aussi les collectivités et les particuliers.
exemple: Dans un rayon de 500 mètres autour d'un monument classé et en covisibilité avec lui, changer des fenêtres ou poser des panneaux solaires demande son accord.
lien:
  titre: Sénat – Les architectes des Bâtiments de France face aux contraintes économiques et aux défis de la transition énergétique (2024)
