terme: TRVE (tarifs réglementés de vente d'électricité)
definition: Prix de l'électricité fixés par les ministres sur proposition de la Commission de régulation de l'énergie (CRE), proposés notamment par EDF (« tarif bleu »). Ils sont calculés en additionnant le coût des réseaux, le coût de l'approvisionnement en électricité et les taxes.
exemple: Au 31 mars 2026, 19,37 millions de foyers avaient un contrat au tarif réglementé.
