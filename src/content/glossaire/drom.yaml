terme: DROM (départements et régions d'outre-mer)
definition: 'Les cinq territoires d''outre-mer qui ont le même statut que les départements et régions de l''Hexagone, avec des adaptations : Guadeloupe, Guyane, Martinique, La Réunion et Mayotte. Ils font partie de l''Union européenne (régions ultrapériphériques). Les autres territoires (Polynésie française, Nouvelle-Calédonie, Saint-Pierre-et-Miquelon…) ont des statuts particuliers.'
exemple: Les cinq DROM regroupent 3 % de la population française et 24 % des personnes en grande pauvreté.
