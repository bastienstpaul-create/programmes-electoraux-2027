terme: Loi d'orientation des mobilités (LOM)
definition: Loi du 24 décembre 2019 qui organise les transports du quotidien. Elle crée un « droit à la mobilité », couvre tout le territoire par des autorités organisatrices de la mobilité, programme les investissements de l'État dans les transports et permet de créer des zones à faibles émissions.
exemple: La LOM prévoyait 13,7 milliards d'euros d'investissements de l'État dans les transports entre 2019 et 2023 ; 96 % des crédits ont été engagés selon la Cour des comptes.
