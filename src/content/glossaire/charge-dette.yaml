terme: Charge de la dette
definition: Montant des intérêts que les administrations publiques paient chaque année sur leur dette. Elle augmente quand la dette grossit ou quand les taux d'intérêt montent.
exemple: Elle a atteint 65,7 milliards d'euros en 2025 ; le gouvernement prévoit 91 milliards d'euros en 2027.
lien:
  titre: Cour des comptes – La situation et les perspectives des finances publiques (juin 2026)
  url: https://www.vie-publique.fr/files/rapport/pdf/303867.pdf
