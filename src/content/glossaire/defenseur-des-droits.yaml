terme: Défenseur des droits
definition: Autorité indépendante prévue par la Constitution. Elle peut être saisie gratuitement par toute personne qui s'estime victime d'une discrimination, d'un mauvais fonctionnement d'un service public, d'une atteinte aux droits d'un enfant ou d'un manquement d'un policier ou d'un gendarme. Elle peut proposer une médiation, faire des recommandations et présenter ses observations devant les tribunaux, mais elle ne peut pas infliger elle-même de sanctions.
exemple: En 2025, l'institution a reçu 6 362 réclamations pour discrimination, dont plus de la moitié portaient sur l'emploi.
