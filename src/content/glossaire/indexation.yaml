terme: Indexation (revalorisation)
definition: Règle qui fait évoluer chaque année un montant, comme une pension ou le SMIC, en fonction d'un indicateur. Les retraites de base sont revalorisées chaque 1er janvier selon l'inflation hors tabac. Une sous-indexation consiste à revaloriser moins que l'inflation.
exemple: +0,9 % pour les retraites de base au 1er janvier 2026.
