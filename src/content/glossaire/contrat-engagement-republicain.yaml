terme: Contrat d'engagement républicain
definition: Engagement que doit signer, depuis la loi du 24 août 2021, toute association qui demande une subvention publique. Elle s'engage à respecter la liberté, l'égalité, la fraternité, la dignité humaine, les symboles de la République et le caractère laïque de la République, et à ne pas troubler l'ordre public. Le non-respect peut entraîner le refus ou le retrait de la subvention.
exemple: Faute de données nationales, l'évaluation parlementaire de janvier 2025 n'a pas pu mesurer combien de subventions ont été refusées sur ce fondement.
lien:
  titre: Assemblée nationale – Évaluation de la loi confortant le respect des principes de la République (janvier 2025)
  url: https://www.assemblee-nationale.fr/dyn/17/documents/cion_lois/l17n870210094_document.pdf
