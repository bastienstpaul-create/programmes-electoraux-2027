terme: IFI (impôt sur la fortune immobilière) et ISF
definition: L'IFI est un impôt annuel sur le patrimoine immobilier des foyers dont ce patrimoine dépasse 1,3 million d'euros. Il a remplacé l'ISF (impôt de solidarité sur la fortune), supprimé par une réforme votée en 2017,, qui portait sur l'ensemble du patrimoine, y compris les placements financiers.
exemple: Le retour d'un ISF fait partie des propositions débattues.
