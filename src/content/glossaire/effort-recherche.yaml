terme: Effort de recherche
definition: Part de la richesse nationale (PIB) consacrée aux dépenses de recherche et développement (R&D) réalisées en France, par les entreprises et par les administrations.
exemple: 2,18 % du PIB en 2024, pour un objectif légal de 3 %.
