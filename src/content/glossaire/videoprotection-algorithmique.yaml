terme: Vidéoprotection algorithmique
definition: Analyse automatique, par un logiciel, des images de caméras de surveillance pour détecter et signaler certains événements à un opérateur. La loi de 2023 l'a autorisée à titre expérimental, sans reconnaissance faciale ni données biométriques.
exemple: L'expérimentation prévue par la loi sur les Jeux olympiques devait s'achever le 31 mars 2025.
