terme: Reports de charges et restes à payer
definition: Un report de charges est une dépense d'une année qui n'est pas payée sur le budget de cette année et pèse donc sur le budget suivant. Les restes à payer sont les sommes que l'État s'est déjà engagé à verser plus tard, par exemple pour des contrats d'armement en cours.
exemple: Selon le HCFP, environ 9 milliards d'euros de dépenses militaires sont reportés chaque année ; les restes à payer atteignent environ 140 milliards d'euros.
