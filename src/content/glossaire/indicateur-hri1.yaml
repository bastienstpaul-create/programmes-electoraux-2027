terme: Indicateur HRI1 (indicateur de risque harmonisé)
definition: 'Indicateur européen qui suit l''usage des pesticides : il additionne les quantités de substances vendues en les pondérant selon leur niveau de danger. Il sert de référence à la stratégie Écophyto 2030 depuis 2024, à la place du NODU, qui mesure le nombre de traitements.'
exemple: 53 en 2024 en France, contre 100 en 2011-2013.
lien:
  titre: Ministère de l'Agriculture – Les indicateurs de suivi de la stratégie Écophyto 2030
