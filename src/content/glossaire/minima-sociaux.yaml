terme: Minima sociaux
definition: Aides qui garantissent un revenu minimum aux personnes qui ont très peu de ressources. Ce sont notamment le RSA, l'AAH et l'Aspa. Elles sont versées sous conditions de ressources.
exemple: 30,6 Md€ en 2022, pour 6,9 millions de personnes couvertes en comptant conjoints et enfants.
