terme: Dissolution de l'Assemblée nationale
definition: Décision du Président de la République qui met fin au mandat de tous les députés avant son terme. De nouvelles élections ont lieu 20 à 40 jours plus tard. Le Président ne peut pas dissoudre à nouveau dans l'année qui suit ces élections.
exemple: Les élections législatives de juin et juillet 2024 ont suivi une dissolution.
