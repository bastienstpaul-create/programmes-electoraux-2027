terme: PNACO (parquet national anti-criminalité organisée)
definition: Parquet spécialisé créé par la loi « narcotrafic » de 2025 et par une loi organique associée. Basé à Paris avec des juridictions dédiées, il peut se saisir des affaires de criminalité organisée « d'une très grande complexité », à la place des parquets locaux.
exemple: Le Sénat précise que son installation doit se faire dans l'enveloppe prévue par la loi de programmation de la justice.
