terme: APA (allocation personnalisée d'autonomie)
definition: Aide versée par le département aux personnes de 60 ans ou plus en perte d'autonomie, à domicile ou en établissement. Elle finance une partie des aides nécessaires (aide à domicile, tarif dépendance en Ehpad). Son montant dépend du degré de perte d'autonomie et des revenus.
exemple: La CNSA prévoit 700 000 bénéficiaires supplémentaires de l'APA d'ici 2050.
