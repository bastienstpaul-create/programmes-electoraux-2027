terme: Procédure Dublin
definition: Règle européenne qui désigne un seul pays responsable de l'examen d'une demande d'asile, souvent le premier pays européen où le demandeur a déposé une demande. Si la demande est déposée ailleurs, le demandeur peut être transféré vers ce pays.
exemple: En 2025, près de 16 % des demandeurs d'asile en France ont été placés en procédure Dublin.
