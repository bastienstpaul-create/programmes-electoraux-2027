terme: SecNumCloud
definition: Qualification de sécurité délivrée par l'Agence nationale de la sécurité des systèmes d'information (Anssi) depuis 2016 à des offres de cloud. Elle repose sur des règles techniques, juridiques et d'actionnariat qui visent à protéger les données contre les cyberattaques et contre les lois étrangères.
exemple: Début 2026, 11 prestataires proposaient une offre qualifiée SecNumCloud.
lien:
  titre: Assemblée nationale – Rapport n° 2522 (partie sur la qualification SecNumCloud)
  url: https://www.assemblee-nationale.fr/dyn/opendata/RAPPANR5L17B2522.html
