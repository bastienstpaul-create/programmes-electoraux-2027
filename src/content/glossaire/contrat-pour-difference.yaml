terme: Contrat pour différence
definition: Contrat qui garantit un prix de vente à un producteur d'électricité. Si le prix du marché est inférieur, l'État lui verse la différence ; s'il est supérieur, le producteur reverse l'écart à l'État.
exemple: La PPE3 prévoit un contrat pour différence d'au plus 100 € par MWh pour les EPR2.
