terme: Informatique en nuage (cloud) et souveraineté numérique
definition: Le cloud consiste à stocker des données ou utiliser des logiciels sur des serveurs distants loués à un prestataire. La souveraineté numérique désigne la capacité d'un État à maîtriser ces technologies et à protéger ses données, notamment face aux lois étrangères qui permettent à un pays d'exiger des données détenues par ses entreprises à l'étranger (par exemple le Cloud Act américain).
exemple: AWS, Microsoft Azure et Google Cloud détiennent environ 70 % du marché européen du cloud.
