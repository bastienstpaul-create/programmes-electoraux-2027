terme: Dette grise
definition: Montant des travaux d'entretien et de renouvellement qui n'ont pas été faits à temps sur une infrastructure (voies ferrées, routes, ponts, canaux). Ce n'est pas une dette financière, mais un retard d'investissement qui finit par se traduire par des ralentissements, des fermetures ou des réparations plus coûteuses.
exemple: La conférence Ambition France Transports (2025) estime la dette grise du réseau ferroviaire à 60 milliards d'euros.
lien:
  titre: Rapport de la conférence Ambition France Transports (juillet 2025)
