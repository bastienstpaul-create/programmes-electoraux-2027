terme: Révision constitutionnelle
definition: Modification de la Constitution. Elle est proposée par le Président de la République (sur proposition du Premier ministre) ou par des parlementaires. Le texte doit être voté dans les mêmes termes par l'Assemblée nationale et le Sénat, puis approuvé par référendum ou par le Congrès.
exemple: La Constitution de 1958 a été révisée 25 fois, la dernière en mars 2024.
