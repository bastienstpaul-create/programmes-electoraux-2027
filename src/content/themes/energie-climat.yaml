situation:
  texte: 'En 2025, la France a émis sur son territoire 359 millions de tonnes d''équivalent CO2 de gaz à effet de serre, selon la pré-estimation du Citepa reprise par le [[Haut Conseil pour le climat|hcc]] : 2,1 % de moins qu''en 2024 et 22 % de moins qu''en 2015. Les transports en sont la première source (34 %), devant l''agriculture (21 %), l''industrie (16 %), les bâtiments (15 %) et la production d''énergie (9 %). Les deux tiers environ de ces émissions viennent de la combustion d''énergies fossiles. La loi fixe l''objectif d''atteindre la [[neutralité carbone|neutralite-carbone]] en 2050. La trajectoire pour y arriver est décrite dans la [[stratégie nationale bas-carbone|snbc]], découpée en [[budgets carbone|budget-carbone]] de cinq ans ; sa troisième version (SNBC 3) était encore un projet en juillet 2026. Au niveau européen, l''objectif est une baisse de 55 % des émissions nettes en 2030 par rapport à 1990, qui se traduit pour la France par −47,5 % par rapport à 2005. En novembre 2025, les États membres puis le Parlement européen se sont prononcés pour un objectif de −90 % en 2040, dont jusqu''à 5 % pourraient être obtenus par des crédits carbone internationaux à partir de 2036.


    Les énergies fossiles (pétrole, gaz, charbon) représentaient encore 56 % de la consommation finale d''énergie en 2024, contre 27 % pour l''électricité. L''électricité, elle, est presque entièrement décarbonée : en 2025, 95,2 % des 547,5 TWh produits en métropole venaient du nucléaire ou des énergies renouvelables. Les réacteurs nucléaires ont produit 373 TWh, soit plus des deux tiers du total. La consommation d''électricité est restée stable (451 TWh), environ 6 % en dessous de son niveau de 2014-2019, et la France a exporté un solde record de 92,3 TWh. Les énergies renouvelables (électricité, chaleur, carburants) couvraient 24,0 % de la consommation finale brute d''énergie en 2025 (donnée provisoire), pour un objectif légal de 33 % en 2030.


    Les grands choix énergétiques sont fixés par la [[programmation pluriannuelle de l''énergie|ppe]]. Le code de l''énergie prévoyait qu''une loi de programmation sur l''énergie et le climat soit adoptée avant le 1er juillet 2023 ; aucune ne l''a été, et l''Assemblée nationale a rejeté en juin 2025 une proposition de loi sénatoriale sur ce sujet. La troisième PPE a donc été fixée par décret (n° 2026-76 du 12 février 2026) pour 2026-2035. Elle prévoit la construction de six réacteurs [[EPR2|epr2]], l''objectif d''être en mesure de décider en 2026 de huit réacteurs supplémentaires, une production nucléaire de 380 à 420 TWh dès 2030 (320 TWh en 2023), 15 GW d''éolien en mer en 2035, 55 à 80 GW de solaire et 35 à 40 GW d''éolien terrestre en 2035. Jusqu''au 31 décembre 2028, le rythme des aides attribuées à l''éolien terrestre et au solaire est plafonné, et une révision simplifiée de la PPE pourra être lancée en 2027. La part des énergies fossiles dans la consommation finale doit passer de 58 % en 2023 à 40 % en 2030 et 29 % en 2035.


    Côté prix, l''[[ARENH|arenh]], qui permettait aux fournisseurs d''acheter une partie de la production nucléaire d''EDF à un prix fixé par l''État, a pris fin le 31 décembre 2025. Les [[tarifs réglementés de vente d''électricité|trve]], souscrits par 19,37 millions de foyers, ont baissé de 0,83 % au 1er février 2026, puis augmenté de 2,5 % au 1er août 2026 : pour une consommation de 4,5 MWh par an, la facture moyenne passe de 1 046 à 1 072 € TTC selon la Commission de régulation de l''énergie. Sur le marché de gros, le prix moyen a été de 61 €/MWh en 2025, contre 275,9 €/MWh en 2022 au cœur de la crise énergétique. Selon le HCC, 10,8 % des ménages sont en situation de précarité énergétique.


    Le réchauffement observé en France hexagonale atteint 2,2 °C entre 1900-1930 et 2016-2025. Pour s''y préparer, l''État a publié en 2025 un troisième plan national d''adaptation (PNACC 3), fondé sur une [[trajectoire de réchauffement de référence|tracc]] de +4 °C en 2100 dans l''Hexagone. Côté biodiversité, les populations d''oiseaux communs spécialistes de leur milieu ont reculé de 31 % entre 1989 et 2023 dans l''Hexagone, selon l''Office français de la biodiversité.'
