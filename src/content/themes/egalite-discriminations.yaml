numero: 14
titre: Égalité et discriminations
icone: scale
date_maj: 2026-11-11
etat: publie
axes:
- id: egalite-pro
  libelle: Égalité professionnelle femmes-hommes
- id: violences
  libelle: Violences faites aux femmes
