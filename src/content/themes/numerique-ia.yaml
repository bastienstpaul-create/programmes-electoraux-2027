numero: 15
titre: Numérique et IA
icone: cpu
date_maj: 2026-11-11
etat: publie
axes:
- id: ia
  libelle: Intelligence artificielle
- id: donnees
  libelle: Données personnelles et vie privée
- id: plateformes
  libelle: Réseaux sociaux et plateformes
- id: mineurs
  libelle: Protection des mineurs en ligne
