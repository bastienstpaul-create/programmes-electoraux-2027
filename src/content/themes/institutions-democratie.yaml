situation:
  texte: 'La France est organisée par la Constitution du 4 octobre 1958, celle de la Ve République. Le Président de la République est élu au suffrage universel direct pour cinq ans : la durée de son mandat a été réduite à cinq ans par le référendum de 2000. Il peut prononcer la [[dissolution|dissolution]] de l''Assemblée nationale. Le Parlement comprend l''Assemblée nationale (577 députés au plus) et le Sénat (348 sénateurs au plus). Depuis 1958, la Constitution a été modifiée 25 fois, la dernière fois le 8 mars 2024 pour y inscrire la liberté de recourir à l''interruption volontaire de grossesse. Une [[révision constitutionnelle|revision-constitutionnelle]] doit être votée dans les mêmes termes par les deux assemblées, puis approuvée par référendum ou par le Parlement réuni en [[Congrès|congres-du-parlement]], à la majorité des trois cinquièmes. En 2026, un projet de révision créant un statut d''autonomie pour la Corse a été adopté par l''Assemblée nationale le 23 juin, puis rejeté par le Sénat le 26 octobre ; il revient devant l''Assemblée en deuxième lecture.


    Les députés sont élus au [[scrutin majoritaire à deux tours|scrutin-majoritaire-deux-tours]], un par circonscription. Pour se présenter au second tour, un candidat doit avoir obtenu au premier tour un nombre de voix au moins égal à 12,5 % des électeurs inscrits. Le passage à un [[scrutin proportionnel|scrutin-proportionnel]] a figuré parmi les engagements de campagne de plusieurs candidats à la présidentielle depuis 2007, sans être adopté. Aux élections législatives anticipées de 2024, qui ont suivi la dissolution, la participation au premier tour a atteint 67,9 %, contre 75,3 % au premier tour de la présidentielle de 2022 et 53,0 % aux européennes de 2024. Aucun groupe ne dispose de la majorité absolue (289 sièges) : fin octobre 2026, l''Assemblée compte onze groupes politiques et des députés non inscrits, et le groupe le plus nombreux réunit 121 députés. Trois Premiers ministres se sont succédé depuis ces élections. Le 4 décembre 2024, une [[motion de censure|motion-de-censure]] a été adoptée après le recours à l''[[article 49.3|article-49-3]] sur le budget de la Sécurité sociale, ce qui a entraîné la démission du gouvernement de Michel Barnier. Le 8 septembre 2025, l''Assemblée a désapprouvé la déclaration de politique générale de François Bayrou ([[article 49.1|article-49-1]]), ce qui a également entraîné la démission du gouvernement. En janvier 2026, Sébastien Lecornu a engagé la responsabilité de son gouvernement sur le budget de l''État avec l''article 49.3 ; les motions de censure déposées en réponse ont été rejetées.


    Le [[référendum|referendum-article-11]] national permet au Président de la République de soumettre un projet de loi directement aux électeurs. Selon le Cevipof, le dernier référendum national remonte à plus de vingt ans. Depuis la révision de 2008, un [[référendum d''initiative partagée|referendum-initiative-partagee]] peut être engagé par un cinquième des parlementaires, à condition d''être soutenu par un dixième des électeurs inscrits. Lors de sa première mise en œuvre, sur la privatisation d''Aéroports de Paris, la proposition a recueilli 1 093 030 soutiens, pour un seuil fixé à 4 717 396. En février 2026, 22 % des personnes interrogées par le Cevipof déclaraient avoir confiance dans la politique, 20 % dans l''Assemblée nationale et 60 % dans leur maire ; 79 % souhaitaient un recours plus fréquent au référendum.


    Au 1er janvier 2026, la France (métropole et départements d''outre-mer) compte 34 875 communes, regroupées en 1 252 [[intercommunalités|intercommunalite]] à fiscalité propre, 101 départements et 18 régions. Plus de 580 000 élus locaux y siègent ; les femmes représentent 47,4 % d''entre eux, mais 22,8 % des maires. En 2025, les dépenses de fonctionnement des collectivités locales ont atteint 209,5 milliards d''euros (budgets principaux). Deux lois de 2025 ont modifié les règles locales : l''une change le mode d''élection des conseils municipaux de Paris, Lyon et Marseille, l''autre crée un statut de l''élu local (indemnités, congés pour campagne, protection). Pour les responsables publics, la [[Haute Autorité pour la transparence de la vie publique|hatvp]] reçoit et contrôle des déclarations de patrimoine et d''intérêts : 10 362 déclarations reçues et 5 795 contrôlées en 2025.'
