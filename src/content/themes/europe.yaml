situation:
  texte: 'La France est l''un des 27 États membres de l''Union européenne (UE). Les règles communes sont fixées par deux traités, le traité sur l''Union européenne et le traité sur le fonctionnement de l''Union européenne, modifiés pour la dernière fois en profondeur par le traité de Lisbonne (2007). La Constitution française y consacre un titre entier (articles 88-1 à 88-7). Les lois européennes sont adoptées par le Parlement européen, élu au suffrage universel tous les cinq ans (720 députés, dont 81 élus en France pour 2024-2029), et par le Conseil de l''UE, où siègent les ministres des États. Le Conseil décide le plus souvent à la [[majorité qualifiée|majorite-qualifiee]] (au moins 55 % des États représentant 65 % de la population), mais l''unanimité reste la règle pour la politique étrangère et de défense, la fiscalité, le budget pluriannuel et l''entrée de nouveaux pays. Quand l''unanimité bloque, au moins neuf États peuvent avancer seuls par une [[coopération renforcée|cooperation-renforcee]] : c''est ce qui a permis en décembre 2025 un prêt de 90 milliards d''euros à l''Ukraine pour 2026-2027, malgré l''opposition de trois États.


    Le budget de l''UE est encadré par un [[cadre financier pluriannuel|cadre-financier-pluriannuel]] de sept ans. Celui de 2021-2027 prévoyait 1 074 milliards d''euros d''engagements (prix de 2018), auxquels s''est ajouté le plan de relance [[Next Generation EU|next-generation-eu]] (750 milliards), financé par un emprunt commun. Le budget est alimenté par des [[ressources propres|ressources-propres-ue]] : droits de douane, part de TVA, contributions calculées sur la richesse de chaque pays. La part française passe par le [[prélèvement sur recettes au profit de l''UE|psr-ue]] : 30,9 milliards d''euros prévus en 2027, contre 28,1 milliards attendus en 2026. En sens inverse, l''UE a dépensé 16,4 milliards d''euros en France en 2025, dont 58 % au titre de la politique agricole commune (PAC). La France est le deuxième contributeur net, derrière l''Allemagne. Le prochain cadre (2028-2034) est en négociation : la Commission a proposé 1 985 milliards d''euros courants en juillet 2025 ; les chefs d''État visent un accord d''ici fin 2026, à l''unanimité.


    Les règles budgétaires européennes, réformées en 2024, fixent toujours deux seuils : un déficit public de 3 % du PIB et une dette de 60 % du PIB. Chaque État s''engage désormais sur une trajectoire de « dépenses nettes » sur quatre à sept ans. La France, dont le déficit atteignait 5,1 % du PIB en 2025, fait l''objet d''une [[procédure de déficit excessif|procedure-deficit-excessif]] depuis juillet 2024 et s''est engagée à revenir sous 3 % en 2029. En défense, le traité prévoit une [[clause de défense mutuelle|clause-defense-mutuelle]] (article 42.7) qui renvoie à l''OTAN pour les pays qui en sont membres. Depuis 2025, le plan européen de réarmement autorise un déficit supplémentaire pour la défense, que la France n''a pas demandé, et prête 150 milliards d''euros aux États via l''[[instrument SAFE|instrument-safe]] : la France a obtenu 15,1 milliards.


    Le droit européen s''impose au droit national ([[primauté|primaute-droit-ue]]) : les directives doivent être transposées et le juge écarte une loi contraire. Le Conseil d''État juge toutefois, depuis 2021, que la Constitution reste au sommet et qu''il peut écarter une règle européenne si elle prive de garanties une exigence constitutionnelle non protégée de façon équivalente par le droit européen. La France est aussi critiquée pour sa [[surtransposition|surtransposition]], c''est-à-dire l''ajout de règles nationales plus strictes que les textes européens. L''Assemblée et le Sénat peuvent adopter des [[résolutions européennes|resolution-europeenne]], qui ne lient pas le gouvernement. Enfin, l''UE négocie l''adhésion de plusieurs pays (Monténégro, Albanie, Serbie, Ukraine, Moldavie notamment) ; chaque entrée exige l''unanimité des États membres et une ratification par chacun d''eux. Fin 2025, le Monténégro, pays le plus avancé, avait ouvert ses 33 chapitres de négociation examinés et en avait clôturé 7.'
