  lois:
  - titre: Loi n° 86-1067 du 30 septembre 1986 relative à la liberté de communication
    resume: Elle garantit la liberté de communication audiovisuelle et confie à l'Arcom la régulation des radios et télévisions, la délivrance des fréquences et la nomination des présidents de l'audiovisuel public. Ses articles 39 à 41-2-1 fixent les plafonds anti-concentration pour la télévision, la radio et les cumuls entre médias.
    url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000512205/
  - titre: Loi organique n° 2024-1177 du 13 décembre 2024 portant réforme du financement de l'audiovisuel public
    resume: Elle rend durable le financement de l'audiovisuel public par une part de la TVA, mis en place après la suppression de la contribution à l'audiovisuel public par la loi de finances rectificative du 16 août 2022. Le montant reste voté chaque année en loi de finances. Le Conseil constitutionnel l'a jugée conforme (décision n° 2024-873 DC du 12 décembre 2024).
    url: https://www.conseil-constitutionnel.fr/decision/2024/2024873DC.htm
  - titre: Règlement (UE) 2024/1083 du 11 avril 2024 sur la liberté des médias
    resume: Règlement européen qui protège l'indépendance éditoriale et le pluralisme. Il prévoit un financement suffisant, durable et prévisible des médias de service public et, depuis le 8 août 2025 (article 22), une évaluation des concentrations dans le secteur des médias au regard du pluralisme.
    url: https://eur-lex.europa.eu/eli/reg/2024/1083/oj
  - titre: Loi n° 2026-725 du 3 août 2026 relative à l'organisation, à la gestion et au financement du sport professionnel
    resume: Elle interdit certaines fonctions de direction dans les fédérations aux personnes condamnées pour certains crimes ou délits (contrôle d'honorabilité). Elle encadre la convention par laquelle une fédération confie des activités à une société commerciale. Elle oblige les fédérations et les ligues au dialogue avec les associations de supporters et à un suivi de l'égalité entre sport masculin et féminin.
    url: https://www.assemblee-nationale.fr/dyn/17/dossiers/DLR5L17N51732
bilan:
- nature: fonctionne
  texte: 'France Télévisions : selon la Cour des comptes (septembre 2025), la fusion des sociétés en une entreprise unique, décidée en 2009, a été menée à bien sur la période 2017-2024 (direction unique des programmes, rédaction nationale unique). La part d''audience du groupe a gagné 1,5 point depuis 2017, à 29,8 %. En 2023, 75 % des Français disaient faire confiance à son offre d''information, contre 54 % en moyenne pour les chaînes privées.'
  sources:
  - ccomptes-france-televisions-2025
- nature: ne-fonctionne-pas
  texte: 'La même enquête de la Cour des comptes juge la situation financière de France Télévisions « critique » : résultats nets en déficit cumulé de 81 millions d''euros entre 2017 et 2024, et orientations contradictoires de l''État en 2023-2024 (hausse des moyens annoncée, puis crédits gelés et annulés). Les contrats d''objectifs et de moyens prévus pour 2024-2028 ont été abandonnés à l''automne 2024 et les nouveaux contrats pour 2026-2028 n''étaient toujours pas proposés en octobre 2026, selon le Sénat. Entre 2018 et 2027, hors inflation, les dotations publiques de l''audiovisuel public baissent de 19,6 %.'
  sources:
  - ccomptes-france-televisions-2025
  - senat-np-mlic-plf2027
- nature: debat
  texte: 'Pass Culture : fin août 2024, 84 % des jeunes de 18 ans y étaient inscrits, mais seulement 68 % des jeunes de classes populaires avaient activé leur pass. Selon la Cour des comptes (décembre 2024), il a surtout intensifié des pratiques déjà installées, et 38 % des utilisateurs poursuivent les activités découvertes une fois le crédit épuisé. La Cour qualifiait le dispositif de « dépense de guichet » (244 millions d''euros pour la part individuelle en 2024). Après la réforme de 2025, l''État prévoit 137,5 millions d''euros pour 2027.'
  sources:
  - ccomptes-pass-culture-2024
  - pap-culture-plf2027
- nature: debat
  texte: 'Concentration des médias : un rapport des inspections des finances et des affaires culturelles (2022), repris par l''Assemblée nationale en 2026, juge les règles de 1986 inadaptées, car elles ne couvrent pas les audiences en ligne. Les États généraux de l''information (septembre 2024) ont proposé de mesurer une « part d''influence » tous supports confondus. Saisi d''une proposition de loi en ce sens, le Conseil d''État (avis du 29 janvier 2026) a admis le principe. Il a toutefois jugé contraire à la liberté d''entreprendre d''interdire une position atteinte par croissance interne.'
  sources:
  - an-rapport-2429-concentration-medias
- nature: debat
  texte: 'Patrimoine : selon la commission de la culture du Sénat (juillet 2026), près d''un quart des monuments historiques sont en mauvais état, et les crédits budgétaires d''investissement ont reculé d''un tiers entre 2025 et 2026. Aux abords des monuments, les avis des architectes des Bâtiments de France ont augmenté de 63 % entre 2013 et 2023, quand leurs effectifs augmentaient de 6 %. 36 % de ces avis sont des accords simples, 50 % des accords avec prescriptions et 14 % des refus. Une proposition de loi visant à rendre leurs avis plus prévisibles a été adoptée à l''unanimité par le Sénat le 19 mars 2025.'
  sources:
  - senat-essentiel-monuments-historiques-2026
  - senat-r23-780-abf-2024
  - senat-ppl-195-abf-2025
- nature: ne-fonctionne-pas
  texte: 'Pass''Sport : selon le Sénat, le dispositif a changé de règles presque chaque année depuis 2021. En 2025, son recentrage sur les 14-17 ans a réduit le nombre de bénéficiaires de 1,65 million à 444 023, pour un taux de recours de 16,3 % (26 % en 2024) et 36,7 millions d''euros dépensés. Le passage de l''aide de 50 à 70 euros n''a pas augmenté le recours de façon mesurable. Pour le plan « 5 000 équipements », la Cour des comptes (juin 2026) relève que les aides suivent surtout les demandes reçues, ce qui peut favoriser les collectivités les mieux outillées, et que le plan n''a pas été évalué.'
  sources:
  - senat-l25-736-sjva-2025
  - senat-np-sjva-plf2027
effets:
- sujet: Effet d'une modification du financement de l'audiovisuel public (contribution dédiée ou baisse des dotations)
  axes:
  - audiovisuel-public
  evaluations:
  - source: fjj-cage-redevance-2022
    resume: 'Rapport de l''économiste Julia Cagé pour la Fondation Jean-Jaurès (juin 2022), avant la suppression de la redevance. Il simule une contribution affectée et progressive selon le revenu fiscal, à recettes égales (3,14 milliards d''euros en 2022) : 10 euros par an jusqu''à 15 000 euros de revenu, 50, 100 ou 120 euros pour les tranches intermédiaires, 200 euros au-delà de 50 000 euros. Plus de 85 % des foyers fiscaux paieraient moins que les 138 euros de la redevance (p. 10-11).'
    fourchette: 10 à 200 € par foyer et par an ; 3,14 Md€ de recettes
  - source: an-ce-audiovisuel-public-2026
    resume: 'Rapport de la commission d''enquête de l''Assemblée nationale (rapporteur Charles Alloncle, UDR, avril 2026) : objectif de réduire de plus d''un milliard d''euros, en euros constants, la dépense publique pour l''audiovisuel public d''ici cinq à dix ans. Si France Télévisions avait la part de ressources propres de la BBC (un tiers), sa dotation pourrait baisser de 450 millions d''euros, et de 600 millions avec Radio France. Les contributions de plusieurs groupes (dont Les Démocrates, LFI, Socialistes) contestent ces chiffres et estiment que de telles économies imposeraient de fermer les réseaux régionaux et ultramarins.'
    fourchette: −600 M€ à −1 Md€ par an (horizon 5 à 10 ans)
  - source: ifrap-france-tv-2026
    resume: 'Fondation iFRAP (février 2026) : à chiffre d''affaires constant, si France Télévisions avait le taux de financement public de la BBC, les dotations de l''État pourraient baisser de 450 millions d''euros par an, et de 600 millions avec Radio France, à condition d''augmenter les recettes commerciales et de renégocier l''accord collectif de 2013.'
    fourchette: −450 à −600 M€ par an
  - source: fjj-audiovisuel-public-2026
    resume: 'Note de la Fondation Jean-Jaurès (avril 2026) : le budget de l''audiovisuel public, environ 4 milliards d''euros, place la France au 14e rang européen. Il représente environ 4,2 euros par mois et par habitant, contre 8,7 euros en Allemagne, 6,1 euros au Royaume-Uni et 5,1 euros en Belgique. Ses ressources ont baissé de près de 10 % entre 2014 et 2024, contre 8,6 % en moyenne européenne selon l''UER.'
    fourchette: 4,2 € par habitant et par mois (France) contre 5,1 à 8,7 € (pays voisins)
  desaccords: Les évaluateurs ne partent pas des mêmes questions. L'iFRAP et le rapporteur de la commission d'enquête cherchent des économies, en comparant la part de ressources commerciales avec celle de la BBC. La Fondation Jean-Jaurès compare le niveau de financement par habitant avec les pays voisins et défend une ressource affectée. La simulation de Julia Cagé date de 2022, avant la suppression de la redevance, et ne chiffre pas le coût de recouvrement d'une nouvelle contribution. Le Sénat rappelle que, quel que soit le mode de financement, le montant reste voté chaque année par le Parlement.
- sujet: Effet du pass Culture et de sa réforme (coût et usage)
  axes:
  - culture
  evaluations:
  - source: ccomptes-pass-culture-2024
    resume: 'Cour des comptes (décembre 2024) : les crédits de la part individuelle sont passés de 92 millions d''euros en 2021 à 244 millions en 2024, et à 324 millions avec la part collective (80 millions). La Cour évoque plusieurs pistes d''économies : baisser le crédit à 18 ans, le soumettre à condition de ressources ou le cibler selon des critères sociaux ou territoriaux (synthèse, p. 9-12).'
    fourchette: 244 M€ (part individuelle, 2024) ; 324 M€ avec la part collective
  - source: pap-culture-plf2027
    resume: 'Projet annuel de performances 2027 : après la réforme de 2025 (50 euros à 17 ans, 150 euros à 18 ans, bonus de 50 euros sous conditions), les crédits du pass Culture sur le programme 361 sont de 137,5 millions d''euros en 2027, contre 157,5 millions en 2026. Près de 5 millions de jeunes ont bénéficié de la part individuelle depuis sa création (p. 212 et 223).'
    fourchette: 137,5 M€ en 2027 (−20 M€ sur un an)
  desaccords: La Cour des comptes juge l'effet sur la démocratisation culturelle limité, faute de suivi des jeunes avant et après le pass. Le ministère et la société pass Culture mettent en avant le taux d'inscription et le développement de la part collective dans les établissements scolaires. Aucune évaluation publiée ne chiffre encore l'effet de la réforme de 2025 sur les pratiques des jeunes.
- sujet: Effet des crédits d'impôt et des aides au cinéma et à l'audiovisuel
  axes:
  - culture
  - creation
  evaluations:
  - source: cnc-ey-credits-impot-2023
    resume: Étude du cabinet EY pour le CNC (juillet 2023, période 2017-2021). En 2021, les quatre crédits d'impôt (cinéma, audiovisuel, international, jeu vidéo) ont coûté 351 millions d'euros et généré 269 millions de recettes fiscales, soit un coût net de 82 millions. Pour 1 euro de crédit d'impôt, le crédit cinéma a localisé 6,40 euros de dépenses en France et le crédit audiovisuel 7,60 euros.
    fourchette: Coût net de 82 M€ (2021) ; 4 à 7,6 € de dépenses localisées par euro
  - source: ccomptes-cnc-2023
    resume: 'Cour des comptes (2023) : la part des soutiens publics dans le financement des films d''initiative française est passée de 20 % en 2012 à 28 % en 2019, surtout du fait des crédits d''impôt. Dans le même temps, un tiers de ces films ont fait moins de 20 000 entrées en 2019. La Cour en conclut que l''efficacité marginale des aides au cinéma semble décroître.'
    fourchette: 'Soutiens publics : 20 % → 28 % du financement des films (2012-2019)'
  - source: senat-np-mlic-plf2027
    resume: 'Sénat (octobre 2026) : les dépenses fiscales en faveur du cinéma et de l''audiovisuel (hors jeu vidéo) passeraient de 539 millions d''euros en 2025 à 498 millions en 2027, contre 179 millions en 2016. Les œuvres aidées ont dépensé 2,86 milliards d''euros en France en 2025 (p. 35-37).'
    fourchette: 498 M€ de dépense fiscale en 2027 (179 M€ en 2016)
  desaccords: L'étude commandée par le CNC mesure les retombées économiques (dépenses localisées, recettes fiscales), sans dire si les tournages auraient eu lieu en France sans les crédits d'impôt. La Cour des comptes s'intéresse au nombre de films produits et à leur public, et pointe la difficulté d'évaluer des aides nombreuses et dispersées. Les deux approches ne répondent pas à la même question.
- sujet: Effet des aides à la pratique sportive (Pass'Sport, équipements) et de leur financement
  axes:
  - sport
  evaluations:
  - source: senat-l25-736-sjva-2025
    resume: 'Sénat (juin 2026), d''après l''exécution budgétaire : le taux de recours au Pass''Sport a varié entre 16,3 % et 26 % depuis 2021. La dépense est passée de 79,2 millions d''euros en 2024 à 36,7 millions en 2025 après le recentrage sur les 14-17 ans. Selon la Cour des comptes, le recours des plus de 14 ans est resté stable, et la hausse de l''aide de 50 à 70 euros n''a pas amélioré le recours (p. 12-13).'
    fourchette: Recours de 16,3 % à 26 % ; 36,7 à 79,2 M€ par an
  - source: senat-np-sjva-plf2027
    resume: 'Sénat (octobre 2026) : le plan « 5 000 équipements – Génération 2024 » a financé 5 036 équipements en 2024-2025, pour 165,6 millions d''euros de subventions, sans évaluation des effets d''aubaine. La taxe de 5 % sur les droits de diffusion sportive (« taxe Buffet »), affectée au sport amateur, a rapporté 41,1 millions d''euros en 2025, pour un plafond de 59,7 millions.'
    fourchette: '165,6 M€ pour 5 036 équipements ; taxe Buffet : 41 M€ par an'
  desaccords: Les données publiées décrivent le coût et le recours, mais aucune évaluation publique ne mesure l'effet du Pass'Sport sur le nombre de licenciés ou sur la poursuite de la pratique. Le Sénat estime qu'un critère de ressources aurait été plus pertinent qu'un critère d'âge, ce que retient la campagne 2026-2027. Sur la taxe Buffet, le Sénat propose d'élargir son assiette au streaming plutôt que de relever les prélèvements sur les paris sportifs, en raison de leurs effets sur la santé publique.
