situation:
  texte: 'La culture pèse environ 2 % de l''économie française : en 2024, la valeur ajoutée des branches culturelles (audiovisuel, spectacle vivant, publicité, patrimoine, livre, presse…) atteignait 54,1 milliards d''euros, soit 2,1 % de l''ensemble de l''économie. Les administrations publiques (État, collectivités, organismes publics) ont consacré 19,0 milliards d''euros aux services culturels en 2024, soit 0,6 % de la richesse nationale ([[PIB|pib]]), contre 0,5 % en moyenne dans l''Union européenne. Les collectivités territoriales en assurent une large part : 10 milliards d''euros en 2024, dont 79 % pour les communes de plus de 3 500 habitants et leurs intercommunalités. Dans le projet de budget de l''État pour 2027, la mission « Culture » (patrimoines, création, transmission des savoirs, fonctionnement du ministère) est dotée de 3,65 milliards d''euros de crédits de paiement, soit 2,6 % de moins qu''en 2026. Le [[pass Culture|pass-culture]] a été réformé en mars 2025 : 50 euros à 17 ans et 150 euros à 18 ans, au lieu de 300 euros à 18 ans auparavant, et suppression de la part individuelle à 15 et 16 ans. Le cinéma et l''audiovisuel sont soutenus par le [[CNC|cnc]], financé par des taxes sur la diffusion des œuvres (836 millions d''euros attendus en 2027), et par des [[crédits d''impôt|credits-impot-audiovisuel]] estimés à 498 millions d''euros en 2027.


    L''audiovisuel public (France Télévisions, Radio France, France Médias Monde, Arte France, INA, TV5 Monde) était financé jusqu''en 2022 par la [[contribution à l''audiovisuel public|contribution-audiovisuel-public]] (138 euros par an et par foyer équipé d''un téléviseur en métropole). Elle a été supprimée par la loi de finances rectificative du 16 août 2022 et remplacée par une part du produit de la [[TVA|tva]], mode de financement rendu durable par une loi organique de décembre 2024. Le projet de budget pour 2027 prévoit 3,82 milliards d''euros pour ces sociétés, soit 46,8 millions d''euros de moins qu''en 2026, la baisse portant surtout sur France Télévisions. Les présidents de France Télévisions, Radio France et France Médias Monde sont nommés par l''[[Arcom|arcom]], autorité indépendante de régulation. Le projet de regrouper ces sociétés dans une société commune (« holding » France Médias), adopté par le Sénat, a été rejeté par l''Assemblée nationale le 30 juin 2025, puis adopté à nouveau par le Sénat le 11 juillet 2025 ; il attend une deuxième lecture à l''Assemblée. Une commission d''enquête de l''Assemblée sur la neutralité, le fonctionnement et le financement de l''audiovisuel public a rendu son rapport en avril 2026. Côté médias privés, les règles limitant la concentration datent pour l''essentiel de la loi du 30 septembre 1986 et ne portent pas sur les audiences en ligne. Selon un rapport de l''Assemblée nationale de février 2026, quatre groupes privés (TF1, M6, Canal+ et CMA CGM) éditent 16 des 26 chaînes de la télévision numérique terrestre et réunissent près de 60 % de l''audience télévisée, et les quatre premiers titres de presse représentent 86 % de la diffusion imprimée et numérique ; le même rapport note que la concentration reste inférieure à la moyenne européenne. Un règlement européen sur la liberté des médias impose depuis le 8 août 2025 d''évaluer les concentrations au regard du pluralisme ; il n''a pas encore fait l''objet de mesures d''adaptation en droit français. Le chiffre d''affaires de la presse est passé de 10,6 à 5,6 milliards d''euros entre 2004 et 2024 ; l''État lui consacre 363 millions d''euros d''aides directes en 2027. Une loi renforçant les [[droits voisins|droits-voisins]] des éditeurs de presse face aux plateformes numériques est en fin de navette parlementaire (novembre 2026).


    Le patrimoine compte 45 446 immeubles protégés au titre des [[monuments historiques|monument-historique]] (fin 2025), situés pour 58 % en zone rurale ; près d''un quart sont en mauvais état selon le Sénat. Aux abords de ces monuments, les travaux sont soumis à l''avis des [[architectes des Bâtiments de France|abf]] (189 en poste en 2024). Une loi du 9 mai 2026 organise la restitution à des États étrangers de biens culturels des collections publiques ayant fait l''objet d''une appropriation illicite. Côté création, une mission de l''Assemblée (novembre 2025) relève que 109 000 [[artistes-auteurs|artiste-auteur]] vivent principalement du droit d''auteur et que plus de 60 % gagnent moins que le SMIC annuel. Une œuvre entre dans le [[domaine public|domaine-public]] soixante-dix ans après la mort de son auteur. Face à l''intelligence artificielle, une proposition de loi créant une présomption d''utilisation des œuvres par les fournisseurs d''IA a été adoptée à l''unanimité par le Sénat au printemps 2026 et attend son examen en séance à l''Assemblée.


    Côté sport, 61 % des personnes de 15 ans ou plus pratiquaient une activité sportive au moins une fois par semaine en 2025, soit 7 points de plus qu''en 2018 ; la pratique en club concerne 20 % des pratiquants, contre 24 % en 2018. Les crédits du programme « Sport » de l''État baissent de 8,7 % dans le projet de budget pour 2027 (500,8 millions d''euros). Le [[Pass''Sport|pass-sport]], aide de 50 euros pour l''inscription dans un club, a été plusieurs fois modifié depuis 2021 ; pour 2026-2027, il vise les 6-17 ans des foyers les plus modestes et doit être géré par les caisses d''allocations familiales. La loi du 3 août 2026 sur le sport professionnel modifie la gouvernance des fédérations et des ligues : contrôle d''honorabilité des dirigeants, encadrement des sociétés commerciales créées par les ligues, dialogue avec les supporters. Les Jeux olympiques et paralympiques d''hiver de 2030 se tiendront dans les Alpes françaises.'
