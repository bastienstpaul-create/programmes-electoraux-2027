situation:
  texte: 'Au 1er juillet 2025, la France compte 38,5 millions de logements ordinaires : 82,6 % de résidences principales, 9,7 % de résidences secondaires et 7,6 % de logements vacants. Environ 57,5 % des ménages sont propriétaires de leur logement et 42,5 % locataires. Au 1er janvier 2025, le parc [[social|logement-social]] compte 5,4 millions de logements, soit 15,9 % des résidences principales. Début 2024, les ménages consacrent en moyenne 16,8 % de leurs revenus à leur résidence principale, aides au logement déduites (c''est le [[taux d''effort|taux-d-effort]]) : 25,4 % pour les locataires du parc privé, 24,0 % pour ceux du parc social et 7,4 % pour les propriétaires sans emprunt. Ce taux a baissé en dix ans pour l''ensemble des ménages, mais il a augmenté de 1,1 point pour le quart des ménages les plus modestes. Selon l''Insee, les loyers ont augmenté de 11 % en une dizaine d''années et les prix d''achat des logements de 27 %.


    La construction neuve a fortement reculé depuis 2022. En 2025, 269 700 logements ont été mis en chantier (+3,2 %, après −13,0 % en 2024 et −23,0 % en 2023), un niveau que le service statistique du ministère qualifie de « très bas ». D''octobre 2025 à septembre 2026, 377 834 logements ont été autorisés, soit 9,1 % de moins que la moyenne des cinq années précédentes. Côté logement social, 102 094 logements ont été financés (« agréés ») en 2025, pour 2,76 millions de demandes en attente fin 2024 ; le délai moyen d''obtention était de 19 mois en 2024, et de 39,5 mois en Île-de-France. La [[loi SRU|loi-sru]] impose à certaines communes 20 % ou 25 % de logements sociaux : en 2024, 1 276 des 2 196 communes concernées n''atteignaient pas leur taux cible. En 2025, les aides publiques au logement ont atteint 45,9 milliards d''euros, dont 16,4 milliards d''[[aides personnelles au logement|apl]] et 2,1 milliards de [[MaPrimeRénov''|maprimerenov]] ; les prélèvements liés au logement ont rapporté 103,4 milliards d''euros.


    Dans le parc privé, l''[[encadrement des loyers|encadrement-des-loyers]] s''applique, à titre expérimental, dans 9 collectivités et 70 communes situées en [[zone tendue|zone-tendue]] (Paris, Lille, Lyon, Bordeaux, Montpellier, Grenoble, Pays basque, communes de Seine-Saint-Denis…). Cette expérimentation, créée par la loi Élan de 2018 et prolongée en 2022, arrive à échéance le 23 novembre 2026. L''Assemblée nationale a adopté le 11 décembre 2025 une proposition de loi qui la rend permanente ; le Sénat l''a modifiée le 21 octobre 2026 pour la prolonger seulement de deux ans, sans nouvelles communes. Le texte est de nouveau examiné par les députés en novembre 2026. Par ailleurs, depuis le 1er janvier 2025, un logement classé G au [[DPE|dpe]] ne peut plus être proposé à la location ; ce sera le cas des logements classés F en 2028 et E en 2034. Au 1er janvier 2025, 3,9 millions de résidences principales étaient des [[passoires énergétiques|passoire-energetique]] (12,7 %). La loi de finances pour 2026 a créé un avantage fiscal pour les particuliers qui achètent un logement pour le louer (dispositif « Relance logement »), après la fin du dispositif Pinel en 2024. Un projet de loi « relance et décentralisation du logement », adopté par le Sénat le 8 juillet 2026, est en cours d''examen à l''Assemblée nationale.


    Pour les personnes sans logement, l''État finance un parc d''[[hébergement d''urgence|hebergement-d-urgence]] qui comptait 203 758 places au 31 décembre 2024 ; le gouvernement s''est engagé à le maintenir autour de 203 000 places en 2026. Selon la commission des finances du Sénat, la part des demandes d''hébergement restées sans réponse a augmenté de 14,8 % entre 2022 et 2025. La Fondation pour le logement des défavorisés estime à 350 000 le nombre de personnes sans domicile en 2026 (estimation associative, la dernière enquête de l''Insee datant de 2012). Le second plan « [[Logement d''abord|logement-d-abord]] » (2023-2027) prévoit 30 000 places supplémentaires d''intermédiation locative et 10 000 places en pensions de famille.'
