situation:
  texte: 'Le système de retraite français fonctionne principalement par [[répartition|repartition]] : les cotisations prélevées sur les salaires des personnes qui travaillent servent à payer, la même année, les pensions des retraités. Chaque salarié relève de deux étages obligatoires : un régime de base (l''Assurance retraite pour les salariés du privé) et un régime complémentaire par points ([[Agirc-Arrco|agirc-arrco]] pour les salariés du privé). Au total, une quarantaine de régimes coexistent. En 2025, sur 417 milliards d''euros de ressources, environ deux tiers (277 milliards) venaient des cotisations ; le reste provenait d''impôts et de transferts publics.


    L''âge à partir duquel on peut partir, appelé [[âge légal|age-legal]], dépend de l''année de naissance. Aujourd''hui, il est de 62 ans et 9 mois pour les personnes nées entre le 1er janvier 1963 et le 31 mars 1965, puis il augmente de 3 mois par génération jusqu''à 64 ans pour les personnes nées à partir de 1969. Pour toucher une pension sans réduction ([[taux plein|taux-plein]]) avant 67 ans, il faut aussi une [[durée d''assurance|duree-assurance]] minimale : 170 trimestres pour les générations 1963 à mars 1965, 171 pour la fin de 1965, puis 172 trimestres (43 ans) à partir de 1966. S''il manque des trimestres, une [[décote|decote]] s''applique ; à 67 ans, le taux plein est accordé quel que soit le nombre de trimestres. Ce calendrier résulte de la réforme de 2023, qui portait l''âge légal à 64 ans, modifiée par la [[LFSS|lfss]] pour 2026 : la loi du 30 décembre 2025 a décalé la hausse d''une génération pour les pensions prenant effet à partir du 1er septembre 2026. Ce texte ne prévoit pas de date de fin. En novembre 2026, le Sénat examine le projet de loi de financement de la Sécurité sociale pour 2027 : sa commission des affaires sociales a adopté un amendement qui annule cette suspension. L''Assemblée nationale avait rejeté ce projet le 23 octobre 2026.


    Côté finances, les retraites ont coûté 422 milliards d''euros en 2025, soit 14,1 % de la richesse nationale (PIB) et près d''un quart des dépenses publiques. Le système a enregistré un déficit de 5,1 milliards d''euros (0,2 % du PIB). Selon les projections du [[COR|cor]] de juin 2026, à règles inchangées, ce déficit atteindrait 0,9 % du PIB en 2045 et 2,4 % en 2070. En 2025, on comptait 17,4 millions de retraités de droit direct pour 30,6 millions de personnes en emploi. Fin 2024, la pension brute moyenne de droit direct était de 1 750 euros par mois : 1 380 euros pour les femmes et 2 190 euros pour les hommes. En 2023, le niveau de vie moyen des retraités était proche de celui de l''ensemble de la population.


    L''emploi des seniors progresse depuis le début des années 2000. Au 2e trimestre 2026, 62,1 % des 55-64 ans avaient un emploi. Chez les 60-64 ans, ce taux atteignait 44,4 % en 2025, soit environ 11 points de moins que la moyenne de l''Union européenne. Le taux de chômage de l''ensemble de la population active était de 8,3 % au 2e trimestre 2026.


    Pour un salarié du privé à temps plein, la durée légale du travail est de 35 heures par semaine, soit 1 607 heures par an. Le [[SMIC|smic]] horaire brut est de 12,31 euros depuis le 1er juin 2026, soit 1 867,02 euros brut par mois pour 35 heures (environ 1 478 euros net). Il est revalorisé chaque 1er janvier selon des règles fixées par la loi ([[indexation|indexation]]), et automatiquement en cours d''année si les prix augmentent d''au moins 2 %. Les pensions de base sont, elles, revalorisées chaque 1er janvier en fonction de l''inflation (+0,9 % au 1er janvier 2026).'
