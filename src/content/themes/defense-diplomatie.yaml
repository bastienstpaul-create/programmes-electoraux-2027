situation:
  texte: 'La politique de défense est encadrée par des [[lois de programmation militaire|lpm]], qui fixent les moyens des armées sur plusieurs années. La loi du 1er août 2023 couvre 2024-2030. Elle a été actualisée par la loi du 16 août 2026, qui ajoute 36 milliards d''euros sur 2026-2030 et porte le total programmé à 435,7 milliards d''euros. Les [[crédits de paiement|ae-cp]] de la mission « Défense » (hors pensions) passent de 47,2 milliards d''euros en 2024 à 57,1 milliards en 2026, puis 75,7 milliards prévus en 2030. Le projet de loi de finances pour 2027, en cours d''examen au Parlement, prévoit 63,4 milliards d''euros, soit 6,5 milliards de plus qu''en 2026. Pour comparaison, France Stratégie évalue ces crédits à 32,7 milliards d''euros en 2017. La loi vise à porter l''effort de défense de 2 % du [[PIB|pib]] en 2025 à au moins 2,5 % en 2030, avec un objectif de 3,5 % en 2035.


    Le ministère des Armées doit compter 268 400 emplois en équivalent temps plein en 2027 et 275 000 en 2030. Le gouvernement prévoit 57 500 militaires de la [[réserve opérationnelle|reserve-operationnelle]] fin 2027. La loi vise un réserviste pour deux militaires d''active en 2035. La loi de 2026 a aussi créé un [[service national|service-national]] militaire et volontaire de dix mois, réservé au territoire national. Il doit accueillir 3 000 appelés en 2026, 4 000 en 2027 et 10 000 en 2030, pour un coût prévu de 2,3 milliards d''euros sur 2026-2030. Il s''ajoute au service militaire volontaire (SMV), un dispositif d''insertion créé en 2015.


    La Constitution fait du président de la République le chef des armées. Elle impose au gouvernement d''informer le Parlement d''une intervention militaire à l''étranger dans les trois jours ; au-delà de quatre mois, la prolongation doit être autorisée par le Parlement. La France est le seul pays de l''Union européenne à disposer d''une [[dissuasion nucléaire|dissuasion-nucleaire]] autonome, avec des sous-marins et des avions. La décision d''utiliser l''arme nucléaire appartient au seul président. Depuis la fin des années 1980, la dissuasion représente 12,5 % à 13,5 % des crédits de la mission « Défense ». Le 2 mars 2026, le président de la République a annoncé une hausse du nombre de têtes nucléaires, dont le chiffre ne sera plus publié. Il a aussi annoncé une « dissuasion avancée » : des pays européens partenaires pourront participer aux exercices, et des éléments des forces nucléaires pourront être déployés chez eux, sans partage de la décision. Depuis 2009, la France participe de nouveau au commandement militaire intégré de l''[[OTAN|otan]], qui a fixé en juin 2025 à La Haye un objectif de 5 % du PIB en 2035 (dont 1,5 % pour la sécurité au sens large). Selon les données de l''OTAN reprises par l''Assemblée nationale, la France consacre 2,2 % de son PIB à la défense en 2026. La France n''a pas pris part au traité d''interdiction des armes nucléaires ([[TIAN|tian]]).


    Depuis l''invasion de l''Ukraine par la Russie en février 2022, la France fournit à l''Ukraine des armes, la formation de soldats ukrainiens et l''entretien des matériels livrés. Elle participe aussi aux missions de l''OTAN sur le flanc Est de l''Europe, par exemple en Roumanie. Fin 2025, l''Union européenne a décidé un prêt de 90 milliards d''euros à l''Ukraine pour acheter des équipements entre 2026 et 2028. L''[[aide publique au développement|apd]] de la France s''est élevée à 12,9 milliards d''euros en 2025, soit 0,42 % du revenu national brut, contre 0,49 % en 2023. La loi du 4 août 2021 visait 0,7 % en 2025. Pour 2027, le projet de budget prévoit 3,17 milliards d''euros de crédits de paiement pour la mission « Aide publique au développement », en baisse de 11 %.'
