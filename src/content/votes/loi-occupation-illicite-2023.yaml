theme: logement
titre: Proposition de loi visant à protéger les logements contre l'occupation illicite (deuxième lecture)
objet: Vote sur l'ensemble du texte en deuxième lecture. Le texte alourdit les peines pour occupation illicite d'un logement, crée un délit d'occupation frauduleuse, rend obligatoire la clause de résiliation du bail en cas d'impayés et raccourcit certains délais de procédure.
