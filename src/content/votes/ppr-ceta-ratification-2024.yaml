theme: europe
titre: Proposition de résolution portant sur la procédure de ratification de l'accord commercial entre l'Union européenne et le Canada (CETA)
objet: Vote sur la proposition de résolution (article 34-1 de la Constitution). Le texte invite le gouvernement à poursuivre au Parlement l'examen du projet de loi de ratification, après le rejet de l'article premier par le Sénat le 21 mars 2024 ; l'accord s'applique à titre provisoire depuis 2017.
