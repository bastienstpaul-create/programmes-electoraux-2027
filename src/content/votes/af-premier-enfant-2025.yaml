theme: protection-sociale-pauvrete
titre: Proposition de loi visant à accorder le versement des allocations familiales dès le premier enfant – première lecture
objet: Vote sur l'ensemble de la proposition de loi déposée par le groupe Gauche démocrate et républicaine. Elle ouvre les allocations familiales dès le premier enfant (article L521-1 du code de la sécurité sociale) et demande des rapports au gouvernement.
