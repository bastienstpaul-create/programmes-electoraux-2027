theme: culture-sport-medias
titre: Proposition de loi organique portant réforme du financement de l'audiovisuel public
objet: Vote sur l'ensemble de la proposition de loi organique, adoptée auparavant par le Sénat, en première lecture à l'Assemblée nationale. Elle permet de continuer à financer l'audiovisuel public par une part de la TVA après le 31 décembre 2024.
