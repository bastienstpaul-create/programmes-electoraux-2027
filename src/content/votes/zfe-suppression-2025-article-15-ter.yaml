note: '155 votants. Le texte de la commission mixte paritaire, qui maintenait la suppression (article 37), a été adopté le 14 avril 2026 par 275 voix contre 225 (scrutin n° 6184). Le Conseil constitutionnel a censuré cet article le 21 mai 2026 (décision n° 2026-903 DC), faute de lien avec le projet initial : les ZFE restent en vigueur.'
