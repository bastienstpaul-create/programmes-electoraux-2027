theme: securite-justice-libertes
titre: Projet de loi sur la justice criminelle et le respect des victimes
objet: Vote solennel sur l'ensemble du projet de loi, texte de la commission mixte paritaire (dernière lecture à l'Assemblée). Le texte modifie notamment les règles des cours criminelles et la prise en charge des victimes ; la mesure de « plaider-coupable » criminel avait été retirée avant le vote.
