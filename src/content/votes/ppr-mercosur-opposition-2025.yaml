note: Une résolution de l'article 34-1 exprime la position de l'Assemblée sans pouvoir adresser d'injonction au Gouvernement. Le Conseil de l'UE a autorisé la signature de l'accord le 9 janvier 2026 malgré l'opposition de la France ; le volet commercial s'applique à titre provisoire depuis le 1er mai 2026.
