theme: institutions-democratie
titre: Motion de censure déposée après l'engagement de la responsabilité du Gouvernement (article 49, alinéa 3) sur le projet de loi de financement de la sécurité sociale pour 2025
objet: Motion de censure déposée par Mme Mathilde Panot, M. Boris Vallaud, Mme Cyrielle Chatelain, M. André Chassaigne et 181 députés. Voter pour = renverser le Gouvernement et rejeter le texte. Seuls les votes pour sont décomptés ; il fallait 288 voix (majorité absolue des membres de l'Assemblée).
