theme: energie-climat
titre: Projet de loi relatif à l’organisation de la gouvernance de la sûreté nucléaire et de la radioprotection pour répondre au défi de la relance de la filière nucléaire (texte de la commission paritaire) – vote sur l'ensemble
objet: Adoption définitive par l'Assemblée du texte de compromis du projet de loi sur la gouvernance de la sûreté nucléaire. Voter pour = adopter la loi qui fusionne l'Autorité de sûreté nucléaire (ASN) et l'Institut de radioprotection et de sûreté nucléaire (IRSN) en une seule autorité, l'ASNR (loi n° 2024-450 du 21 mai 2024).
