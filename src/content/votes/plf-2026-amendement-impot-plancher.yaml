theme: finances-publiques
titre: Projet de loi de finances pour 2026 – amendement créant un impôt plancher de 2 % sur les patrimoines de plus de 100 millions d'euros
objet: Vote sur l'amendement n° 2359 (M. Vallaud) et les amendements identiques, après l'article 3, en première lecture. L'exposé de l'amendement prévoit un prélèvement plancher de 2 % pour les patrimoines nets supérieurs à 100 millions d'euros.
