note: 'Scrutin public ordinaire (191 votants), adopté sans voix contre. Devenue la loi n° 2023-566 du 7 juillet 2023, elle n''est jamais entrée en vigueur : son décret d''application n''a pas été publié après une lettre du commissaire européen au marché intérieur du 14 août 2023 jugeant certaines dispositions contraires au droit de l''Union (rapport n° 2341 de l''Assemblée nationale, p. 17).'
