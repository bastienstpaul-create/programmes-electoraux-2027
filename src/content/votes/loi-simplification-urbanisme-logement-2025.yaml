theme: logement
titre: Proposition de loi de simplification du droit de l'urbanisme et du logement (texte de la commission mixte paritaire)
objet: Vote sur le texte de compromis. Il simplifie les procédures d'évolution des documents d'urbanisme (PLU, SCOT), élargit les possibilités de déroger au plan local d'urbanisme pour construire des logements et généralise certains permis.
