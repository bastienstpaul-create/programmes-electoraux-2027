theme: protection-sociale-pauvrete
titre: Projet de loi pour le plein emploi (France Travail, accompagnement et obligations des bénéficiaires du RSA) – première lecture
objet: Vote sur l'ensemble du projet de loi en première lecture à l'Assemblée nationale. Il prévoit l'inscription automatique des demandeurs du RSA à France Travail et un contrat d'engagement avec, en principe, 15 heures d'activité par semaine.
