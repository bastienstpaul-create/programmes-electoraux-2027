note: La suppression figure dans la loi n° 2022-1157 du 16 août 2022 de finances rectificative pour 2022. L'audiovisuel public est depuis financé par une part du produit de la TVA (4,026 milliards d'euros en 2024). Décompte relevé sur la page du scrutin ; les données ouvertes de l'Assemblée répartissent différemment 7 voix « pour » entre Renaissance et les non-inscrits.
