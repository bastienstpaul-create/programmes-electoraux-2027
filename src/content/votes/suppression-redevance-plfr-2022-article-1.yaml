theme: culture-sport-medias
titre: 'Projet de loi de finances rectificative pour 2022 : article 1er (suppression de la contribution à l''audiovisuel public)'
objet: Vote, en première lecture, sur l'article 1er du projet de loi de finances rectificative pour 2022, qui supprime la contribution à l'audiovisuel public (138 euros par an et par foyer en métropole) et prévoit un autre mode de financement des sociétés de l'audiovisuel public.
