theme: logement
titre: Projet de loi relatif à l'accélération et à la simplification de la rénovation de l'habitat dégradé et des grandes opérations d'aménagement (texte de la commission mixte paritaire)
objet: Vote sur le texte de compromis entre députés et sénateurs. Il crée notamment un prêt collectif pour financer des travaux en copropriété et facilite l'expropriation et le traitement des copropriétés dégradées.
