theme: culture-sport-medias
titre: 'Proposition de loi relative à la réforme de l''audiovisuel public et à la souveraineté audiovisuelle : motion de rejet préalable'
objet: Vote, en première lecture, sur la motion de rejet préalable déposée par le groupe Écologiste et Social. Son adoption vaut rejet de la proposition de loi sénatoriale, qui regroupe France Télévisions, Radio France, l'INA et France Médias Monde dans une société commune, France Médias.
