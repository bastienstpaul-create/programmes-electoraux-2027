theme: logement
titre: Proposition de loi visant à améliorer l'accès au logement des travailleurs des services publics (texte de la commission mixte paritaire)
objet: Vote sur le texte de compromis. Il étend à tous les employeurs publics (hôpitaux, collectivités…) la « clause de fonction », qui réserve un logement social à un agent tant qu'il occupe son emploi, et augmente les droits de réservation de logements sociaux de l'État lorsqu'il cède du foncier avec une décote.
