note: Motion rejetée à 9 voix près (278 voix pour, 287 requises). Le texte a donc été considéré comme adopté et est devenu la loi n° 2023-270 du 14 avril 2023. Le même jour, une seconde motion, déposée par Mme Marine Le Pen et 87 députés, a recueilli 94 voix (scrutin n° 1241, https://www.assemblee-nationale.fr/dyn/16/scrutins/1241). Les données ouvertes de l'Assemblée comptent en outre 1 non-votant dans le groupe Renaissance, non affiché sur la page.
