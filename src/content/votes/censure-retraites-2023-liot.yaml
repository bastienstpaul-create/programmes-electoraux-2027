theme: travail-retraites
titre: Motion de censure déposée par M. Bertrand Pancher et 90 députés après l'engagement de la responsabilité du Gouvernement (article 49, alinéa 3) sur le projet de loi de financement rectificative de la sécurité sociale pour 2023 (réforme des retraites)
objet: Motion de censure déposée par M. Bertrand Pancher et 90 députés. Voter pour = renverser le Gouvernement et rejeter le texte de la réforme des retraites. Seuls les votes pour sont décomptés ; la motion devait recueillir 287 voix (majorité absolue des membres de l'Assemblée).
