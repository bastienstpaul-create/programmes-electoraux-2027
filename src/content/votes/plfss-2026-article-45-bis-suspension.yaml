theme: travail-retraites
titre: 'Projet de loi de financement de la sécurité sociale pour 2026 : article suspendant la réforme des retraites de 2023'
objet: Vote sur l'article 45 bis, tel qu'amendé (première lecture). Selon la rapporteure en séance, l'article gèle l'âge de départ à 62 ans et 9 mois pour la génération 1964 et la durée d'assurance requise à 170 trimestres ; l'amendement n° 2686 du Gouvernement l'a étendu notamment aux carrières longues.
