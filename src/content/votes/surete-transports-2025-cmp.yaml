note: Le texte élargit notamment les pouvoirs des agents de sécurité de la SNCF et de la RATP (inspection et fouille des bagages, interdiction d'accès). Après une décision du Conseil constitutionnel du 24 avril 2025, la loi a été publiée au Journal officiel le 29 avril 2025.
