theme: culture-sport-medias
titre: Proposition de loi visant à renforcer l'effectivité des droits voisins des éditeurs et des agences de presse
objet: Vote sur l'ensemble de la proposition de loi, en première lecture. Le texte prévoit notamment que l'Arcom fixe les conditions d'application des droits voisins, puisse arbitrer en cas d'échec des négociations avec les plateformes et sanctionner ces dernières.
