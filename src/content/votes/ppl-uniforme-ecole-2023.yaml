note: Les amendements de suppression ont été adoptés ; l'article unique étant supprimé, la proposition de loi a été rejetée (compte rendu de la deuxième séance du 12 janvier 2023). Pendant le débat, le ministre délégué Franck Riester a rappelé que rendre une tenue obligatoire relève déjà du règlement intérieur de chaque école ou établissement.
