theme: logement
titre: Proposition de loi maintenant provisoirement un dispositif de plafonnement de revalorisation de la variation annuelle des indices locatifs (lecture définitive)
objet: Vote définitif de l'Assemblée. Le texte prolonge jusqu'au premier trimestre 2024 le plafonnement à 3,5 % de la hausse annuelle de l'indice de référence des loyers, décidé à l'été 2022 face à l'inflation.
