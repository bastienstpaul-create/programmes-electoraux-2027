theme: sante-autonomie
titre: Proposition de loi visant à lutter contre les déserts médicaux, d'initiative transpartisane
objet: Vote sur l'ensemble de la proposition de loi en première lecture. Son article 1er soumet l'installation de tout médecin à une autorisation de l'ARS, accordée de droit en zone sous-dotée ou si un médecin de la même spécialité cesse son activité dans la zone.
