theme: culture-sport-medias
titre: Projet de loi relatif à la restitution de biens culturels ayant fait l'objet d'une appropriation illicite (texte de la commission mixte paritaire)
objet: Vote sur l'ensemble du texte de la commission mixte paritaire. Il crée une procédure permettant de faire sortir des collections publiques des biens culturels appropriés de façon illicite, pour les restituer à l'État d'origine, après avis d'un comité scientifique.
