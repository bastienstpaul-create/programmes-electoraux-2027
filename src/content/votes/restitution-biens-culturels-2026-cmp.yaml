note: Devenu la loi n° 2026-351 du 9 mai 2026, publiée au Journal officiel du 10 mai 2026. Deux lois de 2023 avaient déjà organisé la restitution des biens spoliés entre 1933 et 1945 et celle des restes humains des collections publiques.
