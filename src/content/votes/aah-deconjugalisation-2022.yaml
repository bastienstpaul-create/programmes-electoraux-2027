theme: protection-sociale-pauvrete
titre: 'Amendements identiques n° 3 et suivants (après l''article 5) au projet de loi portant mesures d''urgence pour la protection du pouvoir d''achat : déconjugalisation de l''AAH'
objet: Vote, en première lecture, sur l'amendement n° 3 du groupe Les Républicains et les amendements identiques d'autres députés. Ils prévoient que l'AAH soit calculée sans les revenus du conjoint, au plus tard le 1er octobre 2023, et que les bénéficiaires puissent garder l'ancien calcul s'il leur est plus favorable.
