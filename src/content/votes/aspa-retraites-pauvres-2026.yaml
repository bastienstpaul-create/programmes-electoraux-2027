theme: protection-sociale-pauvrete
titre: Proposition de loi visant à renforcer la solidarité envers les retraités pauvres (récupération de l'Aspa sur succession) – première lecture
objet: Vote sur l'ensemble de la proposition de loi déposée par le groupe Gauche démocrate et républicaine. Dans la version adoptée, l'aide des bénéficiaires propriétaires de leur logement (ou logés gratuitement) serait réduite d'un « forfait logement » (environ 40 € par mois pour une personne seule, selon le ministre). En échange, leurs héritiers n'auraient plus à rembourser les sommes versées. Les bénéficiaires actuels pourraient choisir entre l'ancien et le nouveau système.
