theme: europe
titre: Proposition de résolution européenne relative aux suites de la conférence sur l'avenir de l'Europe
objet: Vote sur l'article unique. Le texte adopté appelle notamment à remplacer l'unanimité par la majorité qualifiée au Conseil, sauf pour l'entrée de nouveaux États, et à convoquer une convention pour réviser les traités. Un amendement adopté y ajoute le soutien à un référendum pour toute délégation de souveraineté.
