theme: energie-climat
titre: Projet de loi relatif à l'accélération des procédures liées à la construction de nouvelles installations nucléaires à proximité de sites nucléaires existants et au fonctionnement des installations existantes (texte de la commission mixte paritaire) – vote sur l'ensemble
objet: Adoption définitive par l'Assemblée du texte de compromis du projet de loi d'accélération du nucléaire. Voter pour = adopter la loi, qui simplifie les procédures pour les nouveaux réacteurs et supprime l'objectif de 50 % de nucléaire en 2035 (loi n° 2023-491 du 22 juin 2023).
