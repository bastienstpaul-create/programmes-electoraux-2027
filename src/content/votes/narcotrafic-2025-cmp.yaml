theme: securite-justice-libertes
titre: Proposition de loi visant à sortir la France du piège du narcotrafic
objet: Vote solennel sur l'ensemble de la proposition de loi, texte de la commission mixte paritaire (dernière lecture à l'Assemblée). Le texte crée notamment un parquet national anti-criminalité organisée et des quartiers pénitentiaires dédiés à la criminalité organisée.
