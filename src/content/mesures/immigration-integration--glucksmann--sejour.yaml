intitule: "Carte de séjour pluriannuelle comme titre de référence, régularisation facilitée des travailleurs sans papiers, abrogation de la loi de 2024"
detail: "Le chantier prévoit d'abroger la loi immigration de 2024 et de créer des voies légales d'immigration de travail, avec des accords bilatéraux (français ou européens) avec les pays d'origine. Le chantier 19 (p. 43) cite l'immigration légale de travail parmi les moyens d'augmenter le nombre de cotisants pour les retraites."
