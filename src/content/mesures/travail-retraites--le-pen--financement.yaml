intitule: "Économies de 15 à 20 Md€ sur les retraites ; création d'un pilier de capitalisation"
detail: "Lors de la présentation de sa trajectoire budgétaire le 6 octobre 2026, elle a chiffré 15 à 20 milliards d'euros d'économies sur les retraites par « des corrections de mesures injustes », sans détailler ces mesures, et annoncé un « pilier de capitalisation ». Selon un article Moneyvox du même jour, elle a annoncé une « grande réforme de la capitalisation individuelle et collective » à présenter ultérieurement."
