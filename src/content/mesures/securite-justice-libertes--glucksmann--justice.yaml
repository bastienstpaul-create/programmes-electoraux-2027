intitule: "Doublement des Maisons du droit et de la justice, hausse des effectifs judiciaires et traitement local des délits mineurs"
detail: "Les nouvelles Maisons seraient implantées notamment dans les zones isolées. Les délits mineurs seraient traités localement par la médiation, les travaux d'intérêt général et des « sanctions pédagogiques ». Les effectifs des services judiciaires et pénitentiaires seraient augmentés et revalorisés, sans chiffre."
