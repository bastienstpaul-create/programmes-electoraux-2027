intitule: "Convention citoyenne préparant une assemblée constituante ; suppression de l'article 16 et réforme du Conseil constitutionnel"
detail: "L'article 16 donne au Président des pouvoirs exceptionnels en cas de crise. Le livret « Révolution écologique » (glucks2027.fr, 9 novembre 2026, p. 8 et 19) prévoit d'inscrire à l'article 1 de la Constitution que la République est « aussi écologique ». Rien n'est écrit sur la durée ou le nombre des mandats présidentiels."
citation: "grande convention citoyenne qui jettera les bases d’une assemblée constituante"
