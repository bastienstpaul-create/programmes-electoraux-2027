intitule: "Commande publique orientée vers les produits fabriqués en France, préférence européenne dans les marchés publics de l'UE, fonds régionaux"
detail: "Le chantier prévoit un « indice d'achat local », une loi « Acheter européen » (Buy European Act) pour les marchés publics de l'UE, des fonds régionaux permettant aux Régions d'entrer au capital d'entreprises clés et un soutien aux reprises par les salariés en SCOP. Le livret « Révolution écologique » (p. 16) prévoit un soutien à la production de batteries et de pompes à chaleur adossé à la commande publique."
citation: "orientant la commande publique française avec des critères durables et souverains"
