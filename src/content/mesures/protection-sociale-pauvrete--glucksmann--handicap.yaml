intitule: "Référent social unique pour les personnes handicapées et obligation d'accessibilité de tous les logements neufs rétablie"
detail: "Le référent social unique garantirait la continuité des droits tout au long de la vie. Le chantier 18 (p. 42) prévoit de renforcer l'inclusion des travailleurs handicapés, sans détail. Aucune mesure n'est écrite sur le montant de l'AAH."
citation: "Rétablir l’obligation d’accessibilité universelle pour tous les nouveaux logements"
