intitule: "Leasing social pour 1 million de voitures électriques sur 5 ans à 100 € par mois ; moratoire sur les grands projets routiers d'État"
detail: "Le leasing serait sans apport ; 100 000 véhicules iraient tout de suite aux auxiliaires de vie et soignants en zone rurale. Le projet de Place publique (chantier 12, p. 29) prévoit le moratoire routier, l'affectation des péages à la mobilité durable, une taxe sur les camions étrangers en transit et une taxation des SUV."
