intitule: "Aide financière directe et temporaire pour les professionnels qui dépendent de leur véhicule, d'abord en zone rurale"
detail: "Le candidat écarte une baisse générale des taxes sur les carburants. Le plan « Messmer II » prévoit d'ouvrir le leasing social et le bonus électrique aux voitures d'occasion, d'électrifier les poids lourds et de multiplier les bornes de recharge."
