intitule: "Droit d'initiative citoyenne pour déclencher des référendums locaux et nationaux ; conventions citoyennes généralisées"
detail: "Le même chantier prévoit le droit de vote à 16 ans, le droit de vote des étrangers extra-communautaires aux élections locales et l'inscription automatique sur les listes électorales. Le chantier 11 (p. 28) crée une « Assemblée citoyenne du futur » tirée au sort, chargée de veiller à la prise en compte de l'environnement dans les lois."
