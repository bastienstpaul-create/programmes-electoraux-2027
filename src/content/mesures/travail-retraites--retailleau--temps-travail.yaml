intitule: "Heures au-delà de 1 623 heures par an exonérées de cotisations sociales ; temps de travail annualisé"
detail: "Le seuil passerait de 1 607 à 1 623 heures, soit deux jours de travail rémunérés en plus. Au-delà, seules la CSG et la CRDS seraient prélevées. La majoration relèverait de l'accord d'entreprise et l'exonération d'impôt sur le revenu des heures supplémentaires serait maintenue."
citation: "Le seuil est fixé à 1 623 heures par an"
