intitule: "Taux plein automatique à 65 ans (67 ans aujourd'hui), quel que soit le nombre de trimestres"
detail: "L'âge d'annulation de la décote passerait de 67 à 65 ans, puis évoluerait avec l'espérance de vie. Les modalités ne sont pas encore fixées. Aucune position n'a été trouvée sur le nombre de trimestres requis avant cet âge."
