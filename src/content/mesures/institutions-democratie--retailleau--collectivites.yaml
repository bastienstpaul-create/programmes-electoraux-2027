intitule: "Enseignement professionnel et orientation transférés aux régions, santé scolaire aux départements"
detail: "Le livret Logement (p. 15-16) prévoit 9 000 € de TVA reversés à la commune pour chaque logement neuf, et des contrats de construction entre le préfet et les intercommunalités. Le livret Produire plus (p. 26) confie aux régions la compétence de développement économique et le pilotage d'un fonds industriel."
citation: "Aux régions reviendront ainsi l’enseignement professionnel et l’orientation"
