intitule: "Plan national pour l'alimentation solidaire et expérimentations locales de Sécurité sociale de l'alimentation"
detail: "Le plan faciliterait la récupération des invendus par les associations. Le chantier 15 (p. 35) prévoit une tarification sociale de l'eau, avec une aide automatique quand la facture dépasse 3 % des revenus. Le chantier 31 (p. 64) lance un programme « logement d'abord » contre le sans-abrisme."
