intitule: "Pas d'impôt sur le revenu pendant les trois premières années de l'enfant pour les classes moyennes"
detail: "Concerne les 4e à 6e déciles et le début du 7e ; les familles plus aisées qui travaillent auraient une réduction d'impôt de 3 000 € par an sur la même période. Selon l'article du site du 08/10/2026, les foyers payant moins de 3 000 € d'impôt seraient exonérés. Les heures travaillées en plus après accord dans l'entreprise seraient exonérées d'impôt sur le revenu (page « prospère »)."
citation: "Supprimer l'impôt sur le revenu pendant les trois premières années de l'enfant"
