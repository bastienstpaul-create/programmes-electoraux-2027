intitule: "Prix planchers pour garantir le revenu agricole, fin des contournements d'EGalim et aides de la PAC plafonnées"
detail: "La PAC serait réformée pour ne plus verser les aides à l'hectare, avec un plafonnement « comme en Espagne » au profit des petites fermes, des jeunes installés et des éleveurs. Le chantier crée un « revenu de transition écologique » et une autorité européenne de contrôle des prix alimentaires."
