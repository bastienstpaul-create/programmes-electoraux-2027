intitule: "Rite de passage républicain à la majorité en remplacement du service militaire et départ de tous les élèves en séjour"
detail: "Le texte propose de « travailler à » ce rite. Un « passeport pour l'émancipation citoyenne » généraliserait classes découvertes, colonies et séjours dans l'UE. Le chantier 18 (p. 42) crée des guichets uniques jeunesse. Le livret « Révolution écologique » (p. 13) prévoit un pass mobilité à 1 € par jour pour les moins de 25 ans."
citation: "recréer un rite de passage républicain et universel autour de la majorité"
