intitule: "Procédure prioritaire et délais de jugement contraints pour les litiges d'urbanisme, consignation exigée pour former un recours"
detail: "Seule mesure trouvée sur les délais de la justice, limitée à l'urbanisme. Le livret agriculture (p. 26-27) prévoit aussi des délais de recours raccourcis contre les projets agricoles. Aucune mesure sur le budget ou les effectifs de la justice."
