intitule: "Capitalisation collective pour tous les salariés ; plan d'épargne retraite avec 500 € versés par l'État au premier emploi"
detail: "Il propose de généraliser la capitalisation collective, qui existe déjà pour les fonctionnaires, et d'ouvrir un plan d'épargne retraite à chaque Français. L'État y ferait un premier versement de 500 € dès le premier emploi. Le programme exclut aussi une hausse des cotisations. Ailleurs sur le site, la capitalisation retraite doit servir à financer des entreprises technologiques."
