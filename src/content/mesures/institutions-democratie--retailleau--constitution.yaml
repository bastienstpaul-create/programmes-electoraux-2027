theme: institutions-democratie
axe: constitution
candidat: retailleau
statut: programme
intitule: "Révision constitutionnelle inscrivant l'agriculture parmi les intérêts fondamentaux de la Nation et supprimant le principe de précaution"
detail: "Une loi organique préciserait que l'agriculture fait partie des intérêts fondamentaux de la Nation. Une autre loi organique interdirait toute sur-transposition des directives européennes (p. 16). Aucune mesure sur le mandat présidentiel."
citation: "Réviser la Constitution pour y inscrire l’agriculture comme intérêt fondamental de la Nation"
