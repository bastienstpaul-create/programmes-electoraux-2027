intitule: "Droits de donation et de succession sur les entreprises différés tant que l'outil de production n'est pas cédé"
detail: "Les structures purement patrimoniales ou financières sont exclues. Dons familiaux exonérés portés à 150 000 € avant 30 ans et 100 000 € avant 40 ans, pendant trois ans (Logement, p. 27). Aucune mesure trouvée sur l'IFI."
citation: "tant qu’il n’y a pas de cession, il n’y a pas d’imposition"
