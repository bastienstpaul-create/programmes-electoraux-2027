theme: education-recherche-jeunesse
axe: recherche
candidat: retailleau
statut: programme
intitule: "Financement public de la recherche conditionné à un débouché industriel et concentré sur sept secteurs stratégiques"
detail: "Jusqu'à 2 000 emplois de chercheurs seraient redéployés vers les sciences et technologies. Le crédit d'impôt recherche serait maintenu avec davantage de contrôles. Les sept secteurs : énergies du futur, IA, biotechnologies, matériaux et batteries, micro-électronique, cybersécurité, quantique."
citation: "L’argent public ne financera plus une recherche sans perspective industrielle."
