statut: programme
intitule: "Admission au séjour par un système à points inspiré du Canada, dans des quotas votés tous les deux ans par le Parlement"
detail: "Critères annoncés : offre d'emploi stable, logement, maîtrise du français, connaissance et respect des valeurs. Les quotas seraient fixés par métier, origine géographique et nationalité, à partir des besoins identifiés par les partenaires sociaux. Le regroupement familial serait durci (revenus, logement, durée de résidence) et une « préférence travail » inscrite dans la Constitution."
citation: "une immigration choisie par système à points, inspirée du système canadien"
