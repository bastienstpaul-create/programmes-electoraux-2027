intitule: "Révision de la doctrine du maintien de l'ordre et généralisation des récépissés de contrôle d'identité"
detail: "La généralisation des récépissés figure au chantier 40 (p. 80). Le chantier 21 (p. 47) crée un délit de « désinformation organisée » dans la loi de 1881 sur la liberté de la presse. Le chantier 29 prévoit aussi une nouvelle stratégie contre la radicalisation et le jugement en France des djihadistes rapatriés."
