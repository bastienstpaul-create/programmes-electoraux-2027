intitule: "Droits et indemnité pour les proches aidants, Ehpad recentrés sur les personnes très dépendantes et hébergements diversifiés"
detail: "Le chantier prévoit un service de relais et de répit pour les aidants et de « travailler à » une indemnité d'aidant familial. Il développerait les résidences autonomie, l'habitat intergénérationnel et la colocation médicalisée. Aucun financement chiffré n'est donné."
