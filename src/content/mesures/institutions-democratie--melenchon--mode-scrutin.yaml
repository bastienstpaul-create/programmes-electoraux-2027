intitule: "Élection de l'Assemblée nationale au scrutin proportionnel, par une loi ordinaire"
detail: "Le texte place cette mesure « par la loi », hors Constituante, sans préciser le type de proportionnelle. Autres mesures : droit de vote à 16 ans, reconnaissance du vote blanc, vote obligatoire et seuil de votes exprimés pour valider une élection, parrainages citoyens à la place des 500 parrainages d'élus."
