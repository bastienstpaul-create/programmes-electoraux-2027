intitule: "Protection sociale moins financée par le travail, pour augmenter le salaire net"
detail: "Le programme ne précise pas le mécanisme. Les heures travaillées en plus après décision dans l'entreprise seraient exonérées de cotisations sociales et d'impôt sur le revenu. Le programme l'estime à environ 1 000 € de plus par an au SMIC pour deux heures de plus par semaine. Aucune mesure sur le niveau du SMIC n'a été trouvée. Hors de ce thème : hausse de 20 % de la rémunération moyenne des enseignants (rubrique « Pour une France plus attentive à ses enfants »)."
