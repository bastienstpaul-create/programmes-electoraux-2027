intitule: "TVA au taux normal de 20 % pour les nouvelles installations photovoltaïques"
detail: "L'électricité sortirait du dispositif des certificats d'économies d'énergie, décrit comme une « fiscalité indirecte » (p. 28-29). Une part de TVA de 9 000 € par logement neuf serait reversée aux communes (Logement, p. 15). Aucune mesure sur les taux généraux de TVA."
citation: "retour au taux normal de TVA à 20 %"
