intitule: "Refus d'appliquer le pacte européen sur la migration et l'asile et les règles européennes sur les retours"
detail: "Le chapitre 1 de la partie 6 cite le pacte et le règlement dit « retour » parmi les règles européennes que la France refuserait d'appliquer. Il propose un dispositif européen d'accueil des demandeurs d'asile et des sanctions contre les États qui ne respectent pas les droits humains. Aucune mesure sur les contrôles aux frontières ou Frontex."
