intitule: "SMIC porté à 1 600 € net en deux ans ; conférences salariales par branche"
detail: "Le chantier 16 prévoit aussi des conférences salariales, en priorité pour les métiers précaires et pénibles, et l'indexation du point d'indice des fonctionnaires sur l'inflation. Public Sénat (30/10/2026) rapporte que le candidat promet désormais un SMIC à 1 700 euros net et une baisse de la CSG sur les salaires. Il propose aussi un minimum de 1 000 euros pour les stages de plus de deux mois."
