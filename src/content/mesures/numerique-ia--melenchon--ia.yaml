intitule: "Autorité nationale de l'IA délivrant une autorisation de mise sur le marché aux systèmes à haut risque"
detail: "Autres mesures : mission nationale de maîtrise de l'IA, interdiction des IA simulant une relation affective, signalement obligatoire des contenus produits par une IA, interdiction de certains usages (identification biométrique, police prédictive, notation pour le crédit). Le chapitre 2 de la partie 6 propose un traité international sur l'IA."
