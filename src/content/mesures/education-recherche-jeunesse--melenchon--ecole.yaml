intitule: "Gratuité de l'école publique (cantine, transport, périscolaire, manuels, fournitures) et baisse des effectifs par classe"
detail: "Objectif : faire mieux que la moyenne européenne de 19 élèves par classe. Autres mesures : scolarité obligatoire jusqu'à 18 ans, abrogation du « choc des savoirs », nouvelle carte scolaire, malus financier pour les établissements privés sous contrat contribuant à la ségrégation, abrogation de la loi Carle."
