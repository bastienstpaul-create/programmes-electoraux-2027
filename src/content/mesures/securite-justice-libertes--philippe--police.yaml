intitule: "Pouvoir de sanction pénale confié aux maires pour les petites infractions"
detail: "Le plan contre le narcotrafic publié sur horizonsleparti.fr (21/05/2026) prévoit aussi que les polices municipales puissent sanctionner l'usage de stupéfiants et que les maires aient des pouvoirs de fermeture administrative équivalents à ceux du préfet. Aucune mesure sur les effectifs de police ou de gendarmerie."
