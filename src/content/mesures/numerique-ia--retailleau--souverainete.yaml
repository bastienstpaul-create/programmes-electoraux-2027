intitule: "Préférence européenne dans la commande publique numérique, données sensibles en cloud souverain, data centers de 1 GW en 2030"
detail: "Les outils extra-européens de l'État dans les fonctions régaliennes seraient remplacés selon un calendrier. Un « pourcentage de souveraineté » deviendrait critère d'attribution des marchés. La capacité de calcul viserait 4 GW vers 2035-2038, et un plan de cybersécurité serait piloté par l'ANSSI (p. 35)."
citation: "Nous appliquerons à l’IA et au numérique le principe de Buy European First"
