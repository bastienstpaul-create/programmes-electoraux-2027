statut: programme
intitule: "Âges de départ maintenus pour raisons de santé et carrières longues ; pénibilité renvoyée à la négociation ; retraite progressive"
detail: "Les âges de départ restent inchangés pour les personnes en mauvaise santé : 55 ans en situation de handicap, 60 ans en incapacité permanente, 62 ans en invalidité. Les départs anticipés pour carrière longue sont maintenus et la pénibilité serait négociée avec les partenaires sociaux. Pour l'emploi des seniors : retraite progressive, cumul emploi-retraite, et formation et accompagnement des salariés après 50 ans."
citation: "maintenir l'âge de départ des personnes en mauvaise santé"
