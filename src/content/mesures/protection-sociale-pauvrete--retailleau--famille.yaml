theme: protection-sociale-pauvrete
axe: famille
candidat: retailleau
statut: programme
intitule: "Revenu familial de 240 € par mois et par enfant jusqu'à 18 ans, doublé pour le troisième, à la place de 12 dispositifs"
detail: "La PAJE, l'ASF, les APL et l'AEEH seraient conservées. Le congé de naissance serait étendu jusqu'aux six mois de l'enfant, indemnisé à 70 % du salaire (p. 18). Le crédit d'impôt famille ne serait plus plafonné et l'aide de l'employeur à la garde serait exonérée jusqu'à 7 000 € par an (p. 21)."
citation: "un Revenu familial (RF) de 240 euros versé chaque mois à tous"
chiffrage_annonce: "Revenu familial 40,3 Md€ pour 41 Md€ de dispositifs supprimés ; troisième enfant ≈ 1,5 Md€ ; congé étendu ≈ 700 M€ ; mesures de garde ≈ 800 M€"
