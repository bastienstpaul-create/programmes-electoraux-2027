intitule: "Non-remplacement d'un tiers des fonctionnaires partant à la retraite et effort d'économies porté à 50 % sur les dépenses sociales"
detail: "Répartition de l'effort : 50 % sur les dépenses sociales, un quart sur l'État et les collectivités, un quart par la croissance. Fusion ou suppression de « dizaines » d'opérateurs et d'agences ; dépenses de santé stabilisées ; 50 Md€ d'aides publiques aux entreprises en moins."
