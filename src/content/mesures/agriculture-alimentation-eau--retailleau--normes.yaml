intitule: "Néonicotinoïdes dont l'acétamipride autorisés s'ils le sont ailleurs dans l'UE, abandon de l'objectif Ecophyto de -50 %"
detail: "Le principe de précaution serait supprimé de la Charte de l'environnement (p. 12). L'ANSES appliquerait automatiquement les autorisations des autres États membres (p. 14). Une loi organique interdirait les sur-transpositions (p. 16)."
