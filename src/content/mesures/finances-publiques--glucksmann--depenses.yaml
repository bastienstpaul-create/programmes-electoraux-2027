intitule: "Audit préalable à chaque investissement nouveau, suppression des dépenses jugées inefficaces et encadrement des cabinets de conseil"
detail: "Le projet annonce en même temps un « réinvestissement stratégique de la puissance publique » (sécurité, services publics, transition écologique). Le livret « Révolution écologique » (p. 8) prévoit 200 milliards d'euros d'argent public sur le quinquennat pour la transition (voir le thème Énergie et climat). Le chantier 22 (p. 48) encadre le recours aux cabinets de conseil."
