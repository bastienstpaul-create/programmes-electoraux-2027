theme: institutions-democratie
axe: parlement
candidat: retailleau
statut: programme
intitule: "Loi limitée aux principes, détail renvoyé au règlement, et autorité indépendante dotée d'un veto sur les règles nouvelles"
detail: "Toute règle nouvelle ayant un impact économique passerait par une étude d'impact indépendante, un test PME et la règle « un pour un » en valeur. Une autorité indépendante de contrôle préalable pourrait bloquer les règles jugées excessives, y compris celles du Parlement. Aucune mesure sur l'article 49.3."
citation: "Le reste relèvera du règlement, pour être plus aisément modifiable et adaptable."
source:
