intitule: "Baisse de 40 Md€ des prélèvements sur les entreprises, dont suppression de la C3S et de la CVAE"
detail: "La part industrielle de la CFE serait exonérée et le forfait social recentré sur la participation légale. Le crédit d'impôt recherche serait maintenu et le cadre fiscal garanti pendant cinq ans. Le livret IA (p. 15) supprime la contribution patronale sur les actions gratuites, BSPCE et stock-options."
citation: "nous réduirons de 40 milliards d’euros notre handicap fiscal"
