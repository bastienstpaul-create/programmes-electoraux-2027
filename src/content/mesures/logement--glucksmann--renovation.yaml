intitule: "Un million de pompes à chaleur à 1 € par jour, relance et simplification de MaPrimeRénov'"
detail: "Mesure des cent premiers jours, en priorité pour les logements chauffés au fioul ou au gaz ou les plus exposés aux fortes chaleurs. Le projet de Place publique prévoit de relancer et simplifier MaPrimeRénov' (chantier 6, p. 17) et d'accélérer la rénovation des passoires thermiques (chantier 31, p. 64)."
