intitule: "Hausse du budget de l'UE financée par de nouvelles ressources propres et emprunt européen pour la transition écologique"
detail: "Le texte prévoit d'augmenter « massivement » le budget de l'Union, sans montant. Le livret « Révolution écologique » (p. 10) propose un grand emprunt européen pour la transition. Le chantier 2 (p. 11) propose un fonds de défense de 500 milliards d'euros par emprunt commun."
