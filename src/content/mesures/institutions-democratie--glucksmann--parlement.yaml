intitule: "Investiture du Premier ministre par un vote de l'Assemblée et motion de censure « constructive », présentée comme mettant fin au 49.3"
detail: "Censurer un gouvernement exigerait de proposer un successeur. Le chantier prévoit aussi un contrôle renforcé du Parlement (décrets d'application, évaluation du budget, droit d'enquête élargi) et la fin de l'article 40, qui limite les amendements des parlementaires augmentant les dépenses."
