intitule: "Principe de non-régression : règles européennes transposées seulement si elles améliorent les protections sociales et environnementales"
detail: "Le principe serait voté par le Parlement puis inscrit dans la Constitution. Il servirait à refuser notamment les plans « omnibus », le « 28e régime », le pacte sur la migration et la directive sur les travailleurs détachés. S'y ajoute un « droit d'objection souveraine »."
