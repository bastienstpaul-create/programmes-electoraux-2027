intitule: "Suppression ou recentrage dès l'élection de 50 règles pour les entreprises, dont le seuil de 50 salariés porté à 100"
detail: "Le CSE ne serait obligatoire qu'à partir de 50 salariés, sauf accord. Le code du travail serait réduit à 50 principes, le reste relevant de la négociation collective (p. 12-13). L'erreur non intentionnelle ne serait plus sanctionnée (p. 17)."
citation: "les cinquante règles qui pénalisent le plus la production seront supprimées ou strictement recentrées"
