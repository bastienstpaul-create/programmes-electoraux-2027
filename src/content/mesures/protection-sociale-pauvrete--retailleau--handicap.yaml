theme: protection-sociale-pauvrete
axe: handicap
candidat: retailleau
statut: programme
intitule: "Accompagnants des élèves handicapés (AESH) employés par l'État sur tout le temps de l'enfant, avec un contrat unique"
detail: "Le contrat unique doit permettre un temps complet pour chaque AESH qui le souhaite. Les familles auraient un seul interlocuteur et des notifications valables pour un cycle. Le repérage des troubles serait enseigné à tous les futurs professeurs et des places seraient créées en établissements spécialisés. Le plafond des aides à 70 % du SMIC ne concernerait pas le handicap (Travail gagnant, p. 29)."
citation: "Nous ferons de l’accompagnement un vrai métier."
source:
