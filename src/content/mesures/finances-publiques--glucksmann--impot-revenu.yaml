intitule: "Chantier fiscal pour rééquilibrer l'imposition entre travail, capital, héritage et retraites, sans barème de l'impôt sur le revenu précisé"
detail: "Le projet vise une fiscalité qui ne favorise plus « les héritiers ou les retraités aisés » par rapport aux travailleurs. Le chantier cadre (p. 85) reprend ce « rééquilibrage » entre travail, capital et héritage. Aucune modification des tranches ou des taux de l'impôt sur le revenu n'est écrite."
citation: "Lancer un grand chantier fiscal visant à rééquilibrer la répartition de la taxation"
