intitule: "Santé mentale des jeunes déclarée priorité nationale, fonds territorial de prévention et plan de prévention de long terme"
detail: "Le chantier prévoit un dépistage précoce des troubles psychiques et addictologiques, le recrutement de spécialistes et plus de places en établissements. Les maladies chroniques (cancers, maladies cardiovasculaires, diabète) seraient une priorité de prévention et de recherche."
