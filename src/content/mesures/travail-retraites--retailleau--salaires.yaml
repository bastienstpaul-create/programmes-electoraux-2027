intitule: "15 Md€ d'économies du plan travail reversés aux salariés en hausse du salaire net"
detail: "Les mesures du livret dégageraient au moins 30 Md€. La moitié irait aux salariés en pouvoir d'achat, l'autre moitié aux entreprises via une baisse du coût du travail. Aucune mesure n'a été trouvée sur le niveau du SMIC."
citation: "redonnés pour moitié aux salariés, sous forme de pouvoir d’achat supplémentaire"
