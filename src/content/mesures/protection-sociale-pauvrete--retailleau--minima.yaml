theme: protection-sociale-pauvrete
axe: minima
candidat: retailleau
statut: programme
intitule: "RSA, prime d'activité et ASS fusionnés dans un revenu d'incitation à l'activité de 300 €, plus 250 € sous condition d'activité"
detail: "Le « RIA socle » de 300 € par mois concernerait les adultes de moins de 65 ans en situation régulière. Il passerait à 550 € avec au moins 15 heures hebdomadaires de formation ou de recherche d'emploi, En cas de reprise d'emploi, il serait réduit de 30 % du salaire et s'annulerait au-delà de 1 833 € de revenus d'activité. Le total des aides non contributives serait plafonné à 70 % du SMIC net par adulte, hors handicap, dépendance et vieillesse (p. 29)."
citation: "créer un Revenu d’incitation à l’activité (RIA), en fusionnant trois aides existantes"
chiffrage_annonce: "2 Md€ de gains par an pour le RIA (tableau p. 35)"
