intitule: "Taxes à l'importation ciblées sur les produits chinois vendus à perte et contrôle des investissements chinois dans les infrastructures"
detail: "Produits cités : acier, voitures électriques, panneaux solaires. Une entreprise chinoise exclue des marchés publics d'un pays de l'UE devrait l'être automatiquement dans les autres. D'autres fiches prévoient des clauses miroir dans tous les accords commerciaux et le refus du traité avec le Mercosur."
