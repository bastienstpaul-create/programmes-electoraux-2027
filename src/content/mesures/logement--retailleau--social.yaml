theme: logement
axe: social
candidat: retailleau
statut: programme
intitule: "Logement social limité aux ménages sous le revenu médian, priorité aux actifs et aux familles, quotas SRU supprimés"
detail: "Le plafond serait d'environ 25 000 € par an pour une personne seule, soit 50 % des ménages éligibles au lieu de 70 %. L'avis favorable du maire serait requis et la situation des locataires réexaminée tous les cinq ans. Les objectifs SRU seraient fixés par contrat avec le préfet et le DALO éteint progressivement."
citation: "l’accès au logement social sera désormais limité aux ménages dont les ressources sont inférieures"
source:
  url: https://republicains.fr/wp-content/uploads/2026/05/LR_Logement.pdf
  titre: "Les Républicains, « Nos propositions pour la France – Se loger mieux et moins cher ! », p. 39-43"
  date_consultation: 2026-11-10
