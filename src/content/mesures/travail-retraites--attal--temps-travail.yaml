intitule: "Suppression du plafond légal d'heures supplémentaires ; semaine de quatre jours là où c'est possible"
detail: "Le plafond visé est le contingent de 220 heures par an et par salarié, qui s'applique à défaut d'accord collectif. La semaine de quatre jours se ferait à nombre d'heures mensuel constant. L'organisation du travail serait renvoyée à la négociation de branche et d'entreprise, dans une « Constitution du travail » d'environ 50 pages."
