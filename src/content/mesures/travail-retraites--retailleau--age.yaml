intitule: "Âge minimal de départ à 63 ans, avec décote de 7 % par an avant le taux plein"
detail: "L'âge de 63 ans ne serait pas indexé sur l'espérance de vie. Les personnes ayant commencé tôt avec une carrière complète pourraient partir à taux plein à 63 ans. Une exonération de cotisations les inciterait à travailler jusqu'à 65 ans."
