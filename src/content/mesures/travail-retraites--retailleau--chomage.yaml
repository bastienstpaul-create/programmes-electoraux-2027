statut: programme
intitule: "Règles chômage de juin 2024 appliquées ; indemnisation des ruptures conventionnelles limitée à six mois et plafonnée"
detail: "L'indemnisation des travailleurs frontaliers serait alignée sur des salaires français équivalents. L'allocation serait plafonnée et dégressive pour l'alternance emploi-chômage. Le livret prévoit aussi un revenu d'incitation à l'activité (fusion RSA, prime d'activité, ASS) et un plafonnement des aides sociales à 70 % du SMIC net par adulte."
citation: "Limiter à six mois et plafonner l’indemnisation des ruptures conventionnelles"
chiffrage_annonce: "Environ 13 milliards d'euros d'économies par an"
