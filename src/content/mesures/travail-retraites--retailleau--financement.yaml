intitule: "Part de retraite par capitalisation pour les nouveaux entrants sur le marché du travail"
detail: "Il annonce un rendement d'au moins 4 %. Selon Public Sénat (30/09/2026), cette part représenterait « dans un premier temps » 25 à 30 % de la retraite des nouveaux entrants. Elle serait alimentée par 0,5 % du salarié et 0,5 % de l'employeur, pris sur des baisses de cotisations. Le forfait social serait supprimé."
