intitule: "Économies attendues de l'IA dans l'administration, environ 15 Md€ par an à terme, affectées à la réduction du déficit"
detail: "Aucune trajectoire chiffrée du déficit public n'est publiée. Les économies du livret Travail gagnant (au moins 30 Md€) seraient restituées aux salariés et aux entreprises et non affectées au déficit (p. 16)."
