intitule: "Réforme institutionnelle soumise au vote, inscrivant dans la Constitution un délai de réponse de l'administration de deux mois"
detail: "En l'absence de réponse dans les deux mois, le silence vaudrait accord. La même réforme prévoit un recours unique et une décision définitive en 18 mois au plus pour tout projet, une nouvelle organisation territoriale et une réforme des nominations aux hautes fonctions qui « passe par la Constitution ». Aucune mesure sur la durée ou le nombre des mandats présidentiels."
citation: "inscrire dans la Constitution un principe de rapidité"
