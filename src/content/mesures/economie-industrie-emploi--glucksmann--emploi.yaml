intitule: "Généralisation de Territoires zéro chômeur de longue durée, CDI d'insertion harmonisé et guichet unique territorial pour l'emploi"
detail: "Le guichet unique serait piloté par France Travail. Le chantier crée aussi des guichets uniques pour les jeunes et des comités locaux pour l'emploi. Le chantier 25 (p. 53) prévoit d'abroger la dernière réforme de l'assurance chômage. Pour la formation, le chantier 10 (p. 25) propose un « capital formation universel » activable à tout moment de la vie."
