detail: "Le chantier 35 (p. 72), consacré à la culture, ne contient pas de mesure sur le patrimoine bâti ou les monuments. Il prévoit seulement de diversifier les noms de rues et de lieux publics et une politique de coopération mémorielle sur la colonisation."
