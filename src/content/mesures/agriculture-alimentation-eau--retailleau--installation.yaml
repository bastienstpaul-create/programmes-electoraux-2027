intitule: "Droits de mutation différés à la transmission d'une exploitation tant qu'elle produit, foncier porté par la SAFER"
detail: "Le foncier serait loué par bail rural de long terme pendant que l'exploitant achète le matériel. L'enseignement agricole augmenterait de 30 % d'ici 2030, avec 75 % de vétérinaires formés en plus par rapport à 2017."
citation: "Une exploitation ne sera pas taxée tant qu’elle continue de produire."
