intitule: "Départ à 60 ans avec 40 annuités si début avant 20 ans ; plus de cotisations retraite et chômage après l'âge légal"
detail: "Au débat du Medef (27 août 2026), elle a proposé un départ à 60 ans après 40 ans de cotisation pour ceux ayant commencé à travailler avant 20 ans, ainsi que la suppression des cotisations chômage et retraite pour les personnes ayant atteint l'âge légal qui continuent de travailler (Public Sénat, 30 octobre 2026)."
