intitule: "Taxation automatique des superprofits des multinationales et plafonnement du crédit d'impôt recherche pour les grands groupes"
detail: "Le chantier 9 (p. 24) recentre le crédit d'impôt recherche sur les PME, les ETI industrielles et les jeunes entreprises innovantes. Le livret « Révolution écologique » (p. 9) soutient une taxe européenne sur les superprofits pétroliers et gaziers. Le chantier 17 (p. 41) envisage une « taxe Amazon » sur les grandes plateformes de commerce en ligne."
