intitule: "Réforme du congé parental, service public de la petite enfance et droit opposable à un mode de garde"
detail: "La réforme du congé parental viserait plus d'égalité entre les parents. Le chantier 27 (p. 57) prévoit un encadrement strict des crèches privées, avec un statut de crèches « sous contrat ». Rien n'est écrit sur les allocations familiales ou le quotient familial."
