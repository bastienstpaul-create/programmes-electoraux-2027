intitule: "Augmenter de 250 euros nets par mois le salaire médian dès début 2027 en supprimant des cotisations salariales (« droit au brut »)"
detail: "La hausse serait financée par des économies sur l'assurance chômage et les indemnités journalières, sans hausse du coût du travail pour l'employeur. Autres mesures : aide directe aux professionnels qui dépendent d'un véhicule ; bouclier tarifaire sur l'eau du quotidien ; stabilité des prix de l'électricité pendant cinq ans."
