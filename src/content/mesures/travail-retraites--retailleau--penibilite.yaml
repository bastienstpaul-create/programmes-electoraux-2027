theme: travail-retraites
axe: penibilite
candidat: retailleau
statut: programme
intitule: "Seniors ayant tous leurs trimestres exonérés de cotisations retraite et chômage ; cumul emploi-retraite modifié"
detail: "Après l'âge légal, un cumul emploi-retraite modifié remplacerait la surcote : exonération de cotisations hors CSG-CRDS, et pension réduite de 30 % du revenu d'activité. Sur LCI (22/09/2026), il a aussi annoncé que la pénibilité serait prise en compte via les dispositifs existants, après consultation des partenaires sociaux (LCP)."
citation: "une exonération de cotisations retraite et chômage accroît le salaire net"
chiffrage_annonce: "Environ +300 € nets par mois pour le salarié et -450 € de coût pour l'employeur, au salaire médian"
